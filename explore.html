<!-- The header's account control must not flash. This class makes its slot
     invisible without collapsing it, so the row keeps its height from the
     first paint and nothing shifts when auth finally answers. The timer
     removes it unconditionally: a script that never runs, or throws, still
     leaves a readable header rather than a hidden one. See css/app.css. -->
<script>
(function () {
  try {
    var h = document.documentElement;
    if (!h) return;
    h.className = (h.className ? h.className + " " : "") + "fb-hdr";
    setTimeout(function () {
      try { h.className = h.className.replace(/(^|\s)fb-hdr(\s|$)/g, " "); } catch (e) {}
    }, 4000);
  } catch (e) {}
})();
</script>
</head>
<body>

<main class="lib">
  <header class="mast">
    <p class="mark">FACTBOX</p>
    <!-- Two tabs. "Home" and "Explore" were two answers to one question and
         Explore was the better of them, so its shelves moved to the bottom of
         this page and the tab went. Account is one icon: from the reader's
         side "sign in" and "sign up" are the same errand, and the page behind
         it works out which of the two they need. -->
    <nav class="tabs" aria-label="Sections">
      <a href="/" aria-current="page">Explore</a>
      <a href="/library">Library</a>
      <span class="acct" id="fb-acct"></span>
    </nav>
  </header>

  <!-- Real copy, replaced by the render. Never a blank shell: if every script
       below fails, this is still a page with words and a way out. -->
  <div id="td">
    <h1 class="td-h1">Be disgustingly well-informed.</h1>
    <p class="td-sub">Trade five minutes of scrolling for something worth
      remembering. <a href="/stories">Start with season one</a>.</p>
  </div>
</main>

<script src="/js/progress.js"></script>
<script src="/js/access.js"></script>
<script src="/js/gate.js"></script>
<script src="/js/today.js"></script>
<script>
(function () { try { FBT.boot("td"); } catch (e) {} })();
</script>
<script type="module" src="/js/auth.js"></script>
<script src="/js/acct.js"></script>
<script src="/js/analytics.js"></script>
</body>
</html>
