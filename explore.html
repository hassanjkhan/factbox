<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Factbox · Explore</title>
<meta name="description" content="Browse all fifty-one Factbox stories by subject, by the kind of story they are, or by searching for a name.">
<meta name="theme-color" content="#0E0B12">
<link rel="canonical" href="https://factbox.app/explore.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Factbox">
<meta property="og:title" content="Factbox · Explore">
<meta property="og:description" content="Browse all fifty-one Factbox stories by subject, by the kind of story they are, or by searching for a name.">
<meta property="og:image" content="https://factbox.app/img/share.jpg">
<meta property="og:url" content="https://factbox.app/explore.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/explore.css">
</head>
<body>

<main class="lib">
  <header class="mast">
    <p class="mark">FACTBOX</p>
    <nav class="tabs" aria-label="Sections">
      <a href="stories.html">Home</a>
      <a href="explore.html" aria-current="page">Explore</a>
      <a href="library.html">Library</a>
    </nav>
    <h1>Explore</h1>
    <p id="blurb">Fifty-one stories, sorted by what they are about and by what kind of story they are. Search for a name, or just scroll.</p>
  </header>

  <!-- Search is a plain input, filtered in the browser. There is no server to
       ask, and a spinner over 51 rows would be theatre. -->
  <form class="find" id="find" role="search" action="#" onsubmit="return false">
    <label class="vh" for="q">Search stories</label>
    <span class="glass" aria-hidden="true">⌕</span>
    <input id="q" name="q" type="search" autocomplete="off" autocorrect="off"
           autocapitalize="none" spellcheck="false" enterkeyhint="search"
           placeholder="Cleopatra, Lincoln, Rome…">
    <button type="button" class="x" id="qx" aria-label="Clear search" hidden>×</button>
  </form>

  <div id="chips" class="chipwrap"></div>
  <p class="tally" id="tally" aria-live="polite"></p>

  <div id="view"></div>

  <noscript>
    <p class="void" style="margin-top:24px">
      <b>This page needs JavaScript.</b>
      All fifty-one stories are still listed on the <a href="stories.html">home shelf</a>.
    </p>
  </noscript>

  <p class="fine" style="margin-top:34px;text-align:left">
    <a href="stories.html">All stories</a> · <a href="credits.html">Artwork credits</a> ·
    <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> ·
    <a href="support.html">Support</a>
  </p>
</main>

<div class="buybar" id="buybar" hidden>
  <button class="go" id="pay" type="button">Read all 51 stories</button>
  <p class="fine">Sign up first — three days free before anything is charged.</p>
</div>

<script src="js/progress.js"></script>
<script src="js/gate.js"></script>
<script src="js/explore.js"></script>
</body>
</html>
