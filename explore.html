<!doctype html>
<!-- /explore. This is the same page as `/` - same markup, same module,
     same experience - because the two used to be two different answers to
     one question. It keeps a file of its own because GitHub Pages resolves
     /explore to explore.html, and it points its canonical URL at `/`, which
     is the one address for this page. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Factbox · Five minutes of history a day</title>
<meta name="description" content="One history story a day, chosen by the date, told one card at a time on paintings from the world's museums.">
<meta name="theme-color" content="#0E0B12">
<link rel="canonical" href="https://factbox.app/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Factbox">
<meta property="og:title" content="Factbox · Five minutes of history a day">
<meta property="og:description" content="One history story a day, chosen by the date, told one card at a time on paintings from the world's museums.">
<meta property="og:image" content="https://factbox.app/img/share.jpg">
<meta property="og:url" content="https://factbox.app/">
<meta name="twitter:card" content="summary_large_image">

<!-- Discovery, not bandwidth. data/index.json is fetched by js/gate.js, which
     is a <script> the parser only reaches at the bottom of the body, so on a
     cold load the fetch used to start around 1100ms on a page whose HTML had
     arrived at 400ms. This link is in the head, so the preload scanner starts
     it in the first few milliseconds, alongside the stylesheet.

     The covers are deliberately NOT preloaded here. Which story is Today's
     Factbox depends on the date, so any six slots named in this file would be
     the right guess for one day and a wasted fetch on the other fifty. -->
<link rel="preload" href="/data/index.json" as="fetch" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/loader.js"></script>
<link rel="stylesheet" href="/css/today.css">
</head>
<body>

<!-- / and /explore are one page. They load the same module and render the same
     thing, because a reader arriving from Instagram is not choosing between
     browsing modes - they are deciding whether to read one story in the next
     five minutes. -->
<main class="lib today">
  <header class="mast">
    <p class="mark">FACTBOX</p>
    <nav class="tabs" aria-label="Sections">
      <!-- The Explore tab leads to this same experience, so it is the current
           one here too. There is no Home tab anywhere: the page you land on is
           the home page. -->
      <a href="/explore" aria-current="page">Explore</a>
      <a href="/library">Library</a>
      <span class="acct" id="fb-acct"></span></nav>
    <!-- The pitch is in the markup, not built by script, so this page has real
         words on it before any JavaScript runs and still has them if none ever
         does. js/today.js hides this pair for a reader who has read something,
         and greets them by their own numbers instead. -->
    <h1>Be disgustingly well-informed.</h1>
    <p>Trade five minutes of scrolling for something worth remembering.</p>
  </header>

  <!-- The greeting slot. Empty for a first-time reader, whose greeting is the
       headline above; filled by js/today.js for anyone with reading memory. -->
  <div class="tdy-say" id="tdy-say"></div>

  <div id="view">
    <!-- Filled by js/today.js. If the season cannot be fetched, that script
         writes visible copy here - never nothing. -->
    <div class="fbload">
      <div class="fbload-track" aria-hidden="true"><i class="fbload-fill"></i></div>
      <p class="fbload-say" role="status">Dusting off the archive…</p>
    </div>
  </div>
  <noscript><p class="fine" style="margin-top:24px">Factbox needs JavaScript to
  show today's story. Every story is listed on the
  <a href="/stories">season shelf</a>.</p></noscript>

  <p class="fine" style="margin-top:34px;text-align:center">
    <a href="/account">Account</a> · <a href="/credits">Artwork credits</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a> · <a href="/support">Support</a>
  </p>
</main>

<!-- Load order matters, and only in one place: progress.js MUST come before
     gate.js, because gate.js's claim() strips the query string at parse time
     and progress.js needs Stripe's session_id out of it first. explore.js is
     the subject names on window.FBTAX; today.js needs all of them and goes
     last. -->
<script src="/js/progress.js"></script>
<script src="/js/access.js"></script>
<script src="/js/gate.js"></script>
<script src="/js/explore.js"></script>
<script src="/js/today.js"></script>
<!-- js/auth.js is a module, so the browser defers it: it runs after the
     document is parsed and BEFORE DOMContentLoaded, whatever position this tag
     is in. js/acct.js reaches it through the whenFBU() bridge from AUTH.md. -->
<script type="module" src="/js/auth.js"></script>
<script src="/js/analytics.js"></script>
<script src="/js/acct.js"></script>
</body>
</html>
