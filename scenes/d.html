<!-- ═══════════════════════════════════════════════════════════════
     SCENES D — copies · vials
     Beat 9 (Plutarch is late and second-hand) and beat 11 (the poison
     argument). Flat layers, back to front; everything a fraction of
     the box; one slow moving thing each.

     Both scenes draw the plane their subject stands on *inside* the
     art box rather than as a viewport-% sibling — .s-copies as a child
     div in fractions of the box, .s-mausoleum as over-wide rects in the
     SVG with overflow visible. The subjects are in SVG user units and
     the boxes are capped in `vh`, so a sibling floor drifts off their
     feet between a phone and a desktop. This way it cannot.
     ═══════════════════════════════════════════════════════════════ -->

<!-- 9 · THE COPIES ────────────────────────────────────────────────
     Beat 4 already spent the single papyrus, so this is the chain the
     papyrus came down. A copyist at his desk with the account open in
     front of him — a specific man, at a specific remove, writing — and
     behind him the rank he is copying from: each codex copied from the
     one in front of it and worse for it, a word gone, a line gone, a
     line written back in somebody else's ink, until the far ones are
     only a suggestion. Past the last of them a gap with a scuff on the
     plane and nothing standing in it: the source nobody can name.
     The moving thing is the transmission. A pulse travels back down
     the rank and gives out before it reaches the gap. -->

<!-- 11 · THE VIALS ────────────────────────────────────────────────
     Not a still life of equipment — the room, and what the poison
     argument actually claims happened in it.

     The place is her mausoleum: she had a tomb built for herself by
     the temple of Isis, moved the treasure into it and shut herself
     in, and that is where she died (Plutarch, Antony 74–85). So: a
     stone chamber with grave goods stacked against the wall and a
     barred door the guards had to break, cold daylight showing round
     its edges. Her on the couch in royal regalia with a small vessel
     at her lips; Iras collapsed at the foot of it; Charmion kneeling
     at the head, still setting the diadem straight — the two deaths
     that make one snake hard to believe. The physician's table stands
     to one side: vials, mortar, a folded paper of powder. That is the
     card's argument — a court with physicians had quieter options.

     Nobody is slipping out of a door. Every ancient account has this
     as her own act; the argument is only about the means.

     One lamp, and its flame is the only thing moving. The room draws
     its own floor as over-wide rects with `overflow:visible`, so the
     floor line can never drift off the feet of the people on it. -->

  <div class="vil-room"></div>

  <div class="vil-art">

      <defs>
        <linearGradient id="vil-floor-g" x1="0" y1="0" x2="0" y2="1">
