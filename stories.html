<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Factbox · Season one</title>
<meta name="description" content="Fifty-one history stories, each one sourced. Read them one card at a time.">
<meta name="theme-color" content="#0E0B12">
<link rel="canonical" href="https://factbox.app/stories.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Factbox">
<meta property="og:title" content="Factbox · Season one">
<meta property="og:description" content="Fifty-one history stories, each one sourced. Read them one card at a time.">
<meta property="og:image" content="https://factbox.app/img/share.jpg">
<meta property="og:url" content="https://factbox.app/stories.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<main class="lib">
  <header class="mast">
    <p class="mark">FACTBOX</p>
    <h1>Season one</h1>
    <p id="blurb">Fifty-one stories. Every card cites where it came from, and says so when nobody actually knows.</p>
  </header>

  <div id="shelf" aria-live="polite"></div>

  <p class="fine" style="margin-top:34px;text-align:left">
    <a href="credits.html">Artwork credits</a> · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · <a href="support.html">Support</a>
  </p>
</main>

<div class="buybar" id="buybar" hidden>
  <button class="go" id="pay" type="button">Read all 51 stories · $3.99/mo</button>
  <p class="fine">Cancel any time. New stories added through the season.</p>
</div>

<script src="js/gate.js"></script>
<script>
(function () {
  var shelf = document.getElementById("shelf");
  var bar   = document.getElementById("buybar");
  var open  = FB.unlocked();

  function card(s) {
    var locked = !s.free && !open;
    var href = "read.html?s=" + encodeURIComponent(s.id);
    /* Stack 01 is the fully illustrated version and lives at the front page,
       so its cover points there rather than at the generic reader. */
    if (s.id === "01") href = "story.html";
    return '' +
      '<a class="card' + (locked ? " locked" : "") + '" href="' + href + '">' +
        '<div class="plate">' +
          '<img loading="lazy" decoding="async" alt="" ' +
               'src="img/thumbs/' + FB.esc(s.img) + '.webp">' +
          (locked
            ? '<span class="lock" aria-hidden="true">🔒</span>'
            : '<span class="freetag">FREE</span>') +
        '</div>' +
        '<h3>' + FB.esc(s.title) + '</h3>' +
        '<p class="meta">' + s.cards.length + ' cards · ' + FB.minutes(s.secs) + '</p>' +
      '</a>';
  }

  function section(title, note, items) {
    if (!items.length) return "";
    return '<div class="sechead"><h2>' + FB.esc(title) + '</h2>' +
           '<span>' + FB.esc(note) + '</span></div>' +
           '<div class="grid">' + items.map(card).join("") + '</div>';
  }

  FB.load().then(function (stacks) {
    var free   = stacks.filter(function (s) { return s.free; });
    var rest   = stacks.filter(function (s) { return !s.free; });

    if (open) {
      shelf.innerHTML = section("All stories", stacks.length + " in season one", stacks);
      bar.hidden = true;
      document.getElementById("blurb").textContent =
        "You have all fifty-one. New stories are added through the season.";
    } else {
      shelf.innerHTML =
        section("Start here", "free", free) +
        section("The rest of season one", rest.length + " stories", rest);
      bar.hidden = false;
    }
    FB.track("library_view");
  }).catch(function (e) {
    shelf.innerHTML = '<p class="fine" style="margin-top:28px">' +
      "Could not load the stories. Check your connection and reload." + '</p>';
  });

  document.getElementById("pay").addEventListener("click", function () {
    FB.checkout(this);
  });
})();
</script>
</body>
</html>
