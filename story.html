<style>
/* ==========================================================================
   Factbox reader — shell
   Phone-first. 390x844 is the design size. 100% of traffic arrives from
   Instagram / TikTok, which means an in-app webview: a viewport that resizes
   mid-scroll and a persistent bottom toolbar eating 44-60pt.
   Everything below is built around those two facts.
   ========================================================================== */

:root{
  /* any sliver a browser leaves is scene-coloured, never a black bar */

  color-scheme:dark;

  /* Theme.swift palette */
  --parchment:#FFF7ED; --ink:#3E2F4A; --ink-soft:#8B7B93;
  --coral:#FF7A5C; --coral-deep:#E85F41; --crimson:#A81F38;
  --teal:#4FC3B8; --teal-deep:#1F7A72;
  --butter:#FFD36E; --butter-deep:#9A6B00;
  --lilac:#B79CED; --lilac-deep:#6B4BB0;
  --mint:#8FDCA8; --blush:#FFB3C1; --steel:#9AA3AE;
  --night:#1B1620;

  --ui:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;

  /* Scrim ground. Slightly cooler + darker than --night so it reads as light,
     not as a grey box, over both parchment and near-black scenes. */
  --veil:20,16,24;

  /* The bottom of an in-app webview is not ours. Instagram parks a toolbar
     over roughly the last 44-60pt of it. Nothing tappable and nothing that has
     to be read goes below --bottom-safe, which is the larger of "the bottom
     15% of the viewport" and "the toolbar plus the home indicator".
     Consequence: the only interactive things on a beat are the sources pill
     (top-left) and, on the question beat, the two options in the middle. */
  --toolbar:60px;
  --bottom-safe:max(15vh, calc(env(safe-area-inset-bottom, 0px) + var(--toolbar) + 4px));
  --top-safe:calc(env(safe-area-inset-top, 0px) + 12px);

  --tap:44px;                    /* minimum touch target, everywhere */
  --pill:999px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#141018;margin:0;height:100%}
body{
  background:#0E0B12;
  color:#fff;
  font-family:var(--ui);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  overscroll-behavior:none;
  text-rendering:optimizeLegibility;
}

/* --------------------------------------------------------------------------
   The stack.
   Height is `100dvh`, with a plain `100vh` fallback first for anything that
   does not support the unit. Nothing pins a pixel height any more: doing so
   left the deck shorter than the screen in an in-app webview, with the page
   background showing through underneath it.
   -------------------------------------------------------------------------- */
.deck{
  height:100vh;
  height:100dvh;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  scrollbar-width:none;
}
.deck::-webkit-scrollbar{display:none}

.page{
  position:relative;
  /* Off-screen beats cost nothing to keep in the document. Without this,
     fifteen elaborate scenes all render at once and the main thread stalls
     hard enough that the IntersectionObserver stops firing — which, because
     captions animate in on .live, looks like the text has vanished. */
  content-visibility:auto;
  contain-intrinsic-size:100vw 100dvh;
  height:100vh;
  height:100dvh;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  overflow:hidden;
  isolation:isolate;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* --------------------------------------------------------------------------
   Scene host. The contract: absolute, inset 0, overflow hidden. Scenes
   position their layers inside this and nowhere else.
   -------------------------------------------------------------------------- */
.scene{
  position:absolute;
  inset:0;
  overflow:hidden;
  z-index:0;
  background:var(--night);      /* so a scene that paints late is never white */
  contain:paint;
}
/* A beat whose scene has not landed yet still composes. */
.scene-missing{
  background:
    radial-gradient(120% 80% at 50% 12%, #2A2233 0%, #17131C 62%, #100D15 100%);
}

/* --------------------------------------------------------------------------
   The scrim.

   The problem: caption text has to stay legible over an unknown illustration
   — s-pharos is near-black, s-scroll is near-white parchment. Two layers
   solve it, and they compound:

   1) `.scrim` — a page-wide vertical gradient with a plateau across the band
      the caption occupies. Peak alpha .46.
   2) `.cap` background — a radial veil that hugs the text block itself, so a
      short caption gets a small pool of shade and a long one gets a big
      one. Peak alpha .52.

   Compounded at the text centre: 1 - (1-.46)(1-.52) = .74.
   Over parchment #FFF7ED that composites to rgb(81,77,79) — white text on it
   is 7.4:1, comfortably past AA at any size.
   Over a near-black scene it is simply a touch more black: ~19:1.
   Both extremes pass without the shell knowing anything about the scene.

   Text-shadow underneath is the third belt: it catches the case where a scene
   puts a bright shape right behind a descender.
   -------------------------------------------------------------------------- */
.scrim{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:linear-gradient(to bottom,
    rgba(var(--veil),.30)   0%,
    rgba(var(--veil),.10)  10%,
    rgba(var(--veil),.05)  20%,
    rgba(var(--veil),.24)  26%,
    rgba(var(--veil),.42)  34%,
    rgba(var(--veil),.42)  58%,
    rgba(var(--veil),.30)  68%,
    rgba(var(--veil),.16)  80%,
    rgba(var(--veil),.42) 100%);
}

/* --------------------------------------------------------------------------
   Caption.
   `.capwrap` is the scroller and the centring box; `.cap` is full-bleed so the
   adaptive veil below has no side seam on a phone. Vertically the block is
   centred in the space *above* the webview toolbar — the guard padding lifts
   it to roughly 45% of the viewport, which is where the scrim plateau sits.
   -------------------------------------------------------------------------- */
.capwrap{
  position:absolute;inset:0;z-index:2;
  display:flex;align-items:center;justify-content:center;
  padding:calc(var(--top-safe) + 40px) 0 calc(var(--top-safe) + 40px);
  overflow-y:auto;overscroll-behavior-y:auto;scrollbar-width:none;
  touch-action:pan-y;
}
.capwrap::-webkit-scrollbar{display:none}

.cap{
  width:100%;
  padding:26px 22px;
  text-shadow:0 1px 2px rgba(var(--veil),.5), 0 1px 14px rgba(var(--veil),.45);
  /* Layer 2 of the scrim — see the note above .scrim. It is sized to the text
     block, so a two-line caption gets a small pool of shade and a long one
     gets a big one, and it holds a flat plateau across every line rather than
     falling off at the top and bottom the way a radial does — those edges are
     exactly where the smallest text sits. It fades out inside the padding, and
     on a phone it runs to both screen edges, so there is no side seam. */
  background:linear-gradient(to bottom,
    rgba(var(--veil),0)   0%,
    rgba(var(--veil),.30) 5%,
    rgba(var(--veil),.52) 13%,
    rgba(var(--veil),.52) 87%,
    rgba(var(--veil),.30) 95%,
    rgba(var(--veil),0) 100%);
}
.cap > *{max-width:34rem;margin-inline:auto}

.hl{
  margin:0 auto;
  font-size:clamp(1.85rem,7.8vw,2.9rem);
  font-weight:800;
  letter-spacing:-.03em;
  line-height:1.05;
  text-wrap:balance;
}
.sub{
  margin:.7em auto 0;
  font-size:clamp(1rem,4.2vw,1.12rem);
  line-height:1.5;
  font-weight:500;
  color:rgba(255,255,255,.9);
}

/* Timeline — flat, no boxes, no pills. It is a caption, not a table. */
.tl{margin:1.15em auto 0;display:flex;flex-direction:column;gap:.9em}
.tl .row{display:flex;flex-direction:column;gap:.15em}
.tl .when{
  font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--butter);line-height:1.3;
}
.tl .what{font-size:.97rem;line-height:1.45;color:rgba(255,255,255,.92)}

/* The relic — a cited object. One coral rule, nothing else. */
.relic{margin:1.15em auto 0;padding-left:.85em;border-left:2px solid var(--coral)}
.relic .obj{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:.8rem;font-weight:600;letter-spacing:-.01em;color:var(--butter);
}
.relic .prov{font-size:.81rem;color:rgba(255,255,255,.74);margin:.3em 0 .55em}
.relic .proves{font-size:.97rem;line-height:1.45;color:rgba(255,255,255,.9)}

/* The honest-caveat line. Quieter than the body, never hidden. */
.note{
  margin:1.15em auto 0;
  font-size:.88rem;line-height:1.5;
  color:rgba(255,255,255,.78);
  padding-left:.85em;
  border-left:2px solid rgba(255,255,255,.22);
}

/* --------------------------------------------------------------------------
   The question beat. Buttons on the picture — no white card.
   -------------------------------------------------------------------------- */
.q{margin:0 auto}
.opts{margin:1.35em 0 0;display:flex;flex-direction:column;gap:.6em}
.opt{
  appearance:none;font:inherit;text-align:left;cursor:pointer;
  min-height:var(--tap);
  display:flex;gap:.75em;align-items:center;
  padding:.85em 1em;
  border-radius:16px;
  border:1.5px solid rgba(255,255,255,.34);
  background:rgba(255,255,255,.13);
  -webkit-backdrop-filter:blur(14px) saturate(1.1);
  backdrop-filter:blur(14px) saturate(1.1);
  color:#fff;font-size:1rem;font-weight:650;line-height:1.3;
  text-shadow:0 1px 2px rgba(var(--veil),.5);
  transition:transform .12s ease, background .25s ease, border-color .25s ease, opacity .25s ease;
}
.opt:active{transform:scale(.975)}
.opt .mark{
  flex:none;width:22px;height:22px;border-radius:var(--pill);
  border:2px solid rgba(255,255,255,.55);
  display:grid;place-items:center;
  font-size:12px;font-weight:800;color:var(--night);
  transition:background .25s ease,border-color .25s ease;
}
.opts.done .opt{cursor:default}
.opt.right{background:rgba(143,220,168,.26);border-color:var(--mint)}
.opt.right .mark{background:var(--mint);border-color:var(--mint)}
.opt.wrong{opacity:.55}
.opt.wrong .mark{background:rgba(255,255,255,.4);border-color:rgba(255,255,255,.4)}

.reveal{
  margin:1.1em 0 0;font-size:.97rem;line-height:1.5;
  color:rgba(255,255,255,.9);
  max-height:0;opacity:0;overflow:hidden;
  transform:translateY(8px);
  transition:max-height .45s ease,opacity .35s ease .06s,transform .4s ease .06s;
}
.reveal.on{max-height:24em;opacity:1;transform:none}

/* --------------------------------------------------------------------------
   Caption choreography. `.live` is set by the IntersectionObserver and the
   scenes key their animation off the same class — it is load-bearing for both.
   Headline rises first, supporting line a beat later, the rest after that.
   -------------------------------------------------------------------------- */
.rise{
  opacity:1;
  transform:translateY(20px);
  transition:opacity .2s ease, transform .2s ease;
}
html.js .rise{opacity:0}
html.js .page.live .rise{
  opacity:1;
  transform:none;
  transition:opacity .55s cubic-bezier(.2,.7,.3,1) var(--d,0s),
             transform .7s cubic-bezier(.2,.7,.3,1) var(--d,0s);
}

/* --------------------------------------------------------------------------
   Sources. The whole point of the product, so it survives the redesign — but
   as an affordance, not a block of chrome. A pill on the picture; tapping it
   raises a sheet over the scene.
   -------------------------------------------------------------------------- */
.srcbtn{
  /* Top-left, not bottom: the bottom of an in-app webview belongs to
     Instagram's toolbar, and this is the one thing on a beat a reader taps. */
  position:absolute;left:14px;top:var(--top-safe);
  z-index:5;
  appearance:none;font:inherit;cursor:pointer;
  min-height:var(--tap);
  display:inline-flex;align-items:center;gap:.5em;
  padding:0 .95em;
  border-radius:var(--pill);
  border:1px solid rgba(255,255,255,.3);
  background:rgba(var(--veil),.42);
  -webkit-backdrop-filter:blur(16px) saturate(1.2);
  backdrop-filter:blur(16px) saturate(1.2);
  color:rgba(255,255,255,.94);
  font-size:.8rem;font-weight:700;letter-spacing:.01em;
  transition:background .2s ease,transform .12s ease;
}
.srcbtn:active{transform:scale(.96)}
.srcbtn .chev{
  display:inline-block;font-size:.7em;opacity:.8;
  transition:transform .3s cubic-bezier(.2,.7,.3,1);
}
.srcbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}

.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:4;
  max-height:74%;
  overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;
  padding:14px 20px calc(var(--bottom-safe) - 10px);
  border-radius:22px 22px 0 0;
  border-top:1px solid rgba(255,255,255,.16);
  background:rgba(var(--veil),.9);
  -webkit-backdrop-filter:blur(26px) saturate(1.3);
  backdrop-filter:blur(26px) saturate(1.3);
  transform:translateY(102%);
  visibility:hidden;
  transition:transform .38s cubic-bezier(.2,.75,.25,1), visibility 0s linear .38s;
}
.sheet::-webkit-scrollbar{display:none}
.sheet.on{transform:none;visibility:visible;transition-delay:0s,0s}
.sheet .grab{
  width:38px;height:4px;border-radius:var(--pill);
  background:rgba(255,255,255,.3);margin:0 auto 14px;
}
.sheet h3{
  margin:0 0 .8em;
  font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.5);
}
.sheet ol{margin:0;padding:0 0 0 1.15em}
.sheet li{
  font-size:.86rem;line-height:1.55;color:rgba(255,255,255,.88);
  margin-bottom:.7em;
}
.sheet li::marker{color:var(--coral);font-weight:700}
.sheet .credit{
  margin:0 0 1.1em;padding-left:.85em;
  border-left:2px solid var(--steel);
  font-size:.84rem;line-height:1.5;color:rgba(255,255,255,.76);
}

/* --------------------------------------------------------------------------
   Scroll affordance. Taught once, then gone. Sits well clear of the toolbar.
   -------------------------------------------------------------------------- */
.hint{
  position:absolute;left:50%;bottom:calc(var(--bottom-safe) + 10px);
  z-index:3;
  transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  pointer-events:none;
  color:rgba(255,255,255,.9);
  font-size:.78rem;font-weight:700;letter-spacing:.03em;white-space:nowrap;
  text-shadow:0 1px 8px rgba(var(--veil),.8);
  animation:bob 2.2s ease-in-out infinite;
  transition:opacity .3s ease;
}
/* Its own little pool of shade, so it survives a near-white scene without
   becoming a chip of chrome. */
.hint::before{
  content:"";position:absolute;inset:-16px -30px;z-index:-1;
  background:radial-gradient(closest-side,rgba(var(--veil),.5),rgba(var(--veil),0));
}
.hint .arrow{
  width:13px;height:13px;margin-bottom:2px;
  border-left:2.5px solid currentColor;border-top:2.5px solid currentColor;
  border-radius:2px;transform:rotate(45deg);
}
.hint.out{opacity:0}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-7px)}}

/* Progress rail. Right edge, thin, low contrast. No like, save or share. */
.rail{
  position:fixed;right:7px;top:50%;transform:translateY(-50%);
  z-index:6;display:flex;flex-direction:column;gap:5px;
  pointer-events:none;
}
.rail i{
  width:3px;height:12px;border-radius:var(--pill);
  background:rgba(255,255,255,.28);
  transition:background .3s ease,height .3s ease;
}
.rail i.on{background:#fff;height:24px}

/* --------------------------------------------------------------------------
   The ending. One ask.
   -------------------------------------------------------------------------- */
.page.end .scene{
  background:
    radial-gradient(90% 60% at 22% 14%, rgba(255,122,92,.30) 0%, rgba(255,122,92,0) 62%),
    radial-gradient(80% 55% at 84% 84%, rgba(183,156,237,.26) 0%, rgba(183,156,237,0) 60%),
    linear-gradient(170deg,#241C2C 0%,#15111B 58%,#0E0B12 100%);
}
.page.end .cap{text-align:center}
.page.end .capwrap{padding-top:calc(var(--top-safe) + 20px)}
.page.end .cap{background:none}
.wordmark{
  font-size:.72rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:var(--coral);margin:0 0 1em;
}
.page.end .hl{font-size:clamp(2rem,8.4vw,3.1rem)}
.page.end .sub{margin-top:.8em;color:rgba(255,255,255,.8)}

form{margin:1.6em auto 0;display:flex;flex-direction:column;gap:.6em;max-width:22rem}
input[type=email]{
  font:inherit;
  font-size:16px;                 /* 16px exactly: anything less and iOS and the
                                     in-app webviews zoom the page on focus */
  min-height:52px;
  width:100%;
  padding:0 1.05em;
  border-radius:var(--pill);
  border:1.5px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.1);
  color:#fff;
  text-align:center;
}
input[type=email]::placeholder{color:rgba(255,255,255,.45)}
input[type=email]:focus{outline:none;border-color:var(--coral);background:rgba(255,255,255,.15)}
button.go{
  appearance:none;border:0;font:inherit;cursor:pointer;
  min-height:52px;width:100%;
  font-size:1rem;font-weight:800;
  background:var(--coral);color:#2A1109;
  border-radius:var(--pill);
  transition:transform .12s ease,background .2s ease;
}
button.go:active{transform:scale(.97);background:var(--coral-deep)}
.thanks{
  margin:1.2em 0 0;font-size:1rem;font-weight:700;line-height:1.5;
  color:var(--mint);
  max-height:0;opacity:0;overflow:hidden;transform:translateY(8px);
  transition:max-height .4s ease,opacity .35s ease,transform .4s ease;
}
.thanks.on{max-height:10em;opacity:1;transform:none}
.fine{margin:1.2em auto 0;font-size:.8rem;line-height:1.5;color:rgba(255,255,255,.62)}

/* --------------------------------------------------------------------------
   Desktop is a courtesy. Same layout, centred column, scenes still bleed.
   -------------------------------------------------------------------------- */
@media (min-width:720px){
  :root{--bottom-safe:max(9vh, 72px)}
  .cap{padding-left:26px;padding-right:26px;
       -webkit-mask-image:linear-gradient(to right,transparent 0,#000 26%,#000 74%,transparent 100%);
       mask-image:linear-gradient(to right,transparent 0,#000 26%,#000 74%,transparent 100%)}
  .srcbtn{left:50%;margin-left:-17rem}
  .sheet{left:50%;transform:translate(-50%,102%);width:min(40rem,100%);border-radius:22px 22px 0 0}
  .sheet.on{transform:translate(-50%,0)}
}

/* --------------------------------------------------------------------------
   Reduced motion. Scenes key off html.no-motion too.
   -------------------------------------------------------------------------- */
html.no-motion .deck{scroll-behavior:auto}
html.no-motion .hint{animation:none}
html.no-motion .rise{opacity:1;transform:none;transition:none}
html.no-motion .opt,
html.no-motion .srcbtn,
html.no-motion button.go{transition:none}
html.no-motion .sheet{transition:visibility 0s}
html.no-motion .reveal,
html.no-motion .thanks{transition:none}
html.no-motion *,
html.no-motion *::before,
html.no-motion *::after{animation:none !important}


/* --------------------------------------------------------------------------
   The verdict beat.

   Answering used to mark a tick in place, which read as nothing happening.
   The reader now arrives somewhere: the deck moves them to this beat and the
   word at the top is written by their answer. Right and wrong differ only in
   colour and in that word — a wrong answer is not an error state, it is the
   next thing to read, so nothing here goes red or shakes.
   -------------------------------------------------------------------------- */
.verdict{
  font-size:14px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  margin:0 0 10px;color:var(--mint);
}
.page.was-wrong .verdict{color:var(--butter)}
.page.was-right .verdict::before,
.page.was-wrong .verdict::before{
  content:"";display:inline-block;width:9px;height:9px;border-radius:999px;
  margin-right:9px;vertical-align:1px;background:currentColor;
}


/* --------------------------------------------------------------------------
   The ending: the rest of the season, and the offer.

   A shelf rather than a list — the covers are the argument. It scrolls
   sideways inside the caption so the ending stays one screen like every
   other beat, instead of turning into a page you have to scroll past.
   -------------------------------------------------------------------------- */
.shelf{
  display:flex;gap:10px;
  /* Centred when the covers fit, flush-left when they do not. Plain
     `center` clips the start of an overflowing row, which is unreachable —
     `safe` is the whole reason this works at both sizes. */
  justify-content:safe center;
  overflow-x:auto;overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;

  /* `.cap > *` caps its children at 34rem and centres them with
     margin-inline:auto. Both are wrong for a row that is meant to run past
     the text column, and the auto margins were fighting the negative ones —
     which is why this sat pinned to the left instead of spanning. */
  max-width:none;
  margin:18px calc(50% - 50vw) 20px;
  padding:0 22px 2px;
  scroll-padding-left:22px;

  /* The caption scroller claims `touch-action:pan-y` for vertical reading, and
     that inheritance is what stopped this row being draggable at all on a
     phone. Claiming pan-x back is the fix. */
  touch-action:pan-x;

  /* A cover sliced by the viewport edge reads as a rendering bug. Fading the
     last few percent turns the same pixels into "the row continues", which is
     what they actually mean. */
  -webkit-mask-image:linear-gradient(to right,
    transparent 0, #000 26px, #000 calc(100% - 26px), transparent 100%);
  mask-image:linear-gradient(to right,
    transparent 0, #000 26px, #000 calc(100% - 26px), transparent 100%);

  /* Settle on whole covers rather than mid-cover. */
  scroll-snap-type:x mandatory;
}
.shelfcard{scroll-snap-align:center}
.shelf::-webkit-scrollbar{display:none}
.shelfcard{flex:none;width:88px;scroll-snap-align:start;
  text-decoration:none;color:inherit;-webkit-tap-highlight-color:transparent}
.shelfcard:active{transform:scale(.97)}
.shelfcard img{
  width:88px;height:128px;object-fit:cover;display:block;
  border-radius:9px;background:rgba(255,255,255,.06);
  box-shadow:0 4px 14px rgba(12,9,15,.45);
}
.shelfcard em{
  display:block;font-style:normal;font-size:11px;line-height:1.3;
  margin-top:6px;color:rgba(244,238,230,.78);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.go.pay{width:100%;font-size:16.5px}
.go.pay:disabled{opacity:.6;cursor:default}

/* The quiet second door. Some readers want to see the range before they pay,
   and sending them to a wall of covers converts better than sending them away. */
.ghostlink{
  display:block;margin-top:12px;text-align:center;
  font-size:13.5px;font-weight:650;padding:10px;min-height:44px;
  color:rgba(244,238,230,.62);text-decoration:none;
}

/* Eleven of the twelve covers on this shelf are behind the paywall. Every other
   cover surface on the site marks that; this one was sending readers into a
   wall with no warning, from the page all the social traffic lands on. */
.shelfplate{position:relative;display:block}
.shelflock{
  position:absolute;right:5px;top:5px;
  width:20px;height:20px;border-radius:999px;
  background:rgba(14,11,18,.74);
  display:grid;place-items:center;font-size:9px;font-style:normal;
  box-shadow:inset 0 0 0 1px rgba(255,247,237,.16);
}
.shelfcard:not(.isfree) img{opacity:.62;filter:saturate(.7)}
.endfoot{
  margin:14px auto 0;text-align:center;font-size:12.5px;line-height:1.6;
  color:rgba(244,238,230,.62);
}
.endfoot a{color:rgba(244,238,230,.72)}

/* Someone returning on a new phone lands on this page, not the shelf. Without
   a way back in from here, their only route is to pay a second time. */
.haveacct{
  margin:14px auto 0;text-align:center;font-size:13.5px;
  color:rgba(244,238,230,.62);
}
.haveacct a{
  color:#FF7A5C;font-weight:700;text-decoration:none;
  display:inline-block;padding:8px 4px;min-height:44px;line-height:28px;
}

/* ═══════════════════════════════════════════════════════════════════
   SCENES A — door · painting · fleet · afternoon
   Composed for 390×844 portrait first; desktop checked second. The
   bottom 12% is treated as covered by the Instagram webview toolbar,
   so nothing that carries meaning lives below y=88%. The middle third
   (33–67%) is kept flat for the caption scrim to sit on.
   Every rule scoped under its .s-NAME. Sizes in % / vmin / em only.
   ═══════════════════════════════════════════════════════════════════ */


/* ───────────────────────────────────────────────────────────────────
   1 · .s-door — "Nobody watched Cleopatra die."
   The whole image is what leaks. Threshold at y=74%, the bar of
   lamplight under the boards sits right on it, the wedge it throws
   runs 74%→92% with all its brightness in the top half of that.
   The leaf itself fills the middle third as near-black on black.
   ─────────────────────────────────────────────────────────────────── */

.s-door {
  --night: #1B1620;
  --pitch: #0C0910;
  --stone: #2B2234;
  --butter: 255, 211, 110;
  --butter-soft: 255, 230, 174;
  background: #100C15;
}

.s-door .wall {
  position: absolute; inset: 0;
  background:
    radial-gradient(74% 50% at 50% 78%, rgba(var(--butter), .14) 0%, rgba(var(--butter), 0) 70%),
    radial-gradient(118% 94% at 50% 60%, var(--stone) 0%, var(--night) 42%, var(--pitch) 100%);
}

/* Courses of block, only just readable — they tell you it is a wall
   and not a void, and nothing more. */
.s-door .course {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    rgba(183, 156, 237, 0) 0 4.6%,
    rgba(183, 156, 237, .055) 4.6% 4.9%);
  -webkit-mask-image: radial-gradient(72% 52% at 50% 74%, #000 0%, rgba(0,0,0,.15) 78%, transparent 100%);
          mask-image: radial-gradient(72% 52% at 50% 74%, #000 0%, rgba(0,0,0,.15) 78%, transparent 100%);
}

.s-door .floor {
  position: absolute; left: 0; right: 0; bottom: 0; height: 26%;
  background: linear-gradient(to bottom, #1D1725 0%, #130F1A 38%, #08060B 100%);
  box-shadow: inset 0 .5vmin 2vmin rgba(0, 0, 0, .7);
}

/* The reveal: the doorway is set into the wall, so there is a hair
   of warmth on the inside faces of the opening. */
.s-door .reveal {
  position: absolute; left: 50%; bottom: 24%;
  transform: translateX(-50%);
  width: 46%; height: 68%;
  background: radial-gradient(58% 68% at 50% 96%, rgba(var(--butter), .20), rgba(var(--butter), 0) 74%);
  filter: blur(1.6vmin);
}

.s-door .doorway {
  position: absolute; left: 50%; bottom: 26%;
  transform: translateX(-50%);
  height: 62%; aspect-ratio: .46;
}

.s-door .jamb {
  position: absolute; top: -4%; bottom: -42%;
  width: 7.5%;
}
.s-door .jamb.l {
  left: -7.5%;
  background: linear-gradient(to right, #100C15 0%, #372C42 66%, #1A1421 100%);
}
.s-door .jamb.r {
  right: -7.5%;
  background: linear-gradient(to left, #0E0A13 0%, #31283C 66%, #171220 100%);
}

.s-door .lintel {
  position: absolute; left: -11%; right: -11%; top: -5.4%; height: 5.4%;
  border-radius: .5vmin .5vmin 0 0;
  background: linear-gradient(to bottom, #3A2F45 0%, #1D1727 74%, #0F0B14 100%);
}

/* The leaf. Almost nothing happens here on purpose — this is the
   quiet the caption sits on. Warm rim down both stiles so the shut
   door reads as a door in the first second. */
.s-door .leaf {
  position: absolute; inset: 0;
  background: linear-gradient(102deg, #170F22 0%, #251C31 44%, #140E1D 100%);
  box-shadow:
    inset 0 0 7vmin rgba(0, 0, 0, .60),
    inset .4vmin 0 1.6vmin rgba(var(--butter), .055),
    inset -.4vmin 0 1.6vmin rgba(var(--butter), .045),
    inset 0 -3vmin 5vmin rgba(var(--butter), .10),
    inset 0 -.5vmin 0 rgba(0, 0, 0, .8);
}

.s-door .plank {
  position: absolute; top: 0; bottom: 0; width: .55%;
  background: linear-gradient(to bottom,
    rgba(var(--butter), .02) 0%,
    rgba(var(--butter), .06) 68%,
    rgba(var(--butter), .22) 100%);
}
.s-door .plank.p1 { left: 26%; }
.s-door .plank.p2 { left: 51%; }
.s-door .plank.p3 { left: 76%; }

.s-door .rail {
  position: absolute; left: 4%; right: 4%; height: 2.6%;
  border-radius: .5vmin;
  background: linear-gradient(to bottom,
    rgba(154, 163, 174, .17) 0%,
    rgba(154, 163, 174, .07) 45%,
    rgba(0, 0, 0, .38) 100%);
}
.s-door .rail.top { top: 15%; }
.s-door .rail.low { bottom: 16%; }

/* A ring, off the centre line so it never fights the caption. */
.s-door .ring {
  position: absolute; left: 70%; top: 55%;
  width: 11%; aspect-ratio: 1; border-radius: 50%;
  border: .5vmin solid rgba(154, 163, 174, .16);
  box-shadow: 0 .4vmin .8vmin rgba(0, 0, 0, .5);
}

/* The hairline at the hinge. Bright at head and foot, dimmed through
   the middle band so it never sits behind the words. */
.s-door .seam {
  position: absolute; left: -1.4%; top: .5%; bottom: 0;
  width: .4vmin; border-radius: 1vmin;
  background: linear-gradient(to bottom,
    rgba(var(--butter-soft), .92) 0%,
    rgba(var(--butter), .30) 24%,
    rgba(var(--butter), .22) 58%,
    rgba(var(--butter-soft), .98) 100%);
  box-shadow: 0 0 1.8vmin rgba(var(--butter), .55);
  animation: a-door-lamp 9.4s ease-in-out infinite alternate;
  animation-play-state: paused;
}
.s-door .seam-glow {
  position: absolute; left: -3.4%; top: -2%; bottom: -1%;
  width: 4.6vmin; border-radius: 4vmin;
  background: linear-gradient(to bottom,
    rgba(var(--butter), .36) 0%,
    rgba(var(--butter), .07) 30%,
    rgba(var(--butter), .06) 62%,
    rgba(var(--butter), .44) 100%);
  filter: blur(1.6vmin);
  animation: a-door-lamp 9.4s ease-in-out infinite alternate;
  animation-play-state: paused;
}

/* The bar under the door — the brightest thing in the story so far. */
.s-door .under {
  position: absolute; left: -4%; right: -4%; bottom: -.7%;
  height: .95vmin; border-radius: 1vmin;
  background: linear-gradient(to right,
    rgba(var(--butter), .40) 0%,
    rgba(var(--butter-soft), 1) 22%,
    rgba(var(--butter-soft), .92) 55%,
    rgba(var(--butter-soft), 1) 78%,
    rgba(var(--butter), .34) 100%);
  box-shadow: 0 0 3.6vmin rgba(var(--butter), .78);
  animation: a-door-lamp 9.4s ease-in-out .8s infinite alternate;
  animation-play-state: paused;
}
.s-door .under-glow {
  position: absolute; left: -30%; right: -30%; bottom: -6%;
  height: 11vmin;
  background: radial-gradient(50% 96% at 50% 32%,
    rgba(var(--butter), .60) 0%, rgba(var(--butter), .20) 44%, rgba(var(--butter), 0) 74%);
  filter: blur(1.6vmin);
  animation: a-door-lamp 9.4s ease-in-out .8s infinite alternate;
  animation-play-state: paused;
}

/* The wedge on the flags at our feet. Top edge lands exactly on the
   threshold; the blur is what feathers the polygon's edges, so it
   reads as light and not as a cut-out. */
.s-door .spill {
  position: absolute; left: 50%; bottom: 4%;
  transform: translateX(-50%);
  width: 168%; height: 22%;
  clip-path: polygon(41% 0%, 59% 0%, 98% 100%, 2% 100%);
  background: linear-gradient(to bottom,
    rgba(var(--butter), .48) 0%,
    rgba(var(--butter), .20) 32%,
    rgba(var(--butter), .07) 64%,
    rgba(var(--butter), 0) 100%);
  filter: blur(1.9vmin);
  animation: a-door-lamp 9.4s ease-in-out .8s infinite alternate;
  animation-play-state: paused;
}
.s-door .spill-core {
  position: absolute; left: 50%; bottom: 17%;
  transform: translateX(-50%);
  width: 86%; height: 9%;
  clip-path: polygon(43% 0%, 57% 0%, 92% 100%, 8% 100%);
  background: linear-gradient(to bottom,
    rgba(var(--butter-soft), .88) 0%,
    rgba(var(--butter-soft), .28) 52%,
    rgba(var(--butter-soft), 0) 100%);
  filter: blur(.9vmin);
  animation: a-door-lamp 9.4s ease-in-out .8s infinite alternate;
  animation-play-state: paused;
}

@keyframes a-door-lamp {
  0%   { opacity: .80; }
  38%  { opacity: 1; }
  66%  { opacity: .87; }
  100% { opacity: 1; }
}

/* Dust, turning in the leak. The only thing in the frame that moves
   across the picture rather than in place. */
.s-door .motes {
  position: absolute; left: 16%; right: 16%; bottom: 16%; height: 42%;
  pointer-events: none;
}
.s-door .motes i {
  position: absolute; bottom: 0;
  width: .85vmin; aspect-ratio: 1; border-radius: 50%;
  background: rgba(var(--butter-soft), .9);
  filter: blur(.12vmin);
  opacity: .34;
  animation: a-door-mote 22s ease-in-out infinite;
  animation-play-state: paused;
}
@keyframes a-door-mote {
  0%   { transform: translate(0, 0) scale(.55); opacity: .16; }
  18%  { opacity: .66; }
  62%  { opacity: .50; }
  100% { transform: translate(var(--x, 3vmin), -34vmin) scale(1); opacity: 0; }
}
.s-door .motes i:nth-child(1)  { left: 12%; bottom: 2%;  --x:  3.4vmin; animation-duration: 24s; animation-delay: -2s;  }
.s-door .motes i:nth-child(2)  { left: 27%; bottom: 0%;  --x: -2.6vmin; animation-duration: 31s; animation-delay: -9s;  width: .65vmin; }
.s-door .motes i:nth-child(3)  { left: 41%; bottom: 5%;  --x:  4.8vmin; animation-duration: 27s; animation-delay: -16s; }
.s-door .motes i:nth-child(4)  { left: 55%; bottom: 1%;  --x: -4.2vmin; animation-duration: 34s; animation-delay: -5s;  width: .7vmin; }
.s-door .motes i:nth-child(5)  { left: 68%; bottom: 4%;  --x:  2.2vmin; animation-duration: 29s; animation-delay: -21s; }
.s-door .motes i:nth-child(6)  { left: 82%; bottom: 0%;  --x: -3.0vmin; animation-duration: 26s; animation-delay: -12s; width: .6vmin; }
.s-door .motes i:nth-child(7)  { left: 20%; bottom: 8%;  --x:  5.2vmin; animation-duration: 37s; animation-delay: -26s; width: .55vmin; }
.s-door .motes i:nth-child(8)  { left: 49%; bottom: 10%; --x: -2.0vmin; animation-duration: 32s; animation-delay: -30s; width: .95vmin; }
.s-door .motes i:nth-child(9)  { left: 74%; bottom: 9%;  --x:  3.8vmin; animation-duration: 39s; animation-delay: -3s;  width: .5vmin; }
.s-door .motes i:nth-child(10) { left: 35%; bottom: 12%; --x: -5.0vmin; animation-duration: 35s; animation-delay: -18s; width: .6vmin; }

.s-door .vig {
  position: absolute; inset: 0;
  background:
    linear-gradient(to bottom, rgba(6, 4, 8, .74) 0%, rgba(6, 4, 8, 0) 22%),
    radial-gradient(88% 68% at 50% 64%,
      rgba(6, 4, 8, 0) 0%, rgba(6, 4, 8, .44) 68%, rgba(6, 4, 8, .92) 100%);
}

.page.live .s-door .seam,
.page.live .s-door .seam-glow,
.page.live .s-door .under,
.page.live .s-door .under-glow,
.page.live .s-door .spill,
.page.live .s-door .spill-core,
.page.live .s-door .motes i { animation-play-state: running; }


/* ───────────────────────────────────────────────────────────────────
   2 · .s-painting — "This is the picture in your head."
   Hung, not shown. Mat, bevel, varnish, and a Ken Burns creep slow
   enough that you only notice it if you stare. Frame is inset more
   at the foot so nothing important falls in the toolbar strip.
   ─────────────────────────────────────────────────────────────────── */

.s-painting {
  --ink: 62, 47, 74;
  --parch: 255, 247, 237;
  background: #241C2B;
}

.s-painting .ground {
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(97deg,
      rgba(255, 247, 237, .012) 0 .9%,
      rgba(0, 0, 0, .012) .9% 1.8%),
    radial-gradient(84% 60% at 50% 42%, #3A2E44 0%, #241C2B 58%, #150F1C 100%);
}

.s-painting .frame {
  position: absolute; inset: 5% 4.5% 14% 4.5%;
  border-radius: .6vmin;
  background:
    linear-gradient(148deg, #E9D3B2 0%, #CFB18C 38%, #AE8C64 72%, #DFC7A4 100%);
  box-shadow:
    0 3.4vmin 8vmin rgba(0, 0, 0, .62),
    0 .6vmin 1.6vmin rgba(0, 0, 0, .45),
    inset 0 0 0 .35vmin rgba(154, 107, 0, .30);
}

.s-painting .mat {
  position: absolute; inset: 3.4%;
  background: linear-gradient(to bottom, #FBF0DE 0%, #EBD9C0 100%);
  box-shadow: inset 0 .3vmin .9vmin rgba(var(--ink), .24);
}

.s-painting .win {
  position: absolute; inset: 4.6%;
  overflow: hidden;
  background: #2A2130;
  box-shadow: inset 0 0 0 .25vmin rgba(154, 107, 0, .48);
}

.s-painting .plate {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: 50% 38%;
  display: block;
  transform-origin: 52% 40%;
  filter: sepia(.22) saturate(.92) contrast(.97) brightness(.97);
  animation: a-paint-kb 78s ease-in-out infinite alternate;
  animation-play-state: paused;
  transform: scale(1.10);
}
@keyframes a-paint-kb {
  0%   { transform: scale(1.08) translate(-1.4%, -1.2%); }
  100% { transform: scale(1.18) translate(1.6%, 1.8%); }
}

/* Varnish gone amber, the way a reproduction always is. */
.s-painting .warm {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom,
    rgba(255, 211, 110, .24) 0%,
    rgba(255, 122, 92, .11) 46%,
    rgba(62, 47, 74, .18) 100%);
  mix-blend-mode: soft-light;
}
.s-painting .wash {
  position: absolute; inset: 0;
  background: rgba(var(--parch), .13);
  mix-blend-mode: overlay;
}
.s-painting .grain {
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(93deg,
      rgba(var(--parch), .05) 0 .18%,
      rgba(var(--ink), .05) .18% .36%),
    repeating-linear-gradient(3deg,
      rgba(var(--parch), .035) 0 .22%,
      rgba(var(--ink), .035) .22% .44%);
  opacity: .55;
  mix-blend-mode: overlay;
}
.s-painting .glass {
  position: absolute; inset: 0;
  background: linear-gradient(122deg,
    rgba(255, 247, 237, .14) 0%,
    rgba(255, 247, 237, .03) 24%,
    rgba(255, 247, 237, 0) 44%);
}
.s-painting .vig {
  position: absolute; inset: 0;
  background: radial-gradient(76% 60% at 50% 44%,
    rgba(62, 47, 74, 0) 0%, rgba(62, 47, 74, .34) 64%, rgba(38, 27, 47, .78) 100%);
}

.s-painting .bevel {
  position: absolute; inset: 0;
  border-radius: .6vmin;
  pointer-events: none;
  box-shadow:
    inset .35vmin .35vmin .9vmin rgba(255, 247, 237, .50),
    inset -.35vmin -.35vmin 1.1vmin rgba(90, 60, 20, .48);
}

/* The quiet band — the caption crosses the middle of a photograph,
   so the photograph gets darker there. */
.s-painting .band {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom,
    rgba(21, 15, 28, 0) 22%,
    rgba(21, 15, 28, .40) 42%,
    rgba(21, 15, 28, .44) 58%,
    rgba(21, 15, 28, 0) 80%);
}

.page.live .s-painting .plate { animation-play-state: running; }


/* ───────────────────────────────────────────────────────────────────
   3 · .s-fleet — "Rome arrives, and Antony dies first."
   Horizon at 72%. Everything that matters lives above 88% and below
   the caption: the sun sits just clear of the water, the galleys
   stand off in six sizes, and the middle third is bare dawn sky.
   ─────────────────────────────────────────────────────────────────── */

.s-fleet {
  --butter: 255, 211, 110;
  --butter-soft: 255, 230, 174;
  background: #153742;
}

.s-fleet .sky {
  position: absolute; left: 0; right: 0; top: 0; bottom: 28%;
  background: linear-gradient(to bottom,
    #14343F 0%,
    #26364E 16%,
    #464172 32%,
    #8374AE 47%,
    #BC8E9E 60%,
    #EE9C81 72%,
    #FFC97E 86%,
    #FFE9BC 100%);
}

/* The band of haze that always sits on a sea horizon at dawn. */
.s-fleet .haze {
  position: absolute; left: 0; right: 0; bottom: 28%; height: 13%;
  background: linear-gradient(to top,
    rgba(var(--butter-soft), .82) 0%,
    rgba(var(--butter-soft), .30) 42%,
    rgba(var(--butter-soft), 0) 100%);
}

.s-fleet .sun {
  position: absolute; left: 62%; bottom: 28.5%;
  width: 13vmin; aspect-ratio: 1;
  transform: translateX(-50%);
  border-radius: 50%;
  background:
    radial-gradient(circle at 50% 50%,
      rgba(255, 250, 240, .96) 0%,
      rgba(var(--butter-soft), .92) 30%,
      rgba(var(--butter), .52) 50%,
      rgba(255, 122, 92, .20) 72%,
      rgba(255, 122, 92, 0) 100%);
  animation: a-fleet-sun 14s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes a-fleet-sun {
  0%   { transform: translateX(-50%) scale(1); opacity: .92; }
  100% { transform: translateX(-50%) scale(1.06); opacity: 1; }
}

.s-fleet .cloud {
  position: absolute;
  border-radius: 50vmin;
  filter: blur(1.1vmin);
  animation: a-fleet-cloud 96s ease-in-out infinite alternate;
  animation-play-state: paused;
}
.s-fleet .cloud.c1 {
  left: -8%; top: 13%; width: 54%; height: 1.9vmin;
  background: rgba(183, 156, 237, .42);
  animation-duration: 104s;
}
.s-fleet .cloud.c2 {
  left: 26%; top: 18.5%; width: 62%; height: 2.6vmin;
  background: rgba(255, 179, 193, .30);
  animation-duration: 88s; animation-delay: -22s;
}
.s-fleet .cloud.c3 {
  left: -14%; top: 23.5%; width: 46%; height: 1.5vmin;
  background: rgba(255, 211, 110, .26);
  animation-duration: 118s; animation-delay: -47s;
}
.s-fleet .cloud.c4 {
  left: 44%; top: 8.5%; width: 44%; height: 1.3vmin;
  background: rgba(154, 163, 174, .22);
  animation-duration: 130s; animation-delay: -12s;
}
@keyframes a-fleet-cloud {
  0%   { transform: translateX(-3%); }
  100% { transform: translateX(5%); }
}

.s-fleet .sea {
  position: absolute; left: 0; right: 0; bottom: 0; height: 28%;
  background: linear-gradient(to bottom,
    #FFDDA0 0%,
    #E8926F 5%,
    #7A6E86 12%,
    #2E7F84 26%,
    #1F7A72 48%,
    #145A55 76%,
    #0E4441 100%);
}

/* The sun's road on the water — a soft-edged wash, never a rectangle. */
.s-fleet .run {
  position: absolute; bottom: 0; height: 28%;
  left: 62%; width: 46%;
  transform: translateX(-50%);
  background: radial-gradient(46% 104% at 50% -4%,
    rgba(var(--butter-soft), .62) 0%,
    rgba(var(--butter), .26) 32%,
    rgba(var(--butter), .08) 58%,
    rgba(var(--butter), 0) 82%);
  filter: blur(1.8vmin);
}

.s-fleet .fleet { position: absolute; inset: 0; }

.s-fleet .ship {
  position: absolute;
  aspect-ratio: 120 / 74;
  transform-origin: 50% 100%;
  animation: a-fleet-approach 84s ease-in-out infinite alternate;
  animation-play-state: paused;
}
.s-fleet .ship svg { width: 100%; height: 100%; display: block; }

.s-fleet .ship.s1 { left:  4%; bottom: 25.4%; height: 9.4%; color: #221A2C; opacity: .96; animation-duration:  78s; }
.s-fleet .ship.s2 { left: 27%; bottom: 26.6%; height: 7.2%; color: #2C2338; opacity: .90; animation-duration:  92s; animation-delay: -14s; }
.s-fleet .ship.s3 { left: 48%; bottom: 27.3%; height: 5.6%; color: #3E2F4A; opacity: .76; animation-duration: 104s; animation-delay: -33s; }
.s-fleet .ship.s4 { left: 78%; bottom: 27.8%; height: 4.4%; color: #55445F; opacity: .60; animation-duration: 118s; animation-delay:  -8s; }
.s-fleet .ship.s5 { left: 88%; bottom: 28.1%; height: 3.2%; color: #6F5E77; opacity: .44; animation-duration: 132s; animation-delay: -55s; }
.s-fleet .ship.s6 { left: 38%; bottom: 28.3%; height: 2.7%; color: #83738A; opacity: .32; animation-duration: 146s; animation-delay: -27s; }

@keyframes a-fleet-approach {
  0%   { transform: translate(0, 0) scale(.955); }
  100% { transform: translate(-1.6%, 0) scale(1.05); }
}

/* Light lying on the water in flat strokes. */
.s-fleet .glitter { position: absolute; inset: 0; pointer-events: none; }
.s-fleet .glitter i {
  position: absolute;
  height: .7vmin; border-radius: 1vmin;
  background: rgba(var(--butter-soft), .72);
  animation: a-fleet-run 26s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes a-fleet-run {
  0%   { transform: translateX(-3vmin); opacity: .32; }
  50%  { opacity: .86; }
  100% { transform: translateX(3vmin); opacity: .42; }
}
.s-fleet .glitter i:nth-child(1) { left: 10%; bottom: 23.0%; width: 16%; animation-duration: 30s; }
.s-fleet .glitter i:nth-child(2) { left: 46%; bottom: 21.4%; width: 24%; animation-duration: 38s; animation-delay: -9s;  }
.s-fleet .glitter i:nth-child(3) { left: 22%; bottom: 18.2%; width: 12%; animation-duration: 34s; animation-delay: -17s; }
.s-fleet .glitter i:nth-child(4) { left: 62%; bottom: 16.0%; width: 20%; animation-duration: 42s; animation-delay: -4s;  }
.s-fleet .glitter i:nth-child(5) { left:  4%; bottom: 13.0%; width: 28%; animation-duration: 46s; animation-delay: -25s; }
.s-fleet .glitter i:nth-child(6) { left: 54%; bottom: 10.2%; width: 16%; animation-duration: 36s; animation-delay: -12s; }
.s-fleet .glitter i:nth-child(7) { left: 30%; bottom:  7.4%; width: 34%; animation-duration: 52s; animation-delay: -31s; height: .95vmin; }
.s-fleet .glitter i:nth-child(8) { left: 70%; bottom:  4.0%; width: 22%; animation-duration: 44s; animation-delay: -20s; height: .95vmin; }
.s-fleet .glitter i:nth-child(9) { left:  8%; bottom:  1.2%; width: 30%; animation-duration: 58s; animation-delay: -40s; height: 1.1vmin; }

.s-fleet .headland {
  position: absolute; left: 0; right: 0; bottom: 0; height: 9%;
  background: linear-gradient(to top, rgba(10, 40, 40, .58), rgba(10, 40, 40, 0));
}

.s-fleet .vig {
  position: absolute; inset: 0;
  background:
    linear-gradient(to bottom, rgba(16, 20, 40, .42) 0%, rgba(16, 20, 40, 0) 26%),
    radial-gradient(92% 74% at 50% 52%,
      rgba(24, 18, 32, 0) 40%, rgba(24, 18, 32, .36) 100%);
}

.page.live .s-fleet .sun,
.page.live .s-fleet .cloud,
.page.live .s-fleet .ship,
.page.live .s-fleet .glitter i { animation-play-state: running; }


/* ───────────────────────────────────────────────────────────────────
   4 · .s-afternoon — "Then she takes an afternoon."
   One room, one window, one shaft, and the shaft crawling — the only
   clock the scene has. Floor line at 68%, the pool of light lands
   68–85%, the bench and the sealed letter sit 72–86%. Furniture is
   sized by aspect-ratio so a wide window doesn't squash it.
   ─────────────────────────────────────────────────────────────────── */

.s-afternoon {
  --shadow: 62, 47, 74;
  --butter: 255, 211, 110;
  --butter-soft: 255, 230, 174;
  background: #C0A184;
}

.s-afternoon .wall {
  position: absolute; inset: 0;
  background:
    linear-gradient(100deg,
      rgba(var(--shadow), .40) 0%,
      rgba(var(--shadow), .08) 34%,
      rgba(var(--shadow), 0) 62%,
      rgba(var(--shadow), .18) 100%),
    linear-gradient(to bottom,
      rgba(var(--shadow), .56) 0%,
      rgba(var(--shadow), .12) 24%,
      rgba(var(--shadow), .02) 48%,
      rgba(var(--shadow), .22) 76%,
      rgba(var(--shadow), .44) 100%),
    linear-gradient(to bottom, #C6A585 0%, #E0C39C 42%, #C9AB8B 78%, #AC907F 100%);
}

.s-afternoon .courses {
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(to bottom,
      rgba(var(--shadow), 0) 0 7.4%,
      rgba(var(--shadow), .12) 7.4% 7.8%),
    repeating-linear-gradient(to right,
      rgba(var(--shadow), 0) 0 23%,
      rgba(var(--shadow), .085) 23% 23.4%);
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 62%, transparent 70%);
          mask-image: linear-gradient(to bottom, #000 0%, #000 62%, transparent 70%);
}

.s-afternoon .dado {
  position: absolute; left: 0; right: 0; bottom: 32%; height: 9%;
  background: linear-gradient(to bottom,
    rgba(var(--shadow), .04), rgba(var(--shadow), .24));
}

.s-afternoon .window {
  position: absolute; right: 9%; top: 7%;
  height: 25%; aspect-ratio: .5;
}
.s-afternoon .window .splay {
  position: absolute; inset: -8% -12%;
  border-radius: 50% 50% 3% 3% / 26% 26% 2% 2%;
  background: linear-gradient(to bottom, rgba(255, 247, 237, .22), rgba(255, 247, 237, .06));
}
.s-afternoon .window .glass {
  position: absolute; inset: 0;
  border-radius: 50% 50% 3% 3% / 26% 26% 2% 2%;
  background: linear-gradient(to bottom,
    #FFFDF6 0%, #FFF0C8 38%, #FFDC90 74%, #FFC86E 100%);
  box-shadow: 0 0 8vmin rgba(var(--butter), .66), 0 0 2vmin rgba(255, 247, 237, .85);
  animation: a-aft-glow 16s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes a-aft-glow {
  0%   { filter: brightness(.95); }
  100% { filter: brightness(1.07); }
}
.s-afternoon .window .bar {
  position: absolute; left: -3%; right: -3%; top: 52%; height: 3.2%;
  border-radius: .4vmin;
  background: rgba(var(--shadow), .58);
}
.s-afternoon .window .sill {
  position: absolute; left: -18%; right: -18%; bottom: -6%; height: 5.5%;
  border-radius: .5vmin;
  background: linear-gradient(to bottom, #F6E7CE, #B79A7E);
}

.s-afternoon .floor {
  position: absolute; left: 0; right: 0; bottom: 0; height: 32%;
  background: linear-gradient(to bottom,
    #EBD3AE 0%, #D6BA95 18%, #BC9E7E 50%, #9B8175 82%, #786274 100%);
}

.s-afternoon .slabs {
  position: absolute; left: 0; right: 0; bottom: 0; height: 32%;
  background-repeat: no-repeat;
  background-image:
    linear-gradient(rgba(var(--shadow), .18), rgba(var(--shadow), .18)),
    linear-gradient(rgba(var(--shadow), .18), rgba(var(--shadow), .18)),
    linear-gradient(rgba(var(--shadow), .18), rgba(var(--shadow), .18)),
    linear-gradient(rgba(var(--shadow), .075), rgba(var(--shadow), .075)),
    linear-gradient(rgba(var(--shadow), .075), rgba(var(--shadow), .075)),
    linear-gradient(rgba(var(--shadow), .065), rgba(var(--shadow), .065));
  background-size:
    100% .5%, 100% .6%, 100% .8%,
    .35% 24%, .4% 36%, .45% 20%;
  background-position:
    0 14%, 0 40%, 0 78%,
    22% 14%, 63% 40%, 34% 78%;
}

.s-afternoon .skirt {
  position: absolute; left: 0; right: 0; bottom: 32%; height: 1.1%;
  background: linear-gradient(to bottom,
    rgba(255, 247, 237, .34), rgba(var(--shadow), .50));
}

/* Everything the light does, moved as one piece, very slowly.
   This is the scene's clock. */
.s-afternoon .drift {
  position: absolute; inset: 0;
  animation: a-aft-crawl 92s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes a-aft-crawl {
  0%   { transform: translate(-4.5%, -.6%); }
  100% { transform: translate(4.5%, .8%); }
}

.s-afternoon .beam {
  position: absolute; left: 28%; top: 9%; width: 46%; height: 59%;
  clip-path: polygon(72% 0%, 97% 0%, 48% 100%, 1% 100%);
  background: linear-gradient(to bottom,
    rgba(var(--butter-soft), .50) 0%,
    rgba(var(--butter), .20) 30%,
    rgba(var(--butter), .11) 58%,
    rgba(var(--butter), .16) 84%,
    rgba(var(--butter), .24) 100%);
  filter: blur(1.5vmin);
  mix-blend-mode: screen;
}

.s-afternoon .pool {
  position: absolute; left: 18%; top: 67.5%; width: 42%; height: 18%;
  clip-path: polygon(25% 0%, 77% 0%, 96% 100%, -4% 100%);
  background: linear-gradient(to bottom,
    rgba(var(--butter-soft), .88) 0%,
    rgba(var(--butter-soft), .56) 38%,
    rgba(var(--butter), .30) 74%,
    rgba(var(--butter), .10) 100%);
  filter: blur(1.5vmin);
  mix-blend-mode: screen;
}
/* The mullion's shadow, laid across the pool. */
.s-afternoon .pool2 {
  position: absolute; left: 20%; top: 75.5%; width: 36%; height: 1.5%;
  transform: skewX(-24deg);
  background: rgba(var(--shadow), .30);
  filter: blur(.5vmin);
}
/* Where the shaft grazes the wall on its way down. */
.s-afternoon .wallpatch {
  position: absolute; left: 30%; top: 56%; width: 30%; height: 14%;
  background: radial-gradient(ellipse at 50% 50%,
    rgba(var(--butter-soft), .24) 0%, rgba(var(--butter), 0) 72%);
  mix-blend-mode: screen;
}

.s-afternoon .motes {
  position: absolute; left: 20%; right: 34%; top: 30%; bottom: 16%;
  pointer-events: none;
}
.s-afternoon .motes i {
  position: absolute;
  width: .8vmin; aspect-ratio: 1; border-radius: 50%;
  background: rgba(255, 250, 240, .95);
  opacity: .38;
  animation: a-aft-mote 30s ease-in-out infinite;
  animation-play-state: paused;
}
@keyframes a-aft-mote {
  0%   { transform: translate(0, 0) scale(.6); opacity: .12; }
  22%  { opacity: .58; }
  70%  { opacity: .36; }
  100% { transform: translate(var(--x, -4vmin), var(--y, 8vmin)) scale(1); opacity: 0; }
}
.s-afternoon .motes i:nth-child(1)  { left: 62%; top:  4%; --x: -5vmin; --y: 12vmin; animation-duration: 34s; animation-delay: -3s;  }
.s-afternoon .motes i:nth-child(2)  { left: 48%; top: 16%; --x: -3vmin; --y: 16vmin; animation-duration: 41s; animation-delay: -14s; width: .6vmin; }
.s-afternoon .motes i:nth-child(3)  { left: 71%; top: 26%; --x: -6vmin; --y:  9vmin; animation-duration: 29s; animation-delay: -22s; }
.s-afternoon .motes i:nth-child(4)  { left: 35%; top: 36%; --x: -2vmin; --y: 13vmin; animation-duration: 46s; animation-delay: -7s;  width: .55vmin; }
.s-afternoon .motes i:nth-child(5)  { left: 56%; top: 47%; --x: -7vmin; --y:  7vmin; animation-duration: 37s; animation-delay: -31s; }
.s-afternoon .motes i:nth-child(6)  { left: 26%; top: 58%; --x: -3vmin; --y: 10vmin; animation-duration: 52s; animation-delay: -18s; width: .65vmin; }
.s-afternoon .motes i:nth-child(7)  { left: 44%; top: 68%; --x: -5vmin; --y:  6vmin; animation-duration: 33s; animation-delay: -40s; }
.s-afternoon .motes i:nth-child(8)  { left: 66%; top: 12%; --x: -4vmin; --y: 18vmin; animation-duration: 58s; animation-delay: -26s; width: .5vmin; }
.s-afternoon .motes i:nth-child(9)  { left: 18%; top: 74%; --x:  2vmin; --y:  7vmin; animation-duration: 44s; animation-delay: -11s; width: .6vmin; }
.s-afternoon .motes i:nth-child(10) { left: 58%; top: 32%; --x: -8vmin; --y: 11vmin; animation-duration: 62s; animation-delay: -49s; width: .5vmin; }
.s-afternoon .motes i:nth-child(11) { left: 30%; top: 22%; --x: -2vmin; --y: 15vmin; animation-duration: 39s; animation-delay: -35s; width: .7vmin; }

/* The evidence: a bench, the robe folded, the letter written and
   sealed. Nobody. Sized off its own height so it keeps its
   proportions from a phone to a desktop. */
.s-afternoon .bench {
  position: absolute; right: 6%; bottom: 14%;
  height: 11%; aspect-ratio: 1.85;
}
.s-afternoon .bench .top {
  position: absolute; left: 0; right: 0; top: 34%; height: 14%;
  border-radius: .8vmin;
  background: linear-gradient(to bottom, #EBD6B6 0%, #C3A484 58%, #9C8177 100%);
  box-shadow: 0 .9vmin 1.8vmin rgba(var(--shadow), .34);
}
.s-afternoon .bench .leg {
  position: absolute; top: 46%; bottom: 0; width: 6.5%;
  background: linear-gradient(to bottom, #B0917A, #7E6668);
  border-radius: 0 0 .4vmin .4vmin;
}
.s-afternoon .bench .leg.l { left: 12%; }
.s-afternoon .bench .leg.r { right: 12%; }
.s-afternoon .bench .robe {
  position: absolute; left: 7%; top: 14%; width: 38%; height: 20%;
  border-radius: .7vmin .7vmin .3vmin .3vmin;
  background: linear-gradient(to bottom, #B32B43 0%, #8A1C33 100%);
}
.s-afternoon .bench .robe2 {
  position: absolute; left: 11%; top: 2%; width: 30%; height: 14%;
  border-radius: .7vmin;
  background: linear-gradient(to bottom, #CE4E64, #A81F38);
}
.s-afternoon .bench .letter {
  position: absolute; right: 6%; top: 20%; width: 34%; height: 13%;
  border-radius: .3vmin;
  transform: rotate(-4deg);
  background: linear-gradient(to bottom, #FFF7ED, #E7D4B8);
  box-shadow: 0 .3vmin .8vmin rgba(var(--shadow), .38);
}
.s-afternoon .bench .seal {
  position: absolute; right: 18%; top: 24%;
  width: 4%; aspect-ratio: 1; border-radius: 50%;
  background: #A81F38;
}

/* The meal, cleared away and left on the flags. */
.s-afternoon .bowl {
  position: absolute; left: 8%; bottom: 17%;
  height: 4.2%; aspect-ratio: 2.5;
}
.s-afternoon .bowl .body {
  position: absolute; inset: 26% 6% 0 6%;
  border-radius: 6% 6% 50% 50% / 6% 6% 100% 100%;
  background: linear-gradient(to bottom, #A87615, #6E4C0A);
}
.s-afternoon .bowl .rim {
  position: absolute; left: 0; right: 0; top: 0; height: 42%;
  border-radius: 50%;
  background: linear-gradient(to bottom, #D2A337, #8A6410);
}

.s-afternoon .vig {
  position: absolute; inset: 0;
  background:
    linear-gradient(to bottom, rgba(var(--shadow), .50) 0%, rgba(var(--shadow), 0) 20%),
    radial-gradient(88% 68% at 42% 62%,
      rgba(var(--shadow), 0) 34%, rgba(var(--shadow), .32) 78%, rgba(var(--shadow), .60) 100%);
}

.page.live .s-afternoon .window .glass,
.page.live .s-afternoon .drift,
.page.live .s-afternoon .motes i { animation-play-state: running; }


/* ───────────────────────────────────────────────────────────────────
   Reduced motion — every scene must hold as a still frame.
   ─────────────────────────────────────────────────────────────────── */

html.no-motion .s-door .seam,
html.no-motion .s-door .seam-glow,
html.no-motion .s-door .under,
html.no-motion .s-door .under-glow,
html.no-motion .s-door .spill,
html.no-motion .s-door .spill-core,
html.no-motion .s-door .motes i,
html.no-motion .s-painting .plate,
html.no-motion .s-fleet .sun,
html.no-motion .s-fleet .cloud,
html.no-motion .s-fleet .ship,
html.no-motion .s-fleet .glitter i,
html.no-motion .s-afternoon .window .glass,
html.no-motion .s-afternoon .drift,
html.no-motion .s-afternoon .motes i {
  animation: none !important;
}

/* …and still compose: the frame each animation would otherwise have
   been paused on is opacity 0, so give them a resting state. */
html.no-motion .s-door .seam,
html.no-motion .s-door .seam-glow,
html.no-motion .s-door .under,
html.no-motion .s-door .under-glow,
html.no-motion .s-door .spill,
html.no-motion .s-door .spill-core { opacity: .94; }
html.no-motion .s-door .motes i        { opacity: .42; transform: translate(0, -12vmin) scale(.85); }
html.no-motion .s-painting .plate      { transform: scale(1.12) translate(0, .4%); }
html.no-motion .s-fleet .sun           { transform: translateX(-50%) scale(1.02); opacity: .96; }
html.no-motion .s-fleet .ship          { transform: scale(1); }
html.no-motion .s-fleet .glitter i     { opacity: .60; }
html.no-motion .s-afternoon .drift     { transform: translate(0, 0); }
html.no-motion .s-afternoon .motes i   { opacity: .40; transform: translate(-3vmin, 5vmin) scale(.85); }

/* ═══════════════════════════════════════════════════════════════════
   SCENES B — beats 5–8. Every selector scoped under its .s-NAME.
   Composed for 390×844 portrait first; checked at 1440×800.
   Vertical grammar shared by all four: the ground line sits at ~78%,
   the subject lives between ~58% and ~86%, the middle third is a wash,
   and the bottom 12% is treated as sacrificial (Instagram's toolbar).
   ═══════════════════════════════════════════════════════════════════ */


/* ───────────────────────────────────────────────────────────────────
   5 · .s-scroll — "Our earliest witness says he doesn't know."
   A papyrus, part unrolled. Six lines of marks arrive one after
   another and then stop. The blank quarter after them is the subject;
   the two rolled accounts up in the light are the other versions.
   ─────────────────────────────────────────────────────────────────── */

.s-scroll {
  --parch:   #FFF7ED;
  --parch-d: #F3E2C9;
  --page:    #FDF4E6;
  --page-lo: #EFDCBE;
  --curl:    #E7D3AE;
  --roll:    #F0DCB2;
  --roll-in: #DEC593;
  --plum:    #6B4BB0;
  --ink:     #3E2F4A;
}

.s-scroll .scr-ground {
  position: absolute; inset: 0;
  background:
    radial-gradient(120% 70% at 50% 108%, rgba(154,107,0,.13), rgba(154,107,0,0) 62%),
    linear-gradient(178deg, var(--parch) 0%, #FDF1E1 46%, var(--parch-d) 100%);
}

/* the light coming across the desk — the whisper up top */
.s-scroll .scr-glow {
  position: absolute; inset: 0;
  background:
    radial-gradient(44% 28% at 22% 13%, rgba(255,211,110,.55), rgba(255,211,110,0) 72%),
    radial-gradient(70% 40% at 80% 2%,  rgba(255,251,244,.7), rgba(255,251,244,0) 70%);
  animation: scrGlow 15s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes scrGlow { from { opacity: .68 } to { opacity: 1 } }

/* the warm plane it all lies on */
.s-scroll .scr-desk {
  position: absolute; left: 0; right: 0; top: 58%; bottom: 0;
  background: linear-gradient(180deg, rgba(154,107,0,0) 0%, rgba(154,107,0,.09) 52%, rgba(154,107,0,.18) 100%);
}

/* the other accounts, rolled and unopened */
.s-scroll .scr-spares {
  position: absolute; left: 6%; top: 10.5%; width: min(42%, 33vh); aspect-ratio: 2.1;
  opacity: .9;
}
.s-scroll .scr-spares svg { width: 100%; height: 100%; display: block; overflow: visible; }
.s-scroll .scr-spare rect { fill: var(--roll); }
.s-scroll .scr-spare .scr-tie { fill: var(--plum); opacity: .22; }
.s-scroll .scr-spare .scr-cap { fill: #E6CE9A; }
.s-scroll .scr-spare .scr-eye { fill: #C9AF74; }
.s-scroll .scr-spare-b { opacity: .82; }
.s-scroll .scr-spares .scr-sh   { fill: #9A6B00; opacity: .13; }
.s-scroll .scr-spare .scr-open  { fill: #FBF0DA; }
.s-scroll .scr-spare .scr-mark  { fill: var(--plum); opacity: .5; }

/* the sheet */
.s-scroll .scr-shadow {
  position: absolute; left: 50%; bottom: 13.6%;
  width: min(90%, 56vh); height: 3%;
  transform: translateX(-50%);
  border-radius: 50%;
  background: radial-gradient(60% 100% at 50% 50%, rgba(62,47,74,.17), rgba(62,47,74,0) 72%);
}
.s-scroll .scr-sheet {
  position: absolute; left: 50%; bottom: 15%;
  width: min(94%, 58vh); aspect-ratio: 2.5;
  transform: translateX(-50%);
}
.s-scroll .scr-sheet svg { width: 100%; height: 100%; display: block; }

.s-scroll .scr-page    { fill: var(--page); }
.s-scroll .scr-page-lo { fill: var(--page-lo); opacity: .5; }
.s-scroll .scr-curl    { fill: var(--curl); }
.s-scroll .scr-fibre path { fill: none; stroke: #9A6B00; stroke-width: .7; opacity: .07; }
.s-scroll .scr-roll rect          { fill: var(--roll); }
.s-scroll .scr-roll .scr-roll-end { fill: #FBEAC6; }
.s-scroll .scr-roll .scr-roll-in  { fill: var(--roll-in); opacity: .6; }
.s-scroll .scr-roll .scr-roll-sp  { fill: none; stroke: #C9A96E; stroke-width: 1.4; opacity: .6; }

/* the marks. Never letters — strokes. */
.s-scroll .scr-ink rect      { fill: var(--plum); opacity: .82; }
.s-scroll .scr-ink .scr-tick { fill: var(--ink); opacity: .74; }

/* Base state is the written page, so a scene that is not the live one
   still composes; the write-on only exists while the page is live. */
.s-scroll .scr-row {
  transform-box: fill-box;
  transform-origin: 0% 50%;
  animation: scrWrite 26s ease-in-out infinite;
  animation-play-state: paused;
}
.page:not(.live) .s-scroll .scr-row { animation-name: none; }
.s-scroll .scr-r1 { animation-delay: 0s }
.s-scroll .scr-r2 { animation-delay: 1.15s }
.s-scroll .scr-r3 { animation-delay: 2.30s }
.s-scroll .scr-r4 { animation-delay: 3.45s }
.s-scroll .scr-r5 { animation-delay: 4.60s }
.s-scroll .scr-r6 { animation-delay: 5.75s }

@keyframes scrWrite {
  0%        { transform: scaleX(0); opacity: 0 }
  2%        { opacity: 1 }
  9%        { transform: scaleX(1); opacity: 1 }
  84%       { transform: scaleX(1); opacity: 1 }
  93%, 100% { transform: scaleX(1); opacity: 0 }
}

.page.live .s-scroll .scr-row,
.page.live .s-scroll .scr-glow { animation-play-state: running; }

html.no-motion .s-scroll .scr-glow { animation: none; opacity: .9 }
html.no-motion .s-scroll .scr-row  { animation: none; transform: none; opacity: 1 }


/* ───────────────────────────────────────────────────────────────────
   6 · .s-coil — "Why do historians doubt the snake?"
   Something coiled, mostly in shadow, never quite resolved. One cold
   glint travels over its back. Two faint marks off to the side, which
   is all anyone ever claimed to see. No head, deliberately.
   ─────────────────────────────────────────────────────────────────── */

.s-coil {
  --night:  #1B1620;
  --scale1: #443A52;
  --scale2: #392F45;
  --scale3: #50445F;
  --blush:  #FFB3C1;
}

.s-coil .coi-ground {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, #171219 0%, var(--night) 44%, #120E17 100%);
}
/* a cold, unexplained source somewhere off to the upper right */
.s-coil .coi-lift {
  position: absolute; inset: 0;
  background:
    radial-gradient(46% 26% at 47% 74%, rgba(88,76,106,.6), rgba(88,76,106,0) 74%),
    radial-gradient(70% 46% at 86% 4%,  rgba(154,163,174,.13), rgba(154,163,174,0) 68%);
}
/* the shadow it is lying in — the bottom of the coil never resolves */
.s-coil .coi-dark {
  position: absolute; left: 0; right: 0; top: 72%; bottom: 0;
  background: linear-gradient(180deg, rgba(18,14,23,0) 0%, rgba(18,14,23,.72) 46%, rgba(18,14,23,.96) 100%);
}
.s-coil .coi-vig {
  position: absolute; inset: 0;
  background: radial-gradient(86% 62% at 50% 68%, rgba(0,0,0,0) 44%, rgba(0,0,0,.5) 100%);
}

.s-coil .coi-art {
  position: absolute; left: 50%; bottom: 15%;
  height: 26%; aspect-ratio: 1.244;
  transform: translateX(-50%);
}
.s-coil .coi-art svg { width: 100%; height: 100%; display: block; overflow: visible; }

.s-coil .coi-arc { fill: none; stroke-linecap: round; }
.s-coil .coi-arc-a { stroke: var(--scale1); stroke-width: 11.5; }
.s-coil .coi-arc-b { stroke: var(--scale3); stroke-width: 11; }
.s-coil .coi-arc-c { stroke: var(--scale2); stroke-width: 9; }
.s-coil .coi-tail { fill: none; stroke: url(#coi-fade); stroke-width: 10.5; stroke-linecap: round; }

/* it fades between there and not-there on a period nothing else shares */
.s-coil .coi-body {
  opacity: .62;
  animation: coiPresence 17.3s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes coiPresence { from { opacity: .44 } to { opacity: .88 } }

/* the single cold highlight, sliding slowly along its back */
.s-coil .coi-glint {
  fill: none; stroke-width: 2.8; stroke-linecap: round; opacity: .45;
  animation: coiGlint 19s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes coiGlint {
  from { stroke-dashoffset: -8;  opacity: .3 }
  50%  { opacity: .72 }
  to   { stroke-dashoffset: -56; opacity: .24 }
}

.s-coil .coi-marks ellipse { fill: var(--blush); }
.s-coil .coi-marks {
  opacity: .5;
  animation: coiMarks 11.7s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes coiMarks { from { opacity: .34 } to { opacity: .7 } }

@media (orientation: landscape) {
  .s-coil .coi-art { height: 34%; bottom: 13% }
}

.page.live .s-coil .coi-body,
.page.live .s-coil .coi-glint,
.page.live .s-coil .coi-marks { animation-play-state: running; }

html.no-motion .s-coil .coi-body  { animation: none; opacity: .68 }
html.no-motion .s-coil .coi-glint { animation: none; opacity: .5 }
html.no-motion .s-coil .coi-marks { animation: none; opacity: .55 }


/* ───────────────────────────────────────────────────────────────────
   7 · .s-basket — "The basket, and the other theory."
   Plutarch's figs on a ledge in the last of the light. Something
   curved among them, in the same olive as the leaves, so it could be
   a stem. Warm and domestic — that is the horror.
   ─────────────────────────────────────────────────────────────────── */

.s-basket {
  --wall:   #F3E3CE;
  --wall-d: #E2CDAB;
  --card:   #FFFBF4;
  --sunk:   #E0CBAB;
  --but-d:  #9A6B00;
  --olive:  #4E7B58;
  --blush:  #FFE3E8;
}

.s-basket .bsk-wall {
  position: absolute; inset: 0;
  background: linear-gradient(176deg, #F9EEDF 0%, var(--wall) 42%, var(--wall-d) 100%);
}

/* the window, with the evening still in it */
.s-basket .bsk-window {
  position: absolute; left: 21%; top: 9%;
  height: 22%; aspect-ratio: .58;
  transform: translateX(-50%);
  background: var(--card);
  border-radius: 50% 50% 8% 8% / 32% 32% 4% 4%;
  box-shadow: 0 1vmin 2.6vmin rgba(62,47,74,.07);
}
.s-basket .bsk-pane {
  position: absolute; inset: 9% 11% 6% 11%;
  background: linear-gradient(180deg, var(--blush) 0%, #FFEDD2 68%, #FFDCA6 100%);
  border-radius: 50% 50% 6% 6% / 34% 34% 3% 3%;
}
.s-basket .bsk-lamp {
  position: absolute; left: 50%; bottom: 10%;
  width: 82%; aspect-ratio: 1; transform: translateX(-50%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,211,110,.95) 0%, rgba(255,211,110,.42) 44%, rgba(255,211,110,0) 72%);
}
.s-basket .bsk-bar {
  position: absolute; left: 11%; right: 11%; top: 46%;
  height: 3.2%; border-radius: 1em;
  background: rgba(255,251,244,.92);
}

/* what the window throws across the room */
.s-basket .bsk-shaft,
.s-basket .bsk-shaft2 {
  position: absolute; filter: blur(.6vmin);
}
.s-basket .bsk-shaft {
  left: 6%; top: 12%; width: 74%; height: 70%;
  clip-path: polygon(16% 0%, 30% 0%, 100% 100%, 42% 100%);
  background: linear-gradient(168deg, rgba(255,211,110,.55), rgba(255,211,110,.16) 62%, rgba(255,211,110,0) 96%);
}
.s-basket .bsk-shaft2 {
  left: 6%; top: 12%; width: 74%; height: 70%;
  clip-path: polygon(19% 0%, 24% 0%, 74% 100%, 55% 100%);
  background: linear-gradient(168deg, rgba(255,251,244,.7), rgba(255,251,244,.1) 66%, rgba(255,251,244,0) 96%);
}

.s-basket .bsk-motes { position: absolute; inset: 0; }
.s-basket .bsk-motes i {
  position: absolute; width: 1vmin; aspect-ratio: 1; border-radius: 50%;
  background: var(--card); opacity: .6;
  animation: bskMote 22s ease-in-out infinite alternate;
  animation-play-state: paused;
}
.s-basket .bsk-m1 { left: 26%; top: 32%; animation-delay: 0s }
.s-basket .bsk-m2 { left: 34%; top: 46%; animation-delay: -4s; opacity: .4 }
.s-basket .bsk-m3 { left: 42%; top: 28%; animation-delay: -9s }
.s-basket .bsk-m4 { left: 31%; top: 58%; animation-delay: -13s; opacity: .34 }
.s-basket .bsk-m5 { left: 47%; top: 41%; animation-delay: -17s; opacity: .48 }
@keyframes bskMote {
  from { transform: translate(0,0) }
  to   { transform: translate(2.2vmin, -3.2vmin) }
}

/* the ledge */
.s-basket .bsk-sunk {
  position: absolute; left: 0; right: 0; top: 79%; bottom: 0;
  background: linear-gradient(180deg, var(--sunk) 0%, #D2BB96 100%);
}
.s-basket .bsk-slab {
  position: absolute; left: -2%; right: -2%; top: 78.2%;
  height: 4.2%; border-radius: 1.4vmin;
  background: linear-gradient(180deg, var(--card) 0%, #F5E9D5 100%);
}
.s-basket .bsk-pool {
  position: absolute; left: 20%; width: 54%; top: 78.4%;
  height: 1.5%; border-radius: 50%;
  background: rgba(255,211,110,.72); filter: blur(.8vmin);
}
.s-basket .bsk-cast {
  position: absolute; left: 34%; width: 46%; top: 80.2%;
  height: 1.4%; border-radius: 50%;
  background: rgba(62,47,74,.15); filter: blur(.6vmin);
}

.s-basket .bsk-art {
  position: absolute; left: 50%; bottom: 19.5%;
  height: 21.5%; aspect-ratio: 1.917;
  transform: translateX(-50%);
}
.s-basket .bsk-art svg { width: 100%; height: 100%; display: block; overflow: visible; }

.s-basket .bsk-weave     { fill: url(#bsk-weave-g); }
.s-basket .bsk-band rect { fill: var(--but-d); opacity: .16; }
.s-basket .bsk-warp rect { fill: var(--but-d); opacity: .09; }
.s-basket .bsk-shade     { fill: var(--but-d); opacity: .14; }
.s-basket .bsk-hollow    { fill: #A9762A; opacity: .5; }
.s-basket .bsk-rim-d     { fill: #E0AE49; }
.s-basket .bsk-rim       { fill: #FFDF95; }

.s-basket .bsk-lit   { color: #8A62CE; }
.s-basket .bsk-dim   { color: #6B4BB0; }
.s-basket .bsk-stray { color: #7B55C0; }
.s-basket .bsk-leaf  { fill: var(--olive); opacity: .5; }
.s-basket .bsk-leaf-b { opacity: .42; }
.s-basket .bsk-leaf-s { opacity: .3; }

/* the figs settle a hair, out of phase with each other */
.s-basket .bsk-fig {
  transform-box: fill-box; transform-origin: 50% 100%;
  animation: bskSettle 12.4s ease-in-out infinite alternate;
  animation-play-state: paused;
}
.s-basket .bsk-f1 { animation-delay: -0.7s }
.s-basket .bsk-f2 { animation-delay: -2.1s }
.s-basket .bsk-f3 { animation-delay: -3.6s }
.s-basket .bsk-f4 { animation-delay: -5.0s }
.s-basket .bsk-f5 { animation-delay: -6.4s }
.s-basket .bsk-f6 { animation-delay: -7.8s }
.s-basket .bsk-f7 { animation-delay: -9.2s }
@keyframes bskSettle { from { rotate: -1deg } to { rotate: 1deg } }

/* the thing among the fruit. The same olive as the leaves. No head. */
.s-basket .bsk-coil circle   { fill: none; stroke: var(--olive); stroke-linecap: round; }
.s-basket .bsk-coil rect     { fill: var(--olive); }
.s-basket .bsk-coil-b circle { stroke-width: 9.5; }
.s-basket .bsk-coil-f circle { stroke-width: 8.5; }
.s-basket .bsk-coil {
  opacity: .5;
  animation: bskPresence 17.3s ease-in-out infinite alternate;
  animation-play-state: paused;
}
.s-basket .bsk-coil-f { animation-delay: -2.4s }
@keyframes bskPresence { from { opacity: .36 } to { opacity: .7 } }

@media (orientation: landscape) {
  .s-basket .bsk-art    { height: 24% }
  .s-basket .bsk-window { height: 26% }
}

.page.live .s-basket .bsk-coil,
.page.live .s-basket .bsk-fig,
.page.live .s-basket .bsk-motes i { animation-play-state: running; }

html.no-motion .s-basket .bsk-coil    { animation: none; opacity: .54 }
html.no-motion .s-basket .bsk-fig     { animation: none; rotate: none }
html.no-motion .s-basket .bsk-motes i { animation: none; transform: none }


/* ───────────────────────────────────────────────────────────────────
   8 · .s-pharos — "The honest answer is: we don't know."
   Alexandria at dusk from the water. The fire is lit, the city is
   dark, 275 years end here. The fire is the one thing that moves.
   ─────────────────────────────────────────────────────────────────── */

.s-pharos {
  --stone:  #241B2E;
  --butter: #FFD36E;
}

.s-pharos .phr-sky {
  position: absolute; inset: 0;
  background: linear-gradient(180deg,
    #130E19 0%, #1B1620 15%, #2A1F38 30%, #43305C 44%,
    #6C4468 55%, #A6535C 63%, #DC6C4C 68%, #FF9A6E 70%, #FF9A6E 100%);
}
.s-pharos .phr-stars { position: absolute; inset: 0; }
.s-pharos .phr-stars i {
  position: absolute; width: .55vmin; aspect-ratio: 1; border-radius: 50%;
  background: #FFF7ED; opacity: .55;
}
.s-pharos .phr-hglow {
  position: absolute; inset: 0;
  background: radial-gradient(58% 22% at 54% 70%, rgba(255,180,130,.6), rgba(255,122,92,0) 72%);
}
.s-pharos .phr-sea {
  position: absolute; left: 0; right: 0; top: 70%; bottom: 0;
  background: linear-gradient(180deg,
    #2E6E74 0%, #235B63 18%, #17414E 48%, #0E2833 82%, #0B1D28 100%);
}
/* the water lying flat */
.s-pharos .phr-calm {
  position: absolute; left: 0; right: 0; top: 70%; bottom: 0;
  background: repeating-linear-gradient(180deg,
    rgba(220,240,240,.055) 0 .5%, rgba(220,240,240,0) .5% 5.5%);
}
.s-pharos .phr-searim {
  position: absolute; left: 0; right: 0; top: 69.7%; height: .5%;
  background: linear-gradient(90deg, rgba(255,200,150,0) 6%, rgba(255,214,170,.7) 40%,
                                      rgba(255,238,205,.9) 56%, rgba(255,200,150,0) 92%);
}

/* the city, dark, edge to edge */
.s-pharos .phr-city {
  position: absolute; left: 0; right: 0; bottom: 30%; height: 5.4%;
}
.s-pharos .phr-city svg { width: 100%; height: 100%; display: block; }
.s-pharos .phr-blocks rect,
.s-pharos .phr-blocks path { fill: #1E1727; }
.s-pharos .phr-lights rect { fill: var(--butter); opacity: .36; }

.s-pharos .phr-boat {
  position: absolute; height: 2.6%; aspect-ratio: 1.57;
  transform: translateX(-50%);
}
.s-pharos .phr-boat svg { width: 100%; height: 100%; display: block; }
.s-pharos .phr-boat path,
.s-pharos .phr-boat rect { fill: #16101E; opacity: .8; }
.s-pharos .phr-boat-a { left: 70%; bottom: 27.8%; height: 2.1%; opacity: .9 }
.s-pharos .phr-boat-b { left: 13%; bottom: 26.6%; height: 3% }

/* the light on the water */
.s-pharos .phr-wake {
  position: absolute; left: 27%; bottom: 1%;
  width: 46%; height: 29%;
  transform: translateX(-50%);
}
.s-pharos .phr-wake svg { width: 100%; height: 100%; display: block; }
.s-pharos .phr-streaks rect { fill: #FFDCA6; }
.s-pharos .phr-streaks {
  opacity: .5;
  transform-box: fill-box; transform-origin: 50% 50%;
  animation: phrWake 26s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes phrWake {
  from { transform: translateY(-1.4%); opacity: .38 }
  to   { transform: translateY(2.4%);  opacity: .62 }
}

/* the fire's reach into the dusk */
.s-pharos .phr-halo {
  position: absolute; left: 27%; bottom: 68.5%;
  width: 30vmin; aspect-ratio: 1;
  transform: translate(-50%, 50%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,211,110,.34) 0%, rgba(255,154,92,.14) 40%, rgba(255,122,92,0) 70%);
  animation: phrHalo 7.9s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes phrHalo {
  from { opacity: .72; transform: translate(-50%,50%) scale(.94) }
  to   { opacity: 1;   transform: translate(-50%,50%) scale(1.06) }
}

.s-pharos .phr-tower {
  position: absolute; left: 27%; bottom: 30%;
  height: 40%; aspect-ratio: .2308;
  transform: translateX(-50%);
}
.s-pharos .phr-tower svg { width: 100%; height: 100%; display: block; overflow: visible; }
.s-pharos .phr-stone path,
.s-pharos .phr-stone rect { fill: var(--stone); }
.s-pharos .phr-lit path,
.s-pharos .phr-lit rect { fill: #6B4457; opacity: .85; }
.s-pharos .phr-win rect { fill: var(--butter); opacity: .3; }

.s-pharos .phr-flame-o { fill: #FF9A5C; opacity: .85; }
.s-pharos .phr-flame-i { fill: var(--butter); }
.s-pharos .phr-fire {
  transform-box: fill-box; transform-origin: 50% 92%;
  animation: phrGutter 5.4s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes phrGutter {
  from { transform: scale(.93, .88) translateX(-1.5%) }
  46%  { transform: scale(1.02, 1.06) translateX(1%) }
  to   { transform: scale(.97, 1.14) translateX(-.5%) }
}
.s-pharos .phr-glow {
  animation: phrCore 6.7s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes phrCore { from { opacity: .8 } to { opacity: 1 } }

.page.live .s-pharos .phr-fire,
.page.live .s-pharos .phr-glow,
.page.live .s-pharos .phr-halo,
.page.live .s-pharos .phr-streaks { animation-play-state: running; }

html.no-motion .s-pharos .phr-fire    { animation: none; transform: none }
html.no-motion .s-pharos .phr-glow    { animation: none; opacity: .92 }
html.no-motion .s-pharos .phr-halo    { animation: none; opacity: .9; transform: translate(-50%,50%) }
html.no-motion .s-pharos .phr-streaks { animation: none; transform: none; opacity: .5 }

/* ═══════════════════════════════════════════════════════════════════
   SCENES C — harbour · letter · search   (beats 3, 6 and 8)

   Same grammar as A and B. Composed at 390×844 first, checked at
   1440×800. The shell's scrim plateaus between 34% and 58%, so that
   band carries no detail in any of the three: a plank field, a bare
   table, a bare wall. The bottom 12% is treated as sacrificial —
   Instagram's toolbar sits on it — so nothing that means anything
   lives below 88%.

   Every selector is scoped under its .s-NAME and every class carries
   a scene prefix (hrb- / ltr- / srh-), so nothing here can reach a
   scene it does not own. Sizes in % / vmin / em only; the one place
   raw numbers appear is inside an SVG's own user-unit space.
   ═══════════════════════════════════════════════════════════════════ */


/* ───────────────────────────────────────────────────────────────────
   1 · .s-harbour — "Then Rome reaches Alexandria."

   Six planes, each one lighter and hazier than the one in front:

     0–29%   sky, the Pharos, the city, the quay and the crowd on it
     29–36%  the fleet standing in at the harbour mouth
     36–56%  open water — the caption's ground, and nothing else
     44–63%  four liburnians in the near water, oars out
     57–86%  the deck we are standing on, the legion along its rail
     84–100% the sea alongside, mostly under the webview toolbar

   Alexandria in 30 BCE: white limestone on a grid, a colonnaded
   street, the Caesareum with its pair of obelisks, the palaces of
   the Brucheion on Cape Lochias — where she is barricaded — and the
   lighthouse at the harbour mouth in its three stages, square then
   octagonal then round. The Heptastadion runs out to it on the left.
   Daylight and from the water, so it does not repeat s-pharos.

   Everything that spreads across the frame — the crowd, the rank of
   legionaries, the shields — is a flex row of height-sized items, so
   the figures stay the same size on a phone and on a desktop and the
   line simply runs further on the wider one.
   ─────────────────────────────────────────────────────────────────── */

.s-harbour {
  --ink:      62, 47, 74;
  --butter:   255, 211, 110;
  --butter-s: 255, 230, 174;
  --crimson:  #A81F38;
  background: #2E7C7C;
}

.s-harbour .hrb-sky {
  position: absolute; left: 0; right: 0; top: 0; height: 30%;
  background: linear-gradient(to bottom,
    #6AA6B4 0%, #90BEC4 26%, #B8D3CF 52%, #DCDDCC 76%, #F3E8D0 92%, #FBF2DE 100%);
}
/* Sun high and behind us on the left; what we see is the glare it
   puts on the haze and on the water. */
.s-harbour .hrb-sun {
  position: absolute; left: -16%; top: -6%; width: 70%; height: 36%;
  background: radial-gradient(56% 74% at 36% 86%,
    rgba(255, 250, 240, .72) 0%,
    rgba(var(--butter-s), .30) 44%,
    rgba(var(--butter), 0) 76%);
  filter: blur(1.6vmin);
  animation: hrbSun 21s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes hrbSun { 0% { opacity: .8 } 100% { opacity: 1 } }

/* ── the Pharos ── */
.s-harbour .hrb-pharos {
  position: absolute; left: 2%; top: 2.5%;
  height: 25.5%; aspect-ratio: .42;
  opacity: .93;
}
