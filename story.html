.s-harbour .hrb-pharos svg { width: 100%; height: 100%; display: block; }
.s-harbour .hrb-ph-stone { fill: #F2EADA; }
.s-harbour .hrb-ph-shade { fill: #C9BCA8; }
.s-harbour .hrb-ph-win   { fill: rgba(var(--ink), .34); }

.s-harbour .hrb-hepta {
  position: absolute; left: 0; width: 30%; top: 26.6%; height: 1.5%;
  background: linear-gradient(to bottom, #E4DAC4, #B6A78C);
  opacity: .85;
}

/* ── the city ── */
.s-harbour .hrb-city-back {
  position: absolute; left: -1%; right: -1%; bottom: 72.6%; height: 13.5%;
  opacity: .88;
}
.s-harbour .hrb-city-back svg { width: 100%; height: 100%; display: block; }
.s-harbour .hrb-cb  { fill: #DCD7D6; }
.s-harbour .hrb-cb2 { fill: #C0B8BB; }

.s-harbour .hrb-city svg { width: 100%; height: 100%; display: block; }
.s-harbour .hrb-ct  { fill: #F6F1E6; }
.s-harbour .hrb-col { fill: #CFC5B4; }
.s-harbour .hrb-ped { fill: #FCF7EC; }
.s-harbour .hrb-obe { fill: #DCC79E; }

/* Height-led, like the Pharos and like everything afloat, so the far
   shore keeps one scale. They used to be `min(46%, 40vh)` wide, which
   on a short wide window put the temples nearly level with a
   lighthouse they should be dwarfed by. */
.s-harbour .hrb-city-a { position: absolute; left: 1%;   bottom: 73.6%; height:  8.8%; aspect-ratio: 2.42; opacity: .9; }
.s-harbour .hrb-city-b { position: absolute; left: 41%;  bottom: 73.6%; height: 11.4%; aspect-ratio: 1.22; opacity: .95; }
.s-harbour .hrb-city-c { position: absolute; right: -2%; bottom: 73.6%; height: 10.8%; aspect-ratio: 1.97; }

/* A wash over the whole far shore. Distance is the point. */
.s-harbour .hrb-quay {

/* ── the fleet. Two ranks of the same silhouette, sized off their own

.s-harbour .hrb-fleet { position: absolute; inset: 0; }
.s-harbour .hrb-fleet i { position: absolute; aspect-ratio: 1.72; }
.s-harbour .hrb-fleet svg { width: 100%; height: 100%; display: block; }
.s-harbour .hrb-d-hull { fill: currentColor; }

.s-harbour .hrb-fa { color: #7E9BA2; --hrb-sail: rgba(168, 31, 56, .40); opacity: .48; }
.s-harbour .hrb-fa i { height: 2.1%; }

.s-harbour .hrb-fa i:nth-child( 2) { left: 10.0%; top: 30.6%; height: 1.8%; }

.s-harbour .hrb-fa i:nth-child( 4) { left: 26.0%; top: 31.0%; height: 2.4%; }
.s-harbour .hrb-fa i:nth-child( 5) { left: 35.0%; top: 29.6%; height: 1.8%; }
.s-harbour .hrb-fa i:nth-child( 6) { left: 43.0%; top: 30.8%; height: 2.1%; }
.s-harbour .hrb-fa i:nth-child( 7) { left: 51.0%; top: 29.3%; height: 1.7%; }
.s-harbour .hrb-fa i:nth-child( 8) { left: 59.0%; top: 31.2%; height: 2.4%; }

.s-harbour .hrb-fa i:nth-child(10) { left: 76.0%; top: 30.7%; height: 1.8%; }
.s-harbour .hrb-fa i:nth-child(11) { left: 84.0%; top: 29.4%; height: 2.1%; }
.s-harbour .hrb-fa i:nth-child(12) { left: 92.0%; top: 31.0%; height: 2.2%; }

.s-harbour .hrb-fb { color: #48707B; --hrb-sail: rgba(168, 31, 56, .62); opacity: .74; }
.s-harbour .hrb-fb i { height: 3.1%; }
.s-harbour .hrb-fb i:nth-child(1) { left:  3.0%; top: 31.8%; height: 3.1%; }
.s-harbour .hrb-fb i:nth-child(2) { left: 16.0%; top: 33.0%; height: 3.5%; }
.s-harbour .hrb-fb i:nth-child(3) { left: 29.0%; top: 31.9%; height: 2.8%; }

/* The band of glare across the middle of the water. This is what

.s-harbour .hrb-glare {

/* ── the liburnians. Low, oared, ram at the waterline, curved stern,
      red sail brailed to the yard, shields on the rail, men on deck.
      Each rides its own swell so the line never marches. ── */
.s-harbour .hrb-lib {

  transform-origin: 50% 92%;
  animation: hrbSwell 12.6s ease-in-out infinite alternate;
  animation-play-state: paused;

.s-harbour .hrb-l-post   { fill: #4A3B5C; }

.s-harbour .hrb-lib.l3 { left: 71%;  top: 49%;   height: 11.5%; z-index: 2; opacity: .84; filter: saturate(.78) brightness(1.08); animation-duration: 14.8s; animation-delay: -9s; }

                         filter: drop-shadow(0 .8vmin 1.4vmin rgba(8, 34, 40, .34)); }

/* ── the deck we are standing on ── */
.s-harbour .hrb-bob {
  position: absolute; inset: 0; z-index: 6;
  transform-origin: 50% 96%;
  animation: hrbDeck 15.4s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes hrbDeck {
  0%   { transform: translateY(-.34%) rotate(-.16deg); }
  100% { transform: translateY(.34%)  rotate(.16deg); }

/* The vexillum on its pole, carried in the rank. Rome, said out loud. */
.s-harbour .hrb-pole {
  position: absolute; left: 91%; top: 53.5%; height: 16.1%;

/* The rank along the rail. Each man is sized off his own height and
   overlaps his neighbour by a height-led amount too (it was -.6vmin,
   which made the shields overlap twice as far on a landscape window
   as on a phone), so the rank is the same rank at every size — just
   more of it. There are a hundred and four of them because a 2.5:1
   window needs about ninety-six to reach past both edges; the extras
   are clipped, and cost four static boxes each. Each is a helmet, a crest and a
   scutum, which at this size is the whole of a legionary; the shields
   overlap into one line, which is what a boarding party looks like.
   The red and the gold of the fleet are carried here. */
.s-harbour .hrb-troop {
  position: absolute; left: -5%; right: -5%; top: 62.4%; height: 7.2%;
  display: flex; align-items: flex-end;
}
.s-harbour .hrb-troop i {
  position: relative; flex: 0 0 auto; height: 100%; aspect-ratio: .46;
}
.s-harbour .hrb-troop i + i { margin-left: -.28vh; }
/* A pilum standing up behind every fourth man. Painted straight onto
   the flex item, so it costs no element. */
.s-harbour .hrb-troop i:nth-child(4n+2) {
  background: linear-gradient(#6E5836, #6E5836) no-repeat 84% 2% / 5% 58%;
}
.s-harbour .hrb-troop i:nth-child(7n+3) {
  background: linear-gradient(#6E5836, #6E5836) no-repeat 14% 6% / 5% 54%;
}
/* Shoulders and neck. The head is no longer part of this shape — it
   used to be one polygon from crown to hem, which is why the rank read
   as a row of bottles. */
.s-harbour .hrb-troop i::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(100deg, #1B1425 0%, #33273D 62%, #150F1E 100%);
  clip-path: polygon(37% 15%, 63% 15%, 65% 31%, 96% 45%, 96% 100%, 4% 100%, 4% 45%, 35% 31%);
}
/* the scutum, dropped a little so the man above it has a neck */
.s-harbour .hrb-troop i::after {
  content: ''; position: absolute; left: 3%; top: 47%; width: 84%; height: 53%;
  border-radius: 26% 26% 22% 22% / 15% 15% 13% 13%;
  background:
    radial-gradient(circle at 50% 46%, rgba(240, 208, 130, .9) 0 9%, rgba(240, 208, 130, 0) 10%),
    linear-gradient(102deg, #A02A40 0%, #8A1B31 56%, #5E0F1F 100%);
  box-shadow: .3vmin .3vmin .9vmin rgba(9, 22, 26, .44);
}
/* THE HEAD. A bronze helmet with a bowl, a face under it and two eyes
   in the face — which is the difference between a man and a bottle.
   Four boxes an infantryman, all of them static paint: the rank has no
   animation of its own and never had. */
.s-harbour .hrb-troop b {
  position: absolute; left: 29%; right: 29%; top: 0; height: 23%;
  border-radius: 52% 52% 38% 38% / 58% 58% 42% 42%;
  background: linear-gradient(104deg, #46391F 0%, #7B6737 52%, #382E17 100%);
}
/* the crest, over the bowl */
.s-harbour .hrb-troop b::before {
  content: ''; position: absolute; left: 26%; right: 26%; top: -36%; height: 44%;
  border-radius: 50% 50% 0 0;
  background: rgba(158, 38, 62, .95);
}
/* the face under the brim, with the eyes in it */
.s-harbour .hrb-troop b::after {
  content: ''; position: absolute; left: 21%; right: 21%; top: 47%; bottom: 5%;
  border-radius: 20% 20% 46% 46%;
  background:
    radial-gradient(circle at 32% 34%, #1A1220 0 13%, rgba(26, 18, 32, 0) 14%),
    radial-gradient(circle at 68% 34%, #1A1220 0 13%, rgba(26, 18, 32, 0) 14%),
    linear-gradient(100deg, #A47B5B 0%, #8A6547 100%);
}
/* Nobody in a rank faces exactly the same way. The head shifts, the
   face inside the helmet shifts with it, and some of them have lost
   the crest off the helmet altogether. */
.s-harbour .hrb-troop i:nth-child(3n) b::before { background: rgba(150, 112, 24, .9); }
.s-harbour .hrb-troop i:nth-child(5n) b::before { display: none; }
.s-harbour .hrb-troop i:nth-child(2n) b        { left: 24%; right: 30%; }
.s-harbour .hrb-troop i:nth-child(2n) b::after { left: 14%; right: 28%; }
.s-harbour .hrb-troop i:nth-child(3n+1) b        { left: 30%; right: 24%; }
.s-harbour .hrb-troop i:nth-child(3n+1) b::after { left: 28%; right: 14%; }
.s-harbour .hrb-troop i:nth-child(7n) b        { top: 3%; height: 21%; }
.s-harbour .hrb-troop i:nth-child(4n)  { height: 95%; }
.s-harbour .hrb-troop i:nth-child(7n)  { height: 91%; }
.s-harbour .hrb-troop i:nth-child(9n)  { height: 98%; }
.s-harbour .hrb-troop i:nth-child(11n) { height: 88%; }
.s-harbour .hrb-troop i:nth-child(6n)::after {
  background:
    radial-gradient(circle at 50% 46%, rgba(240, 208, 130, .8) 0 9%, rgba(240, 208, 130, 0) 10%),
    linear-gradient(102deg, #7C5A14 0%, #63470A 56%, #3E2C04 100%);
}

/* The hull. It runs off both edges on purpose — we are on it. */
.s-harbour .hrb-hull {
  position: absolute; left: -12%; right: -6%; top: 69.4%; height: 17%;
}
.s-harbour .hrb-hull svg { width: 100%; height: 100%; display: block; }

.s-harbour .hrb-cap     { fill: #7E688A; }

.s-harbour .hrb-sheer   { fill: #5B4867; }

.s-harbour .hrb-plank path {

}

.s-harbour .hrb-portring ellipse { fill: #6E5C7C; }
.s-harbour .hrb-port ellipse     { fill: #0B0712; }
.s-harbour .hrb-tar { fill: rgba(9, 6, 14, .18); }

/* ── the sea alongside ── */
.s-harbour .hrb-nearsea {
  position: absolute; left: 0; right: 0; top: 86%; bottom: 0; z-index: 7;
  background: linear-gradient(to bottom,
    #16605E 0%, #114C4E 34%, #0C383B 74%, #08272B 100%);
}
.s-harbour .hrb-reflect {

  filter: blur(1vmin);
}
.s-harbour .hrb-ripple {
  position: absolute; border-radius: 50%; z-index: 8;
  background: linear-gradient(to bottom,
    rgba(214, 240, 236, .16), rgba(214, 240, 236, .02));
  filter: blur(.6vmin);
}
.s-harbour .hrb-ripple.r1 { left: -6%; right: -6%; top: 91%;   height: 1.8%; }
.s-harbour .hrb-ripple.r2 { left: -6%; right: -6%; top: 96%;   height: 2.2%; }

/* Oars out of the ports, blades just in. The lefts are percentages
   of the scene and so is the hull box, so they stay together. */
.s-harbour .hrb-oars { position: absolute; inset: 0; z-index: 9; }
.s-harbour .hrb-oars i {
  position: absolute;
  width: 1.66vh; height: 10.5%;
  margin-left: -.83vh;
  transform-origin: 50% 0%;
  transform: rotate(19deg);
  clip-path: polygon(40% 0%, 60% 0%, 62% 60%, 96% 74%, 84% 100%, 16% 100%, 38% 74%);
  background: linear-gradient(to bottom,
    #8B7462 0%, #6E5A55 40%, #4A3C46 70%, rgba(22, 78, 78, .7) 92%, rgba(22, 78, 78, .24) 100%);
}
.s-harbour .hrb-oars i:nth-child(1) { left: -1.4%; top: 78.5%; }
.s-harbour .hrb-oars i:nth-child(2) { left: 17.5%; top: 78.7%; }
.s-harbour .hrb-oars i:nth-child(3) { left: 36.4%; top: 78.8%; }
.s-harbour .hrb-oars i:nth-child(4) { left: 55.3%; top: 78.8%; }
.s-harbour .hrb-oars i:nth-child(5) { left: 74.2%; top: 78.7%; }
.s-harbour .hrb-oars i:nth-child(6) { left: 93.0%; top: 78.5%; }

.s-harbour .hrb-wash {
  position: absolute; left: -4%; right: -4%; top: 84.2%; height: 4%; z-index: 10;
  border-radius: 50%;
  background: radial-gradient(50% 76% at 50% 44%,
    rgba(214, 240, 236, .5) 0%, rgba(214, 240, 236, .18) 46%, rgba(214, 240, 236, 0) 78%);
  filter: blur(1.1vmin);
}

.s-harbour .hrb-vig {
  position: absolute; inset: 0; z-index: 11;
  background:
    linear-gradient(to bottom, rgba(14, 34, 48, .34) 0%, rgba(14, 34, 48, 0) 18%),
    radial-gradient(98% 78% at 50% 50%,
      rgba(18, 24, 34, 0) 44%, rgba(18, 24, 34, .26) 86%, rgba(18, 24, 34, .44) 100%);
}

.page.live .s-harbour .hrb-sun,
.page.live .s-harbour .hrb-lib,
.page.live .s-harbour .hrb-bob,
.page.live .s-harbour .hrb-vex,
.page.live .s-harbour .hrb-glints i { animation-play-state: running; }


/* ───────────────────────────────────────────────────────────────────
   2 · .s-letter — "Then she writes to Octavian."

   She is at the table with the stylus still in her hand and five
   lines on the sheet, the fifth stopped short of the margin with a
   blot at the end of it. One lamp on her right does all the
   lighting, so her right edge carries the rim and her shadow goes up
   and to the left — which is where the door is.

   The interruption is two motions at once: a cold seam widening on
   the left as a door does (24s), and a soft shadow crossing it
   (19s). Neither is fast. Warm, and then wrong.

   Vertical grammar: room 0–42%, table 42–100%, her head 20–36%,
   sheet 63–88%. What the caption crosses is her shoulder and a bare
   plane of table — dark, flat, quiet.

   Everything on the table lives inside .ltr-stage, and the stage is
   ASPECT-LOCKED: full scene height, width derived from that height at
   9/20. It used to be `min(100%, 84vh)` wide against a full-height
   box, which is not a lock at all — the box changed shape with the
   window while the objects in it stayed height-led, so at 1280×620
   her stylus floated a hand's width to the left of the sheet and the
   wax and the lamp had slid off their marks. Now the stage box is the
   same shape at every size and every object is a fraction of it, so
   the tip of the stylus lands on the same word of the same line
   whatever the window does. 9/20 rather than the 390/844 of the
   reference phone so that the box is still full height on a 360×800
   or 412×915 handset — anything narrower simply loses a little off
   both edges instead of squashing the picture.
   ─────────────────────────────────────────────────────────────────── */

.s-letter {
  --ink:      62, 47, 74;
  --butter:   255, 211, 110;
  --butter-s: 255, 230, 174;
  --cold:     206, 222, 232;
  --lilac:    183, 156, 237;
  background: #17101A;
}

.s-letter .ltr-room {
  position: absolute; inset: 0;
  background:
    radial-gradient(80% 54% at 80% 62%, rgba(var(--butter), .20), rgba(var(--butter), 0) 74%),
    linear-gradient(to bottom, #241823 0%, #1A1219 54%, #120C15 100%);
}
.s-letter .ltr-back {
  position: absolute; left: 0; right: 0; top: 0; height: 44%;
  background: linear-gradient(to bottom, #110C15 0%, #1C141D 52%, #33232A 100%);
}

.s-letter .ltr-stage {
  position: absolute; left: 50%; top: 0; height: 100%;
  aspect-ratio: 9 / 20;
  transform: translateX(-50%);
}

/* Her shadow, thrown away from the lamp: up the wall and to the
   left, which is the only place it could go. */
.s-letter .ltr-cast {
  position: absolute; left: -26%; top: 0; width: 64%; height: 46%;
  background: radial-gradient(46% 52% at 64% 76%,
    rgba(6, 4, 8, .8) 0%, rgba(6, 4, 8, .34) 52%, rgba(6, 4, 8, 0) 82%);
  filter: blur(3vmin);
}

.s-letter .ltr-table {
  position: absolute; left: -50vw; right: -50vw; top: 42%; bottom: 0;
  background: linear-gradient(to bottom,
    #6A4830 0%, #8B6242 6%, #9A6E4A 18%, #8A6240 44%, #6E4C2C 74%, #46301F 92%, #2C1F17 100%);
}
.s-letter .ltr-grain {
  position: absolute; left: -50vw; right: -50vw; top: 42%; bottom: 0;
  background: repeating-linear-gradient(93deg,
    rgba(255, 233, 188, 0)    0 2.6%,
    rgba(255, 233, 188, .03)  2.6% 3.2%,
    rgba(46, 30, 20, .04)     3.2% 3.8%);
}
.s-letter .ltr-edge {
  position: absolute; left: -50vw; right: -50vw; top: 41.6%; height: .5%;
  background: linear-gradient(to bottom, rgba(var(--butter-s), .38), rgba(var(--butter), .05));
}

/* ── her ── */
.s-letter .ltr-her,
.s-letter .ltr-arm {
  position: absolute; left: -6%; top: 11%;
  height: 60%; aspect-ratio: .714;
}
.s-letter .ltr-her svg,
.s-letter .ltr-arm svg { width: 100%; height: 100%; display: block; }
.s-letter .ltr-body   { fill: #2A2136; }
.s-letter .ltr-sleeve { fill: #2E2439; }
.s-letter .ltr-hair   { fill: #291D33; }
.s-letter .ltr-head   { fill: #6B5059; }
.s-letter .ltr-neck   { fill: #55404A; }
.s-letter .ltr-hand   { fill: #6A4E56; }
/* Her face. Flat idiom, as everywhere: an ink ellipse for the eye, one
   lid line, one lip line. She is lit from the lamp on her right, so the
   only bright thing on her is the edge the lamp actually reaches —
   forehead, nose, lip — and everything else stays in the dark. */
.s-letter .ltr-eye    { fill: #221829; }
.s-letter .ltr-ear    { fill: none; stroke: #4A363E; stroke-width: 1.5;
                        stroke-linecap: round; }
.s-letter .ltr-lid    { fill: none; stroke: #221829; stroke-width: 1.7;
                        stroke-linecap: round; }
.s-letter .ltr-lip    { fill: none; stroke: #221829; stroke-width: 1.5;
                        stroke-linecap: round; opacity: .85; }
.s-letter .ltr-rim2   { fill: rgba(255, 211, 110, .30); }
.s-letter .ltr-grip path { fill: none; stroke: #4C363E; stroke-width: 1.3;
                        stroke-linecap: round; }
.s-letter .ltr-diadem { fill: rgba(255, 211, 110, .78); }
.s-letter .ltr-rim    { fill: rgba(255, 211, 110, .34); }
.s-letter .ltr-pen    { fill: #8E7A63; }
.s-letter .ltr-nib    { fill: #241B2E; }
.s-letter .ltr-fold path {
  fill: none; stroke: rgba(255, 211, 110, .10); stroke-width: 2;
  vector-effect: non-scaling-stroke;
}

/* ── the sheet ── */
.s-letter .ltr-shadow {
  position: absolute; right: 0; bottom: 10.6%;
  width: 88%; height: 5%;
  border-radius: 50%;
  background: radial-gradient(58% 100% at 50% 50%, rgba(0, 0, 0, .5), rgba(0, 0, 0, 0) 74%);
  filter: blur(1.2vmin);
}
.s-letter .ltr-sheet {
  position: absolute; right: 2%; bottom: 12%;
  height: 25%; aspect-ratio: 1.55; max-width: 96%;
  transform: rotate(-3.2deg);
}
.s-letter .ltr-sheet svg { width: 100%; height: 100%; display: block; }
.s-letter .ltr-page  { fill: #F5E6C9; }
.s-letter .ltr-curl  { fill: #DCC69E; }
.s-letter .ltr-fibre path { fill: none; stroke: #9A6B00; stroke-width: .9; opacity: .07; }
.s-letter .ltr-ink rect { fill: #4A3550; opacity: .82; }
.s-letter .ltr-half     { opacity: .48; }
.s-letter .ltr-blot     { fill: #4A3550; opacity: .58; }
.s-letter .ltr-blot-s   { opacity: .4; }

/* ── wax, the ring, the lamp ── */
.s-letter .ltr-wax {
  position: absolute; left: 64%; top: 55.4%;
  height: 3.6%; aspect-ratio: 2.5;
}
.s-letter .ltr-pool {
  position: absolute; left: 0; bottom: 0; width: 54%; height: 34%;
  border-radius: 54% 42% 60% 46% / 66% 58% 46% 52%;
  background: radial-gradient(60% 70% at 40% 30%, #B62F46, #741224);
  box-shadow: 0 .3vmin .8vmin rgba(0, 0, 0, .45);
}
.s-letter .ltr-stick {
  position: absolute; right: 0; top: 6%; width: 62%; height: 26%;
  border-radius: 1vmin; transform: rotate(-10deg);
  background: linear-gradient(to bottom, #C33A50 0%, #A81F38 50%, #6F1226 100%);
}
.s-letter .ltr-stick-t {
  position: absolute; right: 1%; top: 9%; width: 15%; height: 20%;
  border-radius: 1vmin; transform: rotate(-10deg);
  background: rgba(255, 179, 193, .40);
}
.s-letter .ltr-lamp {
  position: absolute; right: 1%; top: 53.4%;
  height: 6.2%; aspect-ratio: 1.85;
}
.s-letter .ltr-lamp-b {
  position: absolute; left: 0; right: 22%; bottom: 0; height: 62%;
  border-radius: 46% 46% 50% 50% / 34% 34% 100% 100%;
  background: linear-gradient(to bottom, #D2A337 0%, #A87615 48%, #6E4C0A 100%);
  box-shadow: 0 .5vmin 1.4vmin rgba(0, 0, 0, .55);
}
.s-letter .ltr-lamp-r {
  position: absolute; left: -2%; right: 20%; bottom: 52%; height: 22%;
  border-radius: 50%;
  background: linear-gradient(to bottom, #E9CA79, #A87615);
}
.s-letter .ltr-lamp-s {
  position: absolute; right: 4%; bottom: 28%; width: 34%; height: 30%;
  clip-path: polygon(0% 0%, 100% 30%, 100% 72%, 0% 100%);
  background: linear-gradient(to right, #B8851C, #E0B44A);
}
.s-letter .ltr-flame {
  position: absolute; right: 1%; bottom: 54%;
  width: 2.6vmin; height: 5.6vmin;
  border-radius: 50% 50% 46% 46% / 78% 78% 100% 100%;
  background: linear-gradient(to top,
    rgba(255, 122, 92, .92), rgba(255, 211, 110, .96) 50%, rgba(255, 250, 240, .92));
  filter: blur(.4vmin);
  transform-origin: 50% 100%;
  animation: ltrFlame 4.2s ease-in-out infinite alternate;
  animation-play-state: paused;
}
.s-letter .ltr-flame-i {
  position: absolute; right: 2.4%; bottom: 56%;
  width: 1.1vmin; height: 2.6vmin;
  border-radius: 50% 50% 46% 46% / 74% 74% 100% 100%;
  background: rgba(255, 253, 246, .95);
  filter: blur(.22vmin);
  transform-origin: 50% 100%;
  animation: ltrFlame 4.2s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes ltrFlame {
  0%   { transform: scale(.9, .92)    translateX(-.2vmin); opacity: .88; }
  100% { transform: scale(1.05, 1.08) translateX(.2vmin);  opacity: 1; }
}
.s-letter .ltr-halo {
  position: absolute; left: -190%; right: -190%; top: -300%; bottom: -190%;
  border-radius: 50%;
  background: radial-gradient(50% 50% at 62% 40%,
    rgba(var(--butter-s), .40) 0%, rgba(var(--butter), .12) 44%, rgba(var(--butter), 0) 74%);
  filter: blur(1.2vmin);
}

/* Everything the scene knows comes from that lamp; this is the light
   it puts on the table, laid over the objects rather than under
   them. It is the last child of the stage, not a sibling of it, so
   the pool of light cannot walk away from the lamp that casts it.
   The box is three stage-widths wide and centred on the stage, and
   the two gradients are placed at a third of their old coordinates
   plus a third — which is the same light in the same place on the
   390×844 frame, with room to die out over a wider table. */
.s-letter .ltr-warm {
  position: absolute; left: -100%; right: -100%; top: 0; bottom: 0;
  mix-blend-mode: screen;
  background:
    radial-gradient(11.33% 22% at 59.33% 58%, rgba(var(--butter-s), .40), rgba(var(--butter), 0) 78%),
    radial-gradient(23.33% 36% at 54.00% 74%, rgba(var(--butter), .22), rgba(var(--butter), 0) 82%);
  animation: ltrWarm 17s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes ltrWarm { 0% { opacity: .84 } 100% { opacity: 1 } }

/* ── the interruption ── */
.s-letter .ltr-open {
  position: absolute; inset: 0;
  transform-origin: 0% 50%;
  mix-blend-mode: screen;
  animation: ltrOpen 24s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes ltrOpen {
  0%,  14% { transform: scaleX(.10); opacity: .38; }
  100%     { transform: scaleX(1);   opacity: .92; }
}
.s-letter .ltr-wedge {
  position: absolute; left: -4%; top: -6%; width: 54%; height: 112%;
  clip-path: polygon(0% 0%, 30% 0%, 100% 100%, 0% 100%);
  background: linear-gradient(100deg,
    rgba(var(--cold), .74) 0%,
    rgba(var(--cold), .30) 28%,
    rgba(var(--lilac), .13) 56%,
    rgba(79, 195, 184, .04) 80%,
    rgba(79, 195, 184, 0) 100%);
  filter: blur(1.6vmin);
}
/* The gap itself, kept out of .ltr-open so the scaling that widens
   the wedge cannot squeeze the seam out of existence — it has to
   read as a hairline of daylight even at the shut end of the cycle. */
.s-letter .ltr-seam {
  position: absolute; left: -.6%; top: -8%; bottom: -8%;
  width: 2vmin; border-radius: 2vmin;
  transform-origin: 0% 50%;
  mix-blend-mode: screen;
  background: linear-gradient(to bottom,
    rgba(var(--cold), .42) 0%,
    rgba(242, 249, 253, .96) 34%,
    rgba(242, 249, 253, .88) 68%,
    rgba(var(--cold), .46) 100%);
  filter: blur(.5vmin);
  box-shadow: 0 0 3vmin rgba(var(--cold), .5);
  animation: ltrSeam 24s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes ltrSeam {
  0%   { transform: scaleX(.5);  opacity: .62; }
  100% { transform: scaleX(2.6); opacity: 1; }
}
/* The guards reaching the door. Soft, unresolved, and it only ever
   crosses the cold. */
.s-letter .ltr-figure {
  position: absolute; left: 0; top: -12%; width: 21%; height: 124%;
  background: linear-gradient(to right,
    rgba(10, 7, 13, 0) 0%,
    rgba(10, 7, 13, .82) 34%,
    rgba(10, 7, 13, .78) 66%,
    rgba(10, 7, 13, 0) 100%);
  filter: blur(2.4vmin);
  opacity: 0;
  animation: ltrPass 19s ease-in-out infinite;
  animation-play-state: paused;
}
@keyframes ltrPass {
  0%,  56% { transform: translateX(-52%); opacity: 0; }
  70%      { opacity: .9; }
  86%      { opacity: .74; }
  100%     { transform: translateX(112%); opacity: 0; }
}
.s-letter .ltr-chill {
  position: absolute; inset: 0;
  background: linear-gradient(104deg,
    rgba(79, 195, 184, .24) 0%,
    rgba(var(--lilac), .12) 30%,
    rgba(var(--lilac), .03) 48%,
    rgba(var(--lilac), 0) 62%);
  animation: ltrChill 24s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes ltrChill { 0% { opacity: .14 } 100% { opacity: 1 } }

.s-letter .ltr-vig {
  position: absolute; inset: 0;
  background:
    linear-gradient(to bottom, rgba(12, 8, 14, .48) 0%, rgba(12, 8, 14, 0) 16%),
    radial-gradient(94% 72% at 62% 58%,
      rgba(12, 8, 14, 0) 36%, rgba(12, 8, 14, .32) 82%, rgba(12, 8, 14, .58) 100%);
}

.page.live .s-letter .ltr-warm,
.page.live .s-letter .ltr-flame,
.page.live .s-letter .ltr-flame-i,
.page.live .s-letter .ltr-open,
.page.live .s-letter .ltr-seam,
.page.live .s-letter .ltr-figure,
.page.live .s-letter .ltr-chill { animation-play-state: running; }


/* ───────────────────────────────────────────────────────────────────
   3 · .s-search — "Nobody has ever established it."

   The room after. Wall to 62%, floor below it, the door open on the
   right onto a flat pale nothing. Everything that was searched lies
   between 64% and 88%: the cloth off the couch, three cushions, a
   bowl over, the basket on its side with the figs out of it. The
   middle third is bare wall, which is also the argument — there is
   nothing in this room and there never was.

   Cool, high-key, a stop over-exposed. The only motion is the end of
   the cloth nobody caught.
   ─────────────────────────────────────────────────────────────────── */

.s-search {
  --ink:   62, 47, 74;
  --lilac: 183, 156, 237;
  background: #D6CEE0;
}

.s-search .srh-wall {
  position: absolute; left: 0; right: 0; top: 0; bottom: 38%;
  background:
    linear-gradient(96deg,
      rgba(var(--lilac), .22) 0%,
      rgba(var(--lilac), .03) 38%,
      rgba(var(--lilac), 0) 66%,
      rgba(var(--lilac), .12) 100%),
    linear-gradient(to bottom,
      #E7E1EE 0%, #F4F0F6 24%, #F7F3F7 50%, #EFEAF2 78%, #E3DCEA 100%);
}
.s-search .srh-courses {
  position: absolute; left: 0; right: 0; top: 0; bottom: 38%;
  background:
    repeating-linear-gradient(to bottom,
      rgba(var(--ink), 0) 0 8.2%,
      rgba(var(--ink), .05) 8.2% 8.7%),
    repeating-linear-gradient(to right,
      rgba(var(--ink), 0) 0 26%,
      rgba(var(--ink), .035) 26% 26.5%);
}

/* The door, standing open. Nothing in it. Narrow, and pitched to
   about the value of the wall, so it never competes with the words. */
.s-search .srh-door {
  position: absolute; right: 3%; top: 19%;
  height: 43%; aspect-ratio: .36;
}
.s-search .srh-void {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom,
    #FCFAFA 0%, #F6F2F5 46%, #EAE4EE 80%, #DBD3E3 100%);
  box-shadow: inset .6vmin 0 1.8vmin rgba(var(--ink), .10);
}
.s-search .srh-jamb {
  position: absolute; left: -7%; top: -2%; bottom: 0; width: 7%;
  background: linear-gradient(to right, #CFC5D8, #EDE7F1);
}
.s-search .srh-head {
  position: absolute; left: -7%; right: -9%; top: -4%; height: 4%;
  background: linear-gradient(to bottom, #F2ECF4, #CDC3D7);
}
/* The leaf, swung back against the wall. */
.s-search .srh-leaf {
  position: absolute; left: -58%; top: 3%; width: 52%; height: 95%;
  clip-path: polygon(0% 5%, 100% 0%, 100% 100%, 0% 93%);
  background: linear-gradient(100deg, #C6BAD2 0%, #B0A3C0 48%, #9689AA 100%);
  box-shadow: .5vmin 0 1.6vmin rgba(var(--ink), .16);
}
.s-search .srh-plank {
  position: absolute; top: 0; bottom: 0; width: 1.4%;
  background: rgba(50, 40, 62, .16);
}
.s-search .srh-pk-a { left: 34%; }
.s-search .srh-pk-b { left: 68%; }
.s-search .srh-brace {
  position: absolute; left: 5%; right: 5%; top: 60%; height: 4.4%;
  border-radius: .4vmin;
  background: rgba(255, 251, 247, .26);
}

.s-search .srh-floor {
  position: absolute; left: 0; right: 0; bottom: 0; height: 38%;
  background: linear-gradient(to bottom,
    #BFB4CE 0%, #ADA1C0 16%, #9689AE 50%, #7F7398 84%, #6D6285 100%);
}
.s-search .srh-slabs {
  position: absolute; left: 0; right: 0; bottom: 0; height: 38%;
  background-repeat: no-repeat;
  background-image:
    linear-gradient(rgba(var(--ink), .13), rgba(var(--ink), .13)),
    linear-gradient(rgba(var(--ink), .11), rgba(var(--ink), .11)),
    linear-gradient(rgba(var(--ink), .09), rgba(var(--ink), .09)),
    linear-gradient(rgba(var(--ink), .07), rgba(var(--ink), .07)),
    linear-gradient(rgba(var(--ink), .06), rgba(var(--ink), .06)),
    linear-gradient(rgba(var(--ink), .06), rgba(var(--ink), .06));
  background-size:
    100% .45%, 100% .55%, 100% .7%,
    .35% 20%, .38% 32%, .4% 26%;
  background-position:
    0 18%, 0 50%, 0 88%,
    15% 18%, 56% 50%, 81% 88%;
}
.s-search .srh-skirt {
  position: absolute; left: 0; right: 0; bottom: 37.6%; height: 1.1%;
  background: linear-gradient(to bottom,
    rgba(255, 253, 250, .72) 0%, rgba(255, 253, 250, .3) 34%, rgba(var(--ink), .34) 100%);
}
.s-search .srh-base {
  position: absolute; left: 0; right: 0; bottom: 36.4%; height: 1.8%;
  background: linear-gradient(to top, rgba(var(--ink), .13), rgba(var(--ink), 0));
}
/* What the doorway lays on the flags. The door is height-led
   (.36 × 43% of the scene); this used to be 64% of the scene WIDE, so
   at 1280×620 the patch of light was four times the width of the
   opening it came through and started nowhere near it. It is now
   three door-widths wide — same height-led measure — and pinned to
   the same right edge as the door, so its top edge runs from jamb to
   jamb at every size: the opening is the last third of this box. */
.s-search .srh-spill {
  position: absolute; right: 3%; top: 61.6%; height: 22%; aspect-ratio: 2.1109;
  clip-path: polygon(66.7% 0%, 100% 0%, 100% 100%, 48% 100%);
  background: linear-gradient(to bottom,
    rgba(255, 253, 250, .58) 0%,
    rgba(255, 253, 250, .26) 50%,
    rgba(255, 253, 250, .04) 100%);
  filter: blur(1.4vmin);
}

/* Everything on the floor is inside one stage, and the stage is
   ASPECT-LOCKED at 9/20: full scene height, width taken from that
   height, same frame at every size. It was `min(100%, 78vh)` wide against a
   full-height box, which let the box change shape — the couch is
   height-led and the cloth on it is width-led, so on a wide window
   the cloth crept along the couch and the cushions spread away from
   the basket. Locked, the group is one picture at every size. */
.s-search .srh-stage {
  position: absolute; left: 50%; top: 0; height: 100%;
  aspect-ratio: 9 / 20;
  transform: translateX(-50%);
}

/* The couch, stripped. */
.s-search .srh-couch {
  position: absolute; left: -2%; bottom: 22%;
  height: 12.5%; aspect-ratio: 2.3;
}
.s-search .srh-frame {
  position: absolute; left: 2%; right: 2%; top: 32%; height: 20%;
  border-radius: .5vmin;
  background: linear-gradient(to bottom, #C4B69C 0%, #A0917A 58%, #756A60 100%);
}
.s-search .srh-slab {
  position: absolute; left: -2%; right: -2%; top: 22%; height: 12%;
  border-radius: .5vmin;
  background: linear-gradient(to bottom, #EFE6D2, #C2B49B);
}
.s-search .srh-leg {
  position: absolute; top: 50%; bottom: 0; width: 7%;
  border-radius: 0 0 .4vmin .4vmin;
  background: linear-gradient(to bottom, #A2937B, #6B6058);
}
.s-search .srh-leg-l { left: 11%; }
.s-search .srh-leg-r { right: 11%; }
.s-search .srh-bolster {
  position: absolute; right: 3%; top: 0%; width: 24%; height: 24%;
  border-radius: 50%;
  transform: rotate(-9deg);
  background: linear-gradient(to bottom, #F2DCE1, #D6A5B1);
}
.s-search .srh-under {
  position: absolute; left: 0; right: 0; bottom: -6%; height: 18%;
  border-radius: 50%;
  background: radial-gradient(50% 60% at 50% 40%, rgba(var(--ink), .32), rgba(var(--ink), 0) 74%);
  filter: blur(.9vmin);
}

/* The cloth. Half on the couch, the rest on the floor, and the end
   of it still going. */
.s-search .srh-cloth { position: absolute; inset: 0; }
.s-search .srh-onbed {
  position: absolute; left: 1%; top: 65.2%; width: 24%; height: 2.6%;
  border-radius: .5vmin .5vmin 0 0;
  transform: skewX(-11deg);
  background: linear-gradient(to bottom, #C24354, #97223A);
}
.s-search .srh-hang {
  position: absolute; left: 6%; top: 66.2%; width: 18%; height: 9.2%;
  transform-origin: 50% 0%;
  animation: srhSway 6.4s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes srhSway {
  0%   { transform: rotate(-1.6deg); }
  100% { transform: rotate(1.7deg); }
}
.s-search .srh-fall {
  position: absolute; inset: 0;
  clip-path: polygon(0% 0%, 100% 0%, 98% 74%, 88% 100%, 70% 86%, 50% 100%, 30% 84%, 12% 98%, 2% 72%);
  background: linear-gradient(102deg, #B32B43 0%, #CE5265 32%, #97223A 72%, #7E1830 100%);
}
.s-search .srh-fold {
  position: absolute; left: 40%; top: 4%; width: 7%; height: 78%;
  background: rgba(255, 179, 193, .22);
}
.s-search .srh-pool {
  position: absolute; left: 2%; top: 78.6%; width: 27%; height: 4.8%;
  border-radius: 52% 40% 58% 44% / 66% 58% 46% 54%;
  background:
    repeating-linear-gradient(74deg,
      rgba(255, 179, 193, 0)   0 5%,
      rgba(255, 179, 193, .16) 5% 6.4%,
      rgba(62, 12, 26, .16)    6.4% 7.6%),
    linear-gradient(104deg, #B23349 0%, #97223A 52%, #7B172C 100%);
  box-shadow: 0 .5vmin 1.2vmin rgba(var(--ink), .2);
}
.s-search .srh-pool2 {
  position: absolute; left: 19%; top: 81.4%; width: 18%; height: 3.6%;
  border-radius: 44% 60% 38% 62% / 56% 44% 64% 48%;
  background:
    repeating-linear-gradient(68deg,
      rgba(255, 179, 193, 0)   0 6%,
      rgba(255, 179, 193, .15) 6% 7.4%,
      rgba(62, 12, 26, .14)    7.4% 8.6%),
    linear-gradient(98deg, #BE3B51, #9A2438);
}

/* Cushions, anywhere. Flat, because they have been thrown down. */
.s-search .srh-cush {
  position: absolute;
  border-radius: 44% 48% 46% 50% / 54% 50% 56% 52%;
  box-shadow: 0 .6vmin 1.4vmin rgba(var(--ink), .2),
              inset 0 -.7vmin 1.2vmin rgba(var(--ink), .18);
}
.s-search .srh-c1 {
  left: 35%; top: 74.6%; height: 5.2%; aspect-ratio: 1.85;
  transform: rotate(-10deg);
  background:
    radial-gradient(circle at 50% 52%, rgba(var(--ink), .16) 0 5%, rgba(62, 47, 74, 0) 6%),
    linear-gradient(to bottom, #F7BDC8 0%, #E39CAA 60%, #BE7486 100%);
}
.s-search .srh-c2 {
  left: 19%; top: 83.2%; height: 4.4%; aspect-ratio: 2;
  transform: rotate(6deg);
  background:
    radial-gradient(circle at 50% 52%, rgba(var(--ink), .16) 0 5%, rgba(62, 47, 74, 0) 6%),
    linear-gradient(to bottom, #C1ACE8 0%, #A288D6 60%, #7862AC 100%);
}
.s-search .srh-c3 {
  left: 73%; top: 66.4%; height: 4.4%; aspect-ratio: 1.6;
  transform: rotate(-34deg);
  background:
    radial-gradient(circle at 50% 52%, rgba(var(--ink), .16) 0 5%, rgba(62, 47, 74, 0) 6%),
    linear-gradient(to bottom, #EBD5A8 0%, #D6B87E 60%, #A98F58 100%);
}

/* A bowl, over. */
.s-search .srh-bowl {
  position: absolute; left: 30%; top: 71.8%;
  height: 3.2%; aspect-ratio: 2.2;
  transform: rotate(6deg);
}
.s-search .srh-bw-b {
  position: absolute; inset: 8% 0 24% 0;
  border-radius: 50% 50% 10% 10% / 100% 100% 18% 18%;
  background: linear-gradient(to bottom, #D2A945, #8A6410 72%, #63470B 100%);
}
.s-search .srh-bw-r {                       /* the foot ring, uppermost */
  position: absolute; left: 30%; right: 30%; top: 0; height: 20%;
  border-radius: 50%;
  background: linear-gradient(to bottom, #E0BC6A, #A07C22);
}

/* The basket, over on its side. The mouth is toward us and there is
   nothing in it, which is the picture. */
.s-search .srh-basket {
  position: absolute; left: 46%; bottom: 12%;
  height: 15.5%; aspect-ratio: 1.67; max-width: 52%;
}
.s-search .srh-basket svg { width: 100%; height: 100%; display: block; }
.s-search .srh-bshade { fill: rgba(62, 47, 74, .16); }
.s-search .srh-weave  { fill: #EDC66F; }
.s-search .srh-warp path {
  fill: none; stroke: #C79E45; stroke-width: 2; opacity: .5;
  vector-effect: non-scaling-stroke;
}
.s-search .srh-band path {
  fill: none; stroke: #C79E45; stroke-width: 3; opacity: .34;
  vector-effect: non-scaling-stroke;
}
.s-search .srh-mouthd { fill: #D6A94F; }
.s-search .srh-mouth  { fill: #9E7529; }
.s-search .srh-hollow { fill: #4E3A12; }
.s-search .srh-rim    { fill: #FFDF95; }
.s-search .srh-figs ellipse { fill: #6B4BB0; opacity: .8; }
.s-search .srh-stalk path {
  fill: none; stroke: #4E7B58; stroke-width: 2.2; stroke-linecap: round;
  vector-effect: non-scaling-stroke;
}

/* Dust, still coming down. Nobody is here to disturb it. */
.s-search .srh-motes {
  position: absolute; left: 30%; right: 6%; top: 12%; bottom: 34%;
  pointer-events: none;
}
.s-search .srh-motes i {
  position: absolute;
  width: .62vmin; aspect-ratio: 1; border-radius: 50%;
  background: rgba(255, 255, 255, .95);
  opacity: 0;
  animation: srhFall 44s linear infinite;
  animation-play-state: paused;
}
@keyframes srhFall {
  0%   { transform: translate(0, 0); opacity: 0; }
  14%  { opacity: .62; }
  76%  { opacity: .42; }
  100% { transform: translate(var(--x, -2vmin), var(--y, 18vmin)); opacity: 0; }
}
.s-search .srh-motes i:nth-child(1) { left: 14%; top:  4%; --x: -2vmin; --y: 20vmin; animation-duration: 48s; animation-delay:  -4s; }
.s-search .srh-motes i:nth-child(2) { left: 38%; top: 16%; --x:  1vmin; --y: 16vmin; animation-duration: 56s; animation-delay: -18s; width: .5vmin; }
.s-search .srh-motes i:nth-child(3) { left: 62%; top:  8%; --x: -3vmin; --y: 22vmin; animation-duration: 40s; animation-delay: -29s; }
.s-search .srh-motes i:nth-child(4) { left: 24%; top: 34%; --x:  2vmin; --y: 14vmin; animation-duration: 62s; animation-delay: -11s; width: .48vmin; }
.s-search .srh-motes i:nth-child(5) { left: 78%; top: 26%; --x: -1vmin; --y: 19vmin; animation-duration: 50s; animation-delay: -37s; }
.s-search .srh-motes i:nth-child(6) { left: 50%; top: 44%; --x: -2vmin; --y: 12vmin; animation-duration: 66s; animation-delay: -23s; width: .52vmin; }
.s-search .srh-motes i:nth-child(7) { left:  6%; top: 22%; --x:  1vmin; --y: 21vmin; animation-duration: 54s; animation-delay: -46s; width: .46vmin; }

/* A stop over. The room is brighter than the hour deserves — laid on
   last so it bleaches the objects as well as the walls. */
.s-search .srh-glare {
  position: absolute; inset: 0;
  background:
    radial-gradient(52% 40% at 80% 32%, rgba(255, 253, 250, .40), rgba(255, 253, 250, 0) 76%),
    linear-gradient(to bottom,
      rgba(255, 253, 250, .26) 0%,
      rgba(255, 253, 250, .10) 46%,
      rgba(255, 253, 250, .14) 100%);
  animation: srhGlare 28s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes srhGlare { 0% { opacity: .74 } 100% { opacity: 1 } }

.s-search .srh-vig {
  position: absolute; inset: 0;
  background:
    linear-gradient(to bottom, rgba(74, 62, 96, .28) 0%, rgba(74, 62, 96, 0) 15%),
    radial-gradient(96% 74% at 46% 50%,
      rgba(74, 62, 96, 0) 40%, rgba(74, 62, 96, .18) 84%, rgba(74, 62, 96, .32) 100%);
}

.page.live .s-search .srh-glare,
.page.live .s-search .srh-hang,
.page.live .s-search .srh-motes i { animation-play-state: running; }

   ─────────────────────────────────────────────────────────────────── */

html.no-motion .s-harbour .hrb-sun,

}

/* ═══════════════════════════════════════════════════════════════════
   SCENES D — copies · vials. Every selector scoped under its .s-NAME.
   Composed for 390×844 portrait first; checked at 1440×800.

   Both scenes share the vertical grammar of the other eight: the plane
   the subject stands on is around y=70–80%, the subject lives between
   ~60% and ~86%, the middle third is a wash the caption sits on, and
   the bottom 12–15% is sacrificial (the in-app browser toolbar).

   One structural difference worth knowing about: in both scenes the
   ground plane is a *child* of the art box rather than a sibling with
   its own viewport-% top. The subjects are drawn in SVG user units and
   the box is sized against `vh` as well as `%`, so a sibling plane
   drifts off the feet of the objects between a phone and a desktop.
   As a child it is expressed in fractions of the box, and the back
   edge stays welded to the far end of the arrangement everywhere.

   The same rule inside the figures: every person is head over neck over
   shoulder over limb, each drawn so the one below it is painted *over*
   its base. Head, neck and body are held together by overlap, never by
   two shapes stopping at the same coordinate — a butt joint opens into
   a gap the moment anything moves; an overlap cannot.
   ═══════════════════════════════════════════════════════════════════ */


/* ───────────────────────────────────────────────────────────────────
   9 · .s-copies — "The snake comes from Plutarch."
   Beat 4 already spent the single papyrus. This one is the chain the
   papyrus arrived down: a rank of codices going back into an archive,
   the nearest whole and legible, each one behind it copied from the
   one in front and worse for it — a word gone, a line gone, a line
   written back in somebody else's ink — until the far ones are only a
   suggestion. Past the last of them there is a gap with a scuff on the
   plane and nothing standing in it: the account nobody can name.
   The moving thing is the transmission itself. A pulse of attention
   travels back down the rank and gives out before it reaches the gap.
   ─────────────────────────────────────────────────────────────────── */

.s-copies {
  --wall-hi: #332A3E;
  --wall:    #201A28;
  --wall-lo: #130F1B;
  --plane:   #2C2436;
  --plane-lo:#171220;
  --lilac:   #B79CED;
  --fix:     #8A62CE;
}

.s-copies .cop-room {
  position: absolute; inset: 0;
  background:
    radial-gradient(74% 44% at 86% 4%, rgba(255,211,110,.15), rgba(255,211,110,0) 70%),
    linear-gradient(177deg, var(--wall-hi) 0%, var(--wall) 44%, var(--wall-lo) 100%);
}

/* The rest of the archive, up in the dark: rolled ends in a rack, and
   a shelf edge catching what light there is. Never more than a hint —
   the caption has to sit on the wall below it. */
.s-copies .cop-rack {
  position: absolute; left: 0; right: 0; top: 8%; height: 19%;
  background:
    linear-gradient(180deg,
      rgba(255,247,237,0) 86%, rgba(255,247,237,.16) 86%,
      rgba(255,247,237,.16) 92%, rgba(255,247,237,0) 92%),
    repeating-linear-gradient(90deg,
      rgba(183,156,237,.16) 0 1.8%, rgba(183,156,237,0) 1.8% 4.5%),
    linear-gradient(180deg, rgba(255,247,237,.05), rgba(255,247,237,0) 88%);
  -webkit-mask-image: linear-gradient(90deg, transparent 2%, #000 46%, #000 90%, transparent 100%);
          mask-image: linear-gradient(90deg, transparent 2%, #000 46%, #000 90%, transparent 100%);
  opacity: .8;
}

/* The lamp is off frame to the upper right, over the copy we can read.
   Everything further back is further from it. */
.s-copies .cop-lamp {
  position: absolute; right: -10%; top: -14%;
  width: 62vmin; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle,
    rgba(255,211,110,.20) 0%, rgba(255,211,110,.07) 44%, rgba(255,211,110,0) 72%);
  animation: copLamp 16.5s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes copLamp { from { opacity: .62 } to { opacity: 1 } }

.s-copies .cop-art {
  position: absolute; left: 50%; bottom: 14%;
  width: min(112%, 60vh); aspect-ratio: 3.2051;
  transform: translateX(-47%);
}
.s-copies .cop-art svg { position: relative; width: 100%; height: 100%; display: block; overflow: visible; }

/* The plane, in fractions of the art box — see the note at the top. */
.s-copies .cop-plane {
  position: absolute; left: -300%; right: -300%; top: 2%; height: 320%;
  background: linear-gradient(180deg,
    var(--plane) 0%, var(--plane-lo) 22%, #100C16 62%, #0B0810 100%);
}
/* the lamp's pool on the plane, over the near end of the rank — it is
   what the copyist is lit by, and what the far end has run out of */
.s-copies .cop-pool {
  position: absolute; left: 44%; top: -22%; width: 86%; height: 150%;
  background: radial-gradient(58% 46% at 48% 46%,
    rgba(255,211,110,.22) 0%, rgba(255,211,110,.07) 46%, rgba(255,211,110,0) 74%);
}
.s-copies .cop-edge {
  position: absolute; left: -300%; right: -300%; top: 1.2%; height: 2.6%;
  background: linear-gradient(90deg,
    rgba(255,214,170,0) 0%, rgba(255,214,170,.07) 34%,
    rgba(255,214,170,.26) 84%, rgba(255,214,170,0) 100%);
}

/* One codex. The pages, the boards under them, the gutter between. */
.s-copies .cop-page  { fill: var(--pg); }
.s-copies .cop-board { fill: var(--bd); }
.s-copies .cop-gut   { fill: var(--bd); opacity: .74; }
.s-copies .cop-sh    { fill: #0A0710; opacity: .5; }

/* The marks. Never letters — strokes, the same hand as the papyrus. */
.s-copies .cop-ink rect { fill: var(--nk); opacity: .84; }
/* the line somebody wrote back in, which is now part of the account */
.s-copies .cop-ink .cop-fix { fill: var(--fix); opacity: .9; }

/* Down the rank: paler paper, greyer ink, and less of the account left
   on the page. `--o` is the resting opacity, `--oh` the crest of the
   pulse — the pulse loses amplitude as it goes, like everything else. */
.s-copies .cop-c1 { --pg:#FDF4E6; --bd:#5F4494; --nk:#3E2F4A; --o:.96; --oh:1   }
.s-copies .cop-c2 { --pg:#EFE0CB; --bd:#55407F; --nk:#4A3B56; --o:.80; --oh:.93 }
.s-copies .cop-c3 { --pg:#D9CABB; --bd:#4C3B6C; --nk:#584A61; --o:.60; --oh:.74 }
.s-copies .cop-c4 { --pg:#BCADAE; --bd:#453A5C; --nk:#6A5E70; --o:.42; --oh:.53 }
.s-copies .cop-c5 { --pg:#9B8D9B; --bd:#3E3650; --nk:#7C7280; --o:.27; --oh:.34 }
.s-copies .cop-c6 { --pg:#7C7189; --bd:#383247; --nk:#8B7B93; --o:.15; --oh:.19 }

/* Resting state is the whole rank as it stands, so a scene that is not
   the live one still composes; the pulse only exists while live. */
.s-copies .cop-c {
  opacity: var(--o);
  animation: copPass 26s ease-in-out infinite;
  animation-play-state: paused;
}
@keyframes copPass {
  0%        { opacity: var(--o)  }
  5%        { opacity: var(--oh) }
  13%       { opacity: var(--o)  }
  100%      { opacity: var(--o)  }
}
/* Negative delays, decreasing in magnitude down the rank, so the crest
   passes from the copy at our elbow to the far end and not the reverse.
   It starts about three seconds after the beat goes live. */
.s-copies .cop-c1 { animation-delay: -24.0s }
.s-copies .cop-c2 { animation-delay: -22.8s }
.s-copies .cop-c3 { animation-delay: -21.6s }
.s-copies .cop-c4 { animation-delay: -20.4s }
.s-copies .cop-c5 { animation-delay: -19.2s }
.s-copies .cop-c6 { animation-delay: -18.0s }

/* The gap at the end of the rank. It fades and does not quite return. */
.s-copies .cop-gone-sh { fill: #090610; }
.s-copies .cop-gone-mk { fill: #9B8BA3; opacity: .62; }
.s-copies .cop-gone {
  opacity: .5;
  animation: copGone 21.4s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes copGone { from { opacity: .22 } to { opacity: .68 } }

/* The copyist. Silhouette in the dim of the room, with the lamp behind
   his shoulder: the rim down his back is the only edge that catches it,
   and his face and hands come back up out of the lit page in front of
   him. He is drawn last, so he is in front of the codex he is copying. */
.s-copies .cop-fig   { fill: #17111F; }
.s-copies .cop-hair  { fill: #0F0A17; }
.s-copies .cop-skin  { fill: #9A6E58; }
.s-copies .cop-face  { fill: #A87A60; }
.s-copies .cop-arm   { fill: none; stroke: #17111F; stroke-width: 8.6; stroke-linecap: round; }
.s-copies .cop-cuff  { fill: none; stroke: #241C33; stroke-width: 9.4;
                       stroke-linecap: round; }
/* His face. The house draws a face as an ink ellipse for the eye and a
   short ink line for the mouth — see PipView — and nothing else, so
   that is what he gets, plus the one lid that says he is looking down
   rather than out. All static shapes: no filter, no extra animation. */
.s-copies .cop-eye   { fill: #14101C; }
.s-copies .cop-lid   { fill: none; stroke: #14101C; stroke-width: 1.3;
                       stroke-linecap: round; }
.s-copies .cop-mouth { fill: none; stroke: #14101C; stroke-width: 1.25;
                       stroke-linecap: round; opacity: .72; }
.s-copies .cop-knuck { fill: none; stroke: #6E4F3F; stroke-width: 1.1;
                       stroke-linecap: round; opacity: .75; }
.s-copies .cop-quill { fill: #E7D7B4; }
.s-copies .cop-plume { fill: #F3E7CC; opacity: .8; }
.s-copies .cop-rim   { fill: none; stroke: #C79448; stroke-width: 1.9; opacity: .62;
                       stroke-linecap: round; }

/* Distance. The far half of the rank is dropped into the room's own
   colour rather than blacked out, so it reads as depth, not as a bar. */
.s-copies .cop-haze {
  position: absolute; inset: 0;
  background: linear-gradient(90deg,
    rgba(19,15,27,.58) 0%, rgba(19,15,27,.18) 12%, rgba(19,15,27,0) 34%);
}
.s-copies .cop-vig {
  position: absolute; inset: 0;
  background: radial-gradient(88% 66% at 64% 68%, rgba(0,0,0,0) 44%, rgba(0,0,0,.46) 100%);
}

@media (orientation: landscape) {
  .s-copies .cop-art { width: min(112%, 82vh) }
  .s-copies .cop-lamp { width: 46vmin }
}

.page.live .s-copies .cop-c,
.page.live .s-copies .cop-gone,
.page.live .s-copies .cop-lamp { animation-play-state: running; }

html.no-motion .s-copies .cop-c    { animation: none; opacity: var(--o) }
html.no-motion .s-copies .cop-gone { animation: none; opacity: .5 }
html.no-motion .s-copies .cop-lamp { animation: none; opacity: .85 }


/* ───────────────────────────────────────────────────────────────────
   11 · .s-mausoleum — "Some historians think poison."
   Beat 10 is the basket: warm, domestic, figs on a ledge in the last
   of the light. This is the room those figs were supposedly carried
   into, and it is nothing like it.

   The place is the mausoleum she had built for herself by the temple
   of Isis, moved her treasure into, and barricaded herself in — which
   is where she actually died, and which almost nobody pictures. So:
   stone, grave goods against the wall, a barred door the guards had to
   break with the morning showing round its edges, one oil lamp. Her on
   the couch in royal regalia with a small vessel at her lips, Iras
   collapsed at the foot, Charmion still straightening the diadem. The
   physician's table stands to one side with its vials and mortar —
   that is the card's argument, not the whole picture.

   Cool where the basket was warm: the only warmth is the one lamp, and
   the light coming round the door is daylight and cold. The flame is
   the one thing in the room that moves.
   ─────────────────────────────────────────────────────────────────── */

.s-mausoleum {
  --wall-hi:  #57445A;
  --wall:     #382B44;
  --wall-lo:  #221929;
  --gold:     #C9A24E;
  --gold-hi:  #FFD36E;
  --gold-lo:  #7E6229;
  --purple:   #6B4BB0;
  --purple-lo:#4A3577;
  --drape:    #2F2249;
  --drape-hi: #3E2E5E;
  --linen:    #EFE3CC;
  --linen-lo: #AE9C7C;
  --skin:     #C08A6B;
  --attend:   #423450;
  --attend-hi:#54445F;
  --hair:     #1F1826;
  --cold:     #CFE3E6;
  --stone:    #6B5C6E;
  --wood:     #4A3928;
}

.s-mausoleum .vil-room {
  position: absolute; inset: 0;
  background:
    radial-gradient(64% 40% at 30% 66%, rgba(255,211,110,.17), rgba(255,211,110,0) 74%),
    radial-gradient(40% 30% at 8% 62%, rgba(207,227,230,.10), rgba(207,227,230,0) 76%),
    linear-gradient(178deg, #1A1322 0%, var(--wall-lo) 16%, var(--wall) 58%, var(--wall-hi) 100%);
}
/* courses of block. They say the room is cut stone and nothing more,
   and they fade out well before the caption sits on them. */
.s-mausoleum .vil-courses {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(180deg,
    rgba(183,156,237,0) 0 5.4%, rgba(183,156,237,.05) 5.4% 5.75%);
  -webkit-mask-image: radial-gradient(76% 46% at 40% 76%, #000 0%, rgba(0,0,0,.2) 74%, transparent 100%);
          mask-image: radial-gradient(76% 46% at 40% 76%, #000 0%, rgba(0,0,0,.2) 74%, transparent 100%);
}

/* the top of the wall, so the chamber has a ceiling rather than a void */
.s-mausoleum .vil-cornice {
  position: absolute; left: 0; right: 0; top: 17.5%; height: 4.2%;
  background: linear-gradient(180deg,
    rgba(183,156,237,.10) 0 14%, rgba(87,68,90,.5) 14% 78%, rgba(18,13,24,.5) 78% 100%);
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 20%, #000 80%, transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0%, #000 20%, #000 80%, transparent 100%);
}

.s-mausoleum .vil-art {
  position: absolute; left: 50%; bottom: 12.5%;
  width: min(100%, 56vh); aspect-ratio: 1.7241;
  transform: translateX(-50%);
}
/* overflow visible: the floor and the wall base are drawn as rects far
   wider than the box, so they run to both edges of any viewport while
   staying welded to the feet of everything standing on them. */
.s-mausoleum .vil-art svg { width: 100%; height: 100%; display: block; overflow: visible; }

.s-mausoleum .vil-base { fill: #100B16; opacity: .8; }

/* the door */

.s-mausoleum .vil-leaf  { fill: #241C2E; }

.s-mausoleum .vil-rim   { fill: #A79AAE; }
.s-mausoleum .vil-pestle{ fill: #A79AAE; }
.s-mausoleum .vil-paper { fill: #F1E8D6; }

.s-mausoleum .vil-mat       { fill: var(--linen-lo); }

.s-mausoleum .vil-hem     { fill: var(--gold); opacity: .8; }

/* Faces, in the flat idiom: an ink eye, a lid, a level mouth. Cleopatra
   and Charmion are awake and Iras is not, which is the whole reason
   this room is an argument — so Iras gets the shut lid and no eye. */
.s-mausoleum .vil-eye   { fill: #16111D; }

                          stroke-linecap: round; }

/* The one thing moving in the room. */
.s-mausoleum .vil-flame {

  animation-play-state: paused;
}
@keyframes vilGutter {
  from { transform: scale(.92, .86) translateX(-2%) }

  to   { transform: scale(.97, 1.16) translateX(-.6%) }
}
.s-mausoleum .vil-fireglow,
.s-mausoleum .vil-pool {

}

/* a whisper: the morning behind the door, which is not coming in */
.s-mausoleum .vil-seam {

  animation-play-state: paused;
}
@keyframes vilSeam { from { opacity: .78 } to { opacity: 1 } }

.s-mausoleum .vil-warm {
  position: absolute; inset: 0;
  background: radial-gradient(52% 26% at 30% 78%, rgba(255,211,110,.1), rgba(255,211,110,0) 76%);
}

.page.live .s-mausoleum .vil-flame,
.page.live .s-mausoleum .vil-fireglow,

html.no-motion .s-mausoleum .vil-flame    { animation: none; transform: none }
html.no-motion .s-mausoleum .vil-fireglow { animation: none; opacity: .9 }
html.no-motion .s-mausoleum .vil-pool     { animation: none; opacity: .9 }
html.no-motion .s-mausoleum .vil-seam     { animation: none; opacity: .9 }

/* ═══════════════════════════════════════════════════════════════════
   SCENES E — bath · triumph

   Composed for 390×844 portrait first, desktop second. Two fixed
   rules came out of measuring the real shell rather than guessing:

     • the caption box occupies 41.4–58.6% of the viewport on a phone
       and 42.2–57.8% on a desktop, so nothing that carries meaning
       sits between 40% and 60%;
     • the bottom 12% is under the in-app browser toolbar, so nothing
       that carries meaning sits below 88%.

   Both scenes therefore hang their cast off one bottom-anchored art
   box whose height is pinned to ~28% of the viewport at every size
   (`min(N%, Mvh)` against a fixed aspect-ratio). The ground plane is
   a CHILD of that box, not a sibling, so the floor line stays welded
   to the things standing on it whatever the window does.

   Every selector scoped under .s-bath / .s-triumph. Sizes in % / vmin
   / em; SVG user units inside the art boxes. Motion is paused until
   `.page.live` and gone under `html.no-motion`.
   ═══════════════════════════════════════════════════════════════════ */


/* ───────────────────────────────────────────────────────────────────
   1 · .s-bath — "She bathes. She dresses in royal robes. She eats a
   final meal."

   THE LIGHT. The old scene put a shaft on the floor that its window
   could not have thrown. Here the opening is at 62–79% × 13–26% of
   the scene and the shaft is clipped in that same percentage space,
   its two long edges leaving the two jambs at 62% and 79% on the
   sill line at 26%:

       polygon(62% 26%, 79% 26%, 47.2% 92%, 22.9% 92%)

   Both are percentages of the same box, so the relationship survives
   every aspect ratio the page can be given — a percentage layout
   stretches affinely, and an affine stretch keeps straight lines
   straight and coincident points coincident. The bright patch is the
   same polygon masked to the water band, so the light lands exactly
   as wide as the beam that carried it, at 33–56% — which is where
   she is sitting, on a phone and on a desktop.
   ─────────────────────────────────────────────────────────────────── */

.s-bath {
  --shade: 62, 47, 74;
  --butter: 255, 211, 110;
  --butter-soft: 255, 234, 184;
  --skin: #C9915F;
  --skin-lo: #A8703F;
  --hair: #2E2334;
  --water: #3FA79E;
  --water-lo: #1F7A72;
  --stone: #EBD9BB;
  /* The art box's own width expression, as a token. The cast is welded
     to a height-led box (`min(96%, 46vh)`) while the window and the
     shaft it throws were measured against the viewport — so on a short
     wide window the light landed on bare floor a hundred pixels to the
     left of the woman it was supposed to be falling on. Everything that
     has to agree with the basin is now a fraction of this instead. */
  --aw: min(96%, 46vh);
  background: #C3A183;
}

.s-bath .bth-wall {
  position: absolute; inset: 0;
  background:
    linear-gradient(92deg,
      rgba(var(--shade), .34) 0%,
      rgba(var(--shade), .10) 30%,
      rgba(var(--butter), .05) 62%,
      rgba(var(--butter), .20) 100%),
    linear-gradient(to bottom,
      rgba(var(--shade), .46) 0%,
      rgba(var(--shade), .10) 16%,
      rgba(var(--shade), .01) 40%,
      rgba(var(--shade), .16) 68%,
      rgba(var(--shade), .38) 100%),
    linear-gradient(to bottom, #CFAA83 0%, #E4C69E 34%, #D2B08B 66%, #B2937B 100%);
}

/* Plastered ashlar. Barely there — it says wall, and nothing else. */
.s-bath .bth-courses {
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(to bottom,
      rgba(var(--shade), 0) 0 7.4vmin, rgba(var(--shade), .055) 7.4vmin 7.7vmin),
    repeating-linear-gradient(to right,
      rgba(var(--shade), 0) 0 22vmin, rgba(var(--shade), .04) 22vmin 22.3vmin);
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 56%, transparent 72%);
          mask-image: linear-gradient(to bottom, #000 0%, #000 56%, transparent 72%);
}

/* The painted band at the top of the wall. Greek court, Egyptian
   palace: a meander in Egyptian blue over red ochre, which is what
   the Alexandrian plaster fragments actually carry. */
.s-bath .bth-frieze {
  position: absolute; left: 0; right: 0; top: 3.2%; height: 3.4%;
  background:
    linear-gradient(to bottom,
      rgba(154, 107, 0, .55) 0 10%, rgba(0, 0, 0, 0) 10% 90%,
      rgba(154, 107, 0, .55) 90% 100%),
    repeating-linear-gradient(90deg,
      rgba(0, 0, 0, 0) 0 1.5vmin,
      rgba(154, 107, 0, .30) 1.5vmin 4.2vmin,
      rgba(0, 0, 0, 0) 4.2vmin 5.7vmin),
    linear-gradient(to bottom, #E8CBA6, #D9B58E);
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%);
  opacity: .46;
}

/* ── the opening ──────────────────────────────────────────────── */
/* Left/width off --aw so the opening rides with the room; top/height
   stay viewport-relative, because that is a height and heights already
   agree. At 390×844 this lands within half a percent of the numbers it
   replaces — it only starts to matter as the window gets wider. */
.s-bath .bth-win { position: absolute; top: 13%; height: 13%;
                   left: calc(50% + .12 * var(--aw));
                   width: calc(.17 * var(--aw)); }

.s-bath .bth-splay {
  position: absolute; inset: -14% -11%;
  background: linear-gradient(to bottom,
    rgba(255, 247, 237, .34), rgba(255, 247, 237, .07));
}
.s-bath .bth-open {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, #FCFEFC 0%, #E8F6F1 38%, #FFF3D2 100%);
  box-shadow: 0 0 6vmin rgba(var(--butter), .62), 0 0 1.5vmin rgba(255, 253, 244, .92);
  animation: e-bth-glow 17s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes e-bth-glow { 0% { filter: brightness(.95) } 100% { filter: brightness(1.08) } }

.s-bath .bth-mull {
  position: absolute; left: 48.4%; width: 3.2%; top: 0; bottom: 0;
  background: rgba(var(--shade), .46);
}
.s-bath .bth-sill {
  position: absolute; left: -15%; right: -15%; top: 100%; height: 15%;
  border-radius: 0 0 .3vmin .3vmin;
  background: linear-gradient(to bottom, #F4E5CA, #B79779);
}
.s-bath .bth-bloom {
  position: absolute; inset: -80% -70%;
  background: radial-gradient(50% 50% at 50% 50%,
    rgba(var(--butter-soft), .40) 0%, rgba(var(--butter), 0) 70%);
  mix-blend-mode: screen;
}

/* ── the shaft ────────────────────────────────────────────────── */
.s-bath .bth-shaft,
.s-bath .bth-land {
  position: absolute; inset: 0;
  pointer-events: none;
  /* The same two jambs, and a foot that lands where the basin is: the
     four corners are all fractions of --aw now, so the beam leaves the
     window it was thrown from and arrives on her at every window shape. */
  clip-path: polygon(calc(50% + .12 * var(--aw)) 26%,
                     calc(50% + .29 * var(--aw)) 26%,
                     calc(50% - .03 * var(--aw)) 92%,
                     calc(50% - .283 * var(--aw)) 92%);
  mix-blend-mode: screen;
}
.s-bath .bth-shaft {
  z-index: 2;
  background: linear-gradient(to bottom,
    rgba(var(--butter-soft), 0) 24.6%,
    rgba(255, 250, 236, .72) 27%,
    rgba(var(--butter-soft), .24) 38%,
    rgba(var(--butter), .09) 56%,
    rgba(var(--butter), .07) 72%,
    rgba(var(--butter), .09) 84%,
    rgba(var(--butter), 0) 92.5%);
  filter: blur(1.2vmin);
}
/* Where the shaft arrives. Same polygon, so the patch is exactly as
   wide as the beam that made it. */
.s-bath .bth-land {
  z-index: 6;
  background: linear-gradient(to bottom,
    rgba(255, 246, 220, 0) 68%,
    rgba(255, 250, 232, .12) 74%,
    rgba(255, 250, 232, .34) 80.5%,
    rgba(var(--butter-soft), .26) 85%,
    rgba(var(--butter), .07) 89%,
    rgba(var(--butter), 0) 92%);
  filter: blur(2vmin);
  animation: e-bth-breathe 19s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes e-bth-breathe { 0% { opacity: .82 } 100% { opacity: 1 } }

.s-bath .bth-motes {
  position: absolute; left: 24%; right: 40%; top: 28%; bottom: 22%;
  z-index: 7; pointer-events: none;
}
.s-bath .bth-motes i {
  position: absolute;
  width: .75vmin; aspect-ratio: 1; border-radius: 50%;
  background: rgba(255, 251, 240, .95);
  opacity: .34;
  animation: e-bth-mote 32s ease-in-out infinite;
  animation-play-state: paused;
}
@keyframes e-bth-mote {
  0%   { transform: translate(0, 0) scale(.55); opacity: .10 }
  24%  { opacity: .54 }
  72%  { opacity: .32 }
  100% { transform: translate(var(--x, -5vmin), var(--y, 9vmin)) scale(1); opacity: 0 }
}
.s-bath .bth-motes i:nth-child(1) { left: 74%; top:  6%; --x: -5vmin; --y: 11vmin; animation-duration: 36s; animation-delay: -4s }
.s-bath .bth-motes i:nth-child(2) { left: 58%; top: 19%; --x: -4vmin; --y: 15vmin; animation-duration: 44s; animation-delay: -17s; width: .58vmin }
.s-bath .bth-motes i:nth-child(3) { left: 82%; top: 31%; --x: -6vmin; --y:  8vmin; animation-duration: 30s; animation-delay: -25s }
.s-bath .bth-motes i:nth-child(4) { left: 44%; top: 43%; --x: -3vmin; --y: 12vmin; animation-duration: 48s; animation-delay: -9s;  width: .55vmin }
.s-bath .bth-motes i:nth-child(5) { left: 66%; top: 55%; --x: -7vmin; --y:  7vmin; animation-duration: 38s; animation-delay: -33s }
.s-bath .bth-motes i:nth-child(6) { left: 32%; top: 66%; --x: -3vmin; --y:  9vmin; animation-duration: 54s; animation-delay: -20s; width: .62vmin }
.s-bath .bth-motes i:nth-child(7) { left: 52%; top: 76%; --x: -5vmin; --y:  6vmin; animation-duration: 34s; animation-delay: -42s }
.s-bath .bth-motes i:nth-child(8) { left: 70%; top: 12%; --x: -4vmin; --y: 17vmin; animation-duration: 60s; animation-delay: -28s; width: .5vmin }
.s-bath .bth-motes i:nth-child(9) { left: 38%; top: 34%; --x: -8vmin; --y: 10vmin; animation-duration: 41s; animation-delay: -50s; width: .52vmin }

/* ── the art box: floor line, basin, three women ──────────────── */
.s-bath .bth-art {
  position: absolute; left: 50%; bottom: 12%;
  width: min(96%, 46vh); aspect-ratio: 100 / 63;
  transform: translateX(-50%);
  z-index: 4;
}
.s-bath .bth-art svg { position: relative; width: 100%; height: 100%; display: block; overflow: visible }

/* The floor. A child of the art box — 24 of the viewBox's 63 units —
   so the line where the wall stops stays welded to the basin. */
.s-bath .bth-plane {
  position: absolute; left: -300%; right: -300%; top: 38.1%; height: 340%;
  background: linear-gradient(to bottom,
    #D9BC97 0%, #C6A883 26%, #AC8F78 62%, #8E7573 100%);
}
.s-bath .bth-planeline {
  position: absolute; left: -300%; right: -300%; top: 38.1%; height: 1.1%;
  background: linear-gradient(90deg,
    rgba(var(--shade), .34), rgba(var(--butter-soft), .30) 62%, rgba(var(--shade), .30));
}

.s-bath .bth-sh   { fill: rgba(62, 47, 74, .20) }
.s-bath .bth-sh2  { fill: rgba(62, 47, 74, .26) }

/* Stone: the coping is the floor, because the basin is sunk into it. */
.s-bath .bth-cope    { fill: #E3CFAE }
.s-bath .bth-cope-hi { fill: rgba(255, 247, 237, .58) }
.s-bath .bth-lip     { fill: rgba(255, 247, 237, .40) }
.s-bath .bth-basin   { fill: #9C8C7A }
.s-bath .bth-water   { fill: var(--water) }
.s-bath .bth-shade   { fill: var(--water-lo); opacity: .70 }
.s-bath .bth-step    { fill: #6FCBC0; opacity: .60 }
.s-bath .bth-step2   { fill: #58BAB0; opacity: .55 }
.s-bath .bth-water-fg{ fill: #46B0A6 }
.s-bath .bth-rip     { fill: rgba(255, 247, 237, .46) }

.s-bath .bth-skin    { fill: var(--skin) }
.s-bath .bth-hi      { fill: rgba(var(--butter-soft), .34) }
.s-bath .bth-hair    { fill: var(--hair) }
/* Faces. The same two marks the app's own mascot is drawn with — an
   ink ellipse for the eye and a short ink line for the mouth (see
   PipView) — and nothing else. Level, never curved: this is her last
   morning and none of the three of them is pleased about it. */
.s-bath .bth-eye     { fill: var(--hair) }
.s-bath .bth-nose    { fill: none; stroke: var(--skin-lo); stroke-width: .5;
                       stroke-linecap: round }
.s-bath .bth-mouth   { fill: none; stroke: var(--hair); stroke-width: .48;
                       stroke-linecap: round; opacity: .72 }
.s-bath .bth-arm     { fill: none; stroke: var(--skin); stroke-width: 3.1; stroke-linecap: round }
.s-bath .bth-arm-w   { stroke: var(--skin-lo); opacity: .8 }
.s-bath .bth-linen   { fill: #FDF3E4 }
.s-bath .bth-blush   { fill: #F2B7BF }
.s-bath .bth-crimson { fill: #A81F38 }
.s-bath .bth-crimson-hi { fill: #C63C52 }
.s-bath .bth-crimson-lo { fill: #8A1830 }
.s-bath .bth-gold    { fill: #FFD36E }
.s-bath .bth-diadem  { fill: none; stroke: #FFD36E; stroke-width: 1 }

.s-bath .bth-jar      { fill: #B87A3C }
.s-bath .bth-jar-b    { fill: #A26A34 }
.s-bath .bth-jar-hi   { fill: #D79A57 }
.s-bath .bth-jar-lo   { fill: #9A6330 }
.s-bath .bth-handle2  { fill: none; stroke: #8F5C2C; stroke-width: 1.4; stroke-linecap: round }
.s-bath .bth-jar-band { fill: rgba(46, 35, 52, .22) }
.s-bath .bth-handle   { fill: none; stroke: #A26A34; stroke-width: 1.3; stroke-linecap: round }

.s-bath .bth-bronze    { fill: #A87615 }
.s-bath .bth-bronze-hi { fill: #D2A337 }
.s-bath .bth-fig       { fill: #6B4BB0 }
.s-bath .bth-fig-hi    { fill: rgba(183, 156, 237, .55) }
.s-bath .bth-cup       { fill: #C89A4E }
.s-bath .bth-cup-hi    { fill: #E9C67E }

.s-bath .bth-stream    { fill: rgba(226, 248, 246, .66); filter: blur(.12vmin) }
.s-bath .bth-stream-hi { fill: none; stroke: rgba(255, 255, 255, .55); stroke-width: .35 }
.s-bath .bth-drop      { fill: rgba(240, 253, 251, .8) }
.s-bath .bth-drop2     { fill: rgba(246, 254, 253, .9) }

/* ── motion. The pour is the one thing that moves; the rest breathes. */
.s-bath .bth-pour {
  transform-box: fill-box; transform-origin: 50% 0;
  animation: e-bth-pour 2.9s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes e-bth-pour {
  0%   { transform: scaleX(.90) scaleY(1);    opacity: .78 }
  100% { transform: scaleX(1.06) scaleY(1.01); opacity: 1 }
}
.s-bath .bth-splash {
  transform-box: fill-box; transform-origin: 50% 50%;
  animation: e-bth-splash 2.9s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes e-bth-splash {
  0%   { opacity: .45; transform: translateY(3%) scale(.94) }
  100% { opacity: .95; transform: translateY(-3%) scale(1) }
}
.s-bath .bth-rip {
  transform-box: fill-box; transform-origin: 50% 50%;
  animation: e-bth-rip 9s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes e-bth-rip {
  0%   { transform: translateX(-8%) scaleX(.9);  opacity: .38 }
  100% { transform: translateX(8%)  scaleX(1.06); opacity: .8 }
}
.s-bath .bth-rip2 { animation-duration: 11s;  animation-delay: -3s }
.s-bath .bth-rip4 { animation-duration: 12s;  animation-delay: -8s }
.s-bath .bth-rip5 { animation-duration: 8.4s; animation-delay: -2s }

.s-bath .bth-cleo {

  animation-play-state: paused;
}

}
.s-bath .bth-swaya, .s-bath .bth-swayb {
  transform-box: fill-box; transform-origin: 50% 100%;

}

@keyframes e-bth-sway {
  0%   { transform: rotate(-.9deg) }
  100% { transform: rotate(.9deg) }
}

.page.live .s-bath .bth-open,
.page.live .s-bath .bth-land,
.page.live .s-bath .bth-motes i,
.page.live .s-bath .bth-pour,
.page.live .s-bath .bth-splash,
.page.live .s-bath .bth-rip,
.page.live .s-bath .bth-cleo,

.s-bath .bth-vig {
  position: absolute; inset: 0; z-index: 8; pointer-events: none;
  background:
    linear-gradient(to bottom, rgba(var(--shade), .30) 0%, rgba(var(--shade), 0) 16%),
    radial-gradient(92% 66% at 46% 66%,
      rgba(var(--shade), 0) 40%, rgba(var(--shade), .22) 80%, rgba(var(--shade), .48) 100%);
