/* ───────────────────────────────────────────────────────────────────
   2 · .s-triumph — "She will not be paraded."

   A street in Rome in 29 BCE with the crowd on both sides of us: the
   far bank of onlookers at 74%, the near bank at 86% drawn as the
   backs of heads, so the reader is standing in it. The procession
   runs between them — standards, an eagle, legionaries, the lictors
   with their fasces, the four-horse chariot — and carried through
   the middle of it, the effigy. Nobody is in chains, because nobody
   was: what Rome paraded was a wooden queen on a couch with a snake
   on her arm.

   Same art-box discipline as .s-bath, pinned to ~26–33% of the
   viewport, street plane welded to it as a child.
   ─────────────────────────────────────────────────────────────────── */

.s-triumph {
  --shade: 62, 47, 74;
  --hot: 255, 240, 214;
  /* The near bank builds every figure out of one shape in <defs>, and
     a stylesheet cannot reach inside a <use> shadow tree — but a custom
     property inherits into it. So the three colours the shared shapes
     need live here, as tokens, rather than as unreachable classes. */
  --n-veil: #DFCCAA;
  --n-hat:  #9A6B00;
  --n-ink:  #2E2334;
  /* Same reason: the rank of soldiers holding the route open is one
     shape in <defs> used forty-odd times over. */
  --t-pole:    #8A6B45;
  --t-steel:   #9AA3AE;
  --t-crimson: #A81F38;
  --t-skin:    #C08152;
  --stone: #E8D8BE;
  --stone-lo: #C9B091;
  background: #E2CBA9;
}

.s-triumph .tri-sky {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom,
    #EFD9B4 0%, #F6E7C9 26%, #FBF1DA 52%, #F2E0C1 74%, #DDC29F 100%);
}
/* The end of the route, over-bright: everything is walking into it. */
.s-triumph .tri-glare {
  position: absolute; inset: 0;
  background: radial-gradient(40% 24% at 50% 70%,
    rgba(255, 252, 240, .72) 0%, rgba(255, 244, 214, .30) 42%, rgba(255, 240, 214, 0) 100%);
}

/* The Capitol, at the far end of it and above it. */
/* Laurel swagged across the route, which is how it was dressed. It
   lives above the caption and gives the top third something to be. */
.s-triumph .tri-swag {
  position: absolute; left: 0; right: 0; top: 15%; height: 17%;
  opacity: .72;
}
.s-triumph .tri-swag svg { width: 100%; height: 100%; display: block; overflow: visible }
.s-triumph .tri-rope  { fill: none; stroke: #1F7A72; stroke-width: 5.6; stroke-linecap: round; opacity: .34 }
.s-triumph .tri-garl  { fill: none; stroke: #4E8F72; stroke-width: 4; stroke-linecap: round;
                        stroke-dasharray: 5 2.4 }
.s-triumph .tri-garl2 { fill: none; stroke: #8FDCA8; stroke-width: 2.2; stroke-linecap: round;
                        stroke-dasharray: 3.4 3; opacity: .8 }
.s-triumph .tri-rib   { fill: none; stroke: #A81F38; stroke-width: 1.5; stroke-linecap: round; opacity: .85 }

/* The flanks of the street. Their bases are masked away into the
   haze rather than ending on a line, so they can never disagree with
   the street plane, which is welded to a differently-sized box. */
.s-triumph .tri-col {
  position: absolute; top: 42%; height: 36%; width: 19%;
  opacity: .40;
  -webkit-mask-image:
    linear-gradient(to bottom, transparent 0, #000 14%, #000 50%, rgba(0,0,0,.3) 80%, transparent 100%);
          mask-image:
    linear-gradient(to bottom, transparent 0, #000 14%, #000 50%, rgba(0,0,0,.3) 80%, transparent 100%);
}
.s-triumph .tri-col-l { left: 0 }
.s-triumph .tri-col-r { right: 0 }
/* soften the inner edge so the flank does not end on a hard line */
.s-triumph .tri-col-l svg { -webkit-mask-image: linear-gradient(90deg, #000 62%, transparent 100%);
                                    mask-image: linear-gradient(90deg, #000 62%, transparent 100%) }
.s-triumph .tri-col-r svg { -webkit-mask-image: linear-gradient(270deg, #000 62%, transparent 100%);
                                    mask-image: linear-gradient(270deg, #000 62%, transparent 100%) }
.s-triumph .tri-col svg { width: 100%; height: 100%; display: block }
.s-triumph .tri-blk    { fill: #C2A585 }
.s-triumph .tri-blk-hi { fill: #E7D4B7 }
.s-triumph .tri-arch   { fill: #7E6753 }
.s-triumph .tri-win    { fill: #8E7660; opacity: .7 }

.s-triumph .tri-haze {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom,
    rgba(var(--hot), 0) 48%,
    rgba(var(--hot), .26) 68%,
    rgba(var(--hot), .08) 80%,
    rgba(var(--hot), 0) 90%);
}

/* ── the art box ──────────────────────────────────────────────── */
.s-triumph .tri-art {
  position: absolute; left: 50%; bottom: 12%;
  width: min(110%, 56vh); aspect-ratio: 84 / 50;
  transform: translateX(-50%);
}
.s-triumph .tri-art svg { position: relative; width: 100%; height: 100%; display: block; overflow: visible }

/* 22 of the viewBox's 50 units — the far kerb. */
.s-triumph .tri-street {
  position: absolute; left: -300%; right: -300%; top: 44%; height: 340%;
  background: linear-gradient(to bottom,
    #D5BE9C 0%, #C9AF8B 22%, #B79975 58%, #9C8065 100%);
}
.s-triumph .tri-kerb {
  position: absolute; left: -300%; right: -300%; top: 44%; height: 1.3%;
  background: linear-gradient(90deg,
    rgba(var(--shade), .18), rgba(255, 250, 236, .5) 50%, rgba(var(--shade), .18));
}

.s-triumph .tri-sh    { fill: rgba(62, 47, 74, .17) }
.s-triumph .tri-skin  { fill: #C08152 }
.s-triumph .tri-t-e   { fill: #CDAE8B }

/* ── the far bank ───────────────────────────────────────────────
   One path, one tone. Distance is drawn by taking things AWAY: no
   faces, no arms, no colour, and no line between one head and the
   head beside it. It is a ridge the near people stand in front of,
   not a second cast. Also one SVG node instead of a hundred and
   twenty, which is the cheapest thing in the scene. */
.s-triumph .tri-far { fill: #9B8A90 }

/* ── the near bank ──────────────────────────────────────────────
   The reverse of it: these are the people we are standing among, so
   they carry the colour, the height differences, the postures and
   the faces. Every part of it is a static shape — the whole bank
   moves on the one transform it already had, nothing in it animates
   on its own and nothing in it filters. */
.s-triumph .tri-n-sk1 { fill: #C08152 }
.s-triumph .tri-n-sk2 { fill: #9E6540 }
.s-triumph .tri-n-sk3 { fill: #D2946A }
.s-triumph .tri-n-hair   { fill: #2E2334 }
.s-triumph .tri-n-hair-g { fill: #6E6070 }
.s-triumph .tri-n-a { fill: #A8462F }   /* coral-deep, in shade */
.s-triumph .tri-n-b { fill: #256B66 }   /* teal-deep            */
.s-triumph .tri-n-c { fill: #8A6417 }   /* butter-deep          */
.s-triumph .tri-n-d { fill: #5C4691 }   /* lilac-deep           */
.s-triumph .tri-n-e { fill: #8E2438 }   /* crimson              */
.s-triumph .tri-n-f { fill: #4E6070 }   /* steel, darkened      */
.s-triumph .tri-n-g { fill: #497F5E }   /* mint, darkened       */
.s-triumph .tri-n-h { fill: #CDBA9C }   /* parchment, in shade  */
.s-triumph .tri-n-m1 { fill: #8E2438 }
.s-triumph .tri-n-m2 { fill: #5C4691 }
.s-triumph .tri-n-arm { fill: none; stroke-width: 1.9; stroke-linecap: round }
.s-triumph .tri-n-arm.tri-n-sk1 { stroke: #C08152 }
.s-triumph .tri-n-arm.tri-n-sk2 { stroke: #9E6540 }
.s-triumph .tri-n-arm.tri-n-sk3 { stroke: #D2946A }
.s-triumph .tri-toga  { fill: #FAF2E2 }
.s-triumph .tri-crimson { fill: #A81F38 }
.s-triumph .tri-gold  { fill: #FFD36E }
.s-triumph .tri-steel { fill: #9AA3AE }
.s-triumph .tri-pole  { fill: #8A6B45 }
.s-triumph .tri-poleb { fill: #8A6B45 }
.s-triumph .tri-fasc  { fill: #B08A55 }
.s-triumph .tri-cord  { fill: #6E5230 }
.s-triumph .tri-purple{ fill: #7A1B34 }
.s-triumph .tri-lau   { fill: #6FBF8C }
.s-triumph .tri-crown { fill: none; stroke: #FFD36E; stroke-width: 1.1; stroke-linecap: round }

.s-triumph .tri-armline  { fill: none; stroke: #C08152; stroke-width: 1.5; stroke-linecap: round }
.s-triumph .tri-armline2 { fill: none; stroke: #C08152; stroke-width: 1.7; stroke-linecap: round }

.s-triumph .tri-hb     { fill: #7E5B3C }
.s-triumph .tri-hb-lo  { fill: #5E4229 }
.s-triumph .tri-hb-hi  { fill: #916B48 }
.s-triumph .tri-hb2    { fill: #A0785A }
.s-triumph .tri-hb2-lo { fill: #7E5B3C }
.s-triumph .tri-hb2-hi { fill: #B08A6A }
.s-triumph .tri-plume  { fill: #A81F38 }
.s-triumph .tri-wreath2{ fill: none; stroke: #FFD36E; stroke-width: .75 }
.s-triumph .tri-tail  { fill: none; stroke: #4E3722; stroke-width: 1.2; stroke-linecap: round }

.s-triumph .tri-carb    { fill: #C69A46 }
.s-triumph .tri-carb-hi { fill: rgba(255, 247, 237, .5) }
.s-triumph .tri-yoke    { fill: none; stroke: #8A6B45; stroke-width: 1 }
.s-triumph .tri-wheel   { fill: #8A6B45 }
.s-triumph .tri-wheel-in{ fill: #C69A46 }
.s-triumph .tri-spokes path { stroke: #C69A46; stroke-width: .8; fill: none }

/* The effigy. The only thing in the frame at full strength. */
.s-triumph .tri-halo {
  fill: rgba(255, 252, 240, .62);
  filter: blur(.45vmin);
  animation: e-tri-halo 9s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes e-tri-halo { 0% { opacity: .55 } 100% { opacity: 1 } }
.s-triumph .tri-couch    { fill: #6B4E30 }
.s-triumph .tri-couch-hi { fill: #8A6941 }
.s-triumph .tri-cloth    { fill: #A81F38 }
.s-triumph .tri-mantle   { fill: #C33F55 }
.s-triumph .tri-cush     { fill: #FFD36E }
.s-triumph .tri-eff      { fill: #FFF7ED; stroke: rgba(62, 47, 74, .30); stroke-width: .3 }
.s-triumph .tri-eff-skin { fill: #E8C49E; stroke: rgba(62, 47, 74, .30); stroke-width: .3 }
.s-triumph .tri-eff-hair { fill: #3E2F4A }
/* Painted on the wood, in the same flat idiom as everyone else. */
.s-triumph .tri-eff-eye   { fill: #3E2F4A }
.s-triumph .tri-eff-mouth { fill: none; stroke: #3E2F4A; stroke-width: .42;
                            stroke-linecap: round; opacity: .8 }
.s-triumph .tri-eff-arm  { fill: none; stroke: #E8C49E; stroke-width: 1.5; stroke-linecap: round }
.s-triumph .tri-serp     { fill: none; stroke: #2E2334; stroke-width: 1.05; stroke-linecap: round }
.s-triumph .tri-serp-h   { fill: #2E2334 }

/* Depth, the right way round. Aerial perspective puts saturation and
   detail at the front and flattens what is far off — so the far bank
   is washed back into the haze and the near bank is at full strength.
   It used to be the other way about. */
.s-triumph .tri-crowdback { opacity: .38 }
.s-triumph .tri-line      { opacity: .72 }
.s-triumph .tri-crowdnear { opacity: 1 }

/* ── motion. Nothing arrives. It breathes, sways, and stays. ───── */
.s-triumph .tri-proc {
  transform-box: fill-box; transform-origin: 50% 100%;
  animation: e-tri-drift 46s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes e-tri-drift { 0% { transform: translateX(-.7%) } 100% { transform: translateX(.7%) } }

.s-triumph .tri-bobA, .s-triumph .tri-bobB,
.s-triumph .tri-bobC, .s-triumph .tri-bobD {
  transform-box: fill-box; transform-origin: 50% 100%;
  animation: e-tri-bob 2.4s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes e-tri-bob { 0% { transform: translateY(1.1%) } 100% { transform: translateY(-1.1%) } }
.s-triumph .tri-bobB { animation-duration: 2.6s; animation-delay: -1.1s }
.s-triumph .tri-bobC { animation-duration: 2.2s; animation-delay: -.7s }
.s-triumph .tri-bobD { animation-duration: 2.8s; animation-delay: -1.6s }

.s-triumph .tri-litter {
  transform-box: fill-box; transform-origin: 50% 100%;
  animation: e-tri-rock 3.4s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes e-tri-rock {
  0%   { transform: translateY(.7%) rotate(-.45deg) }
  100% { transform: translateY(-.7%) rotate(.45deg) }
}

.s-triumph .tri-vex {
  transform-box: fill-box; transform-origin: 50% 0;
  animation: e-tri-vex 4.6s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes e-tri-vex { 0% { transform: rotate(-4.5deg) } 100% { transform: rotate(4.5deg) } }

.s-triumph .tri-crowdnear {
  transform-box: fill-box; transform-origin: 50% 100%;
  animation: e-tri-near 5.8s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes e-tri-near {
  0%   { transform: translateY(.5%) scaleX(.999) }
  100% { transform: translateY(-.5%) scaleX(1.001) }
}
.s-triumph .tri-crowdback {
  transform-box: fill-box; transform-origin: 50% 100%;
  animation: e-tri-back 13s ease-in-out infinite alternate;
  animation-play-state: paused;
}
/* Transform only. It used to breathe its opacity as well, which meant
   repainting a path the width of three viewports on every frame for a
   change of about six percent on something already at .38 — invisible,
   and the most expensive thing in the scene. */
@keyframes e-tri-back {
  0%   { transform: translateX(-.25%) }
  100% { transform: translateX(.25%) }
}

/* The half-step of unreality: a warm bleach that comes and goes, so
   the whole parade reads as imagined rather than recorded. */
.s-triumph .tri-bleach {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(64% 34% at 50% 76%,
      rgba(255, 250, 236, .18) 0%, rgba(255, 250, 236, 0) 100%),
    linear-gradient(to bottom,
      rgba(255, 250, 236, 0) 56%,
      rgba(255, 250, 236, .13) 74%,
      rgba(255, 250, 236, 0) 94%);
  animation: e-tri-bleach 21s ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes e-tri-bleach { 0% { opacity: .5 } 100% { opacity: 1 } }

.page.live .s-triumph .tri-proc,
.page.live .s-triumph .tri-bobA,
.page.live .s-triumph .tri-bobB,
.page.live .s-triumph .tri-bobC,
.page.live .s-triumph .tri-bobD,
.page.live .s-triumph .tri-litter,
.page.live .s-triumph .tri-vex,
.page.live .s-triumph .tri-halo,
.page.live .s-triumph .tri-crowdnear,
.page.live .s-triumph .tri-crowdback,
.page.live .s-triumph .tri-bleach { animation-play-state: running }

.s-triumph .tri-vig {
  position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(to bottom, rgba(var(--shade), .26) 0%, rgba(var(--shade), 0) 18%),
    linear-gradient(90deg,
      rgba(var(--shade), .30) 0%, rgba(var(--shade), 0) 16%,
      rgba(var(--shade), 0) 84%, rgba(var(--shade), .30) 100%),
    radial-gradient(96% 70% at 50% 62%,
      rgba(var(--shade), 0) 42%, rgba(var(--shade), .22) 80%, rgba(var(--shade), .46) 100%);
}

/* ==========================================================================
   Factbox reader — ambient sound
   The control, and nothing else. No layout is owned here: every rule below is
   `position:fixed`, so this file can be added to or removed from the build
   without moving a single pixel of the deck.

   It borrows the shell's glass-pill language on purpose. The sources pill sits
   top-left; this is its mirror image top-right, same height, same glass, same
   press. Two affordances, one visual family, nothing bolted on.
   ========================================================================== */

.fb-sound{
  position:fixed;
  right:12px;
  /* Same rail as the sources pill. Fallback repeats shell.css's definition so
     this file also works standalone in the scene harness. */
  top:var(--top-safe, calc(env(safe-area-inset-top, 0px) + 12px));
  z-index:7;                       /* over the rail (6) and the sources pill (5) */

  appearance:none;-webkit-appearance:none;
  font:inherit;cursor:pointer;
  /* Icon only, so a circle. The words came off because this control sits over
     a painting, and "Sound off" set in bold beside a speaker is a caption
     competing with the picture for the one thing the page is for. */
  min-height:var(--tap, 44px);width:var(--tap, 44px);
  display:inline-flex;align-items:center;justify-content:center;
  padding:0;
  border-radius:var(--pill, 999px);
  border:1px solid rgba(255,255,255,.3);
  background:rgba(var(--veil, 20,16,24),.42);
  -webkit-backdrop-filter:blur(16px) saturate(1.2);
  backdrop-filter:blur(16px) saturate(1.2);
  color:rgba(255,255,255,.94);
  font-size:.8rem;font-weight:700;letter-spacing:.01em;
  transition:background .2s ease, border-color .2s ease,
             transform .12s ease, opacity .3s ease;
}
.fb-sound:active{transform:scale(.96)}
.fb-sound:focus-visible{outline:2px solid var(--butter,#FFD36E);outline-offset:3px}

.fb-sound .ico{
  width:17px;height:17px;flex:none;display:block;
  color:rgba(255,255,255,.8);
  transition:color .25s ease;
}
.fb-sound .ico svg{width:100%;height:100%;display:block;overflow:visible}
.fb-sound .ico .wav,
.fb-sound .ico .cut{transition:opacity .22s ease}
.fb-sound .ico .wav{opacity:0}
.fb-sound .ico .cut{opacity:1}

/* ---- on ---------------------------------------------------------------- */
.fb-sound.is-on{
  border-color:rgba(255,122,92,.55);
  background:rgba(var(--veil, 20,16,24),.5);
}
.fb-sound.is-on .ico{color:var(--coral,#FF7A5C)}
.fb-sound.is-on .ico .wav{opacity:1}
.fb-sound.is-on .ico .cut{opacity:0}

/* ---- loading ------------------------------------------------------------
   Between the tap and the first sound there is a fetch. On cellular that can
   be a second or two of nothing, which is exactly the moment a reader decides
   the page is broken — so the waves breathe while it is in flight. */
.fb-sound.is-busy .ico .wav{animation:fb-breathe 1.15s ease-in-out infinite}
@keyframes fb-breathe{0%,100%{opacity:1}50%{opacity:.25}}

/* ---- one gentle look at me, on the title beat only, then never again ---- */
.fb-sound.is-fresh{animation:fb-notice 2.4s ease-in-out 1.2s 2}
@keyframes fb-notice{
  0%,100%{box-shadow:0 0 0 0 rgba(255,211,110,0)}
  45%    {box-shadow:0 0 0 5px rgba(255,211,110,.16)}
}

/* ---- dead: no audio shipped, or the fetch failed ------------------------
   It says so once, then takes itself off the page rather than sitting there
   as a button that does nothing. */
.fb-sound.is-dead{
  pointer-events:none;
  color:rgba(255,255,255,.72);
  border-color:rgba(255,255,255,.18);
}
.fb-sound.is-dead .ico{color:rgba(255,255,255,.5)}
.fb-sound.is-gone{opacity:0;transform:translateY(-4px)}

/* --------------------------------------------------------------------------
   The note.

   One line of glass under the pill. It exists for one job: iOS mutes web audio
   when the hardware silent switch is on, there is no API that can detect it,
   and a reader who taps Sound and hears nothing concludes the page is broken.
   So the moment sound actually starts we say where to look, once per device.
   -------------------------------------------------------------------------- */
.fb-sound-note{
  position:fixed;
  right:12px;
  top:calc(var(--top-safe, calc(env(safe-area-inset-top, 0px) + 12px)) + var(--tap, 44px) + 8px);
  z-index:7;
  max-width:min(17em, calc(100vw - 24px));
  padding:.6em .85em;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(var(--veil, 20,16,24),.72);
  -webkit-backdrop-filter:blur(18px) saturate(1.2);
  backdrop-filter:blur(18px) saturate(1.2);
  color:rgba(255,255,255,.88);
  font-size:.74rem;font-weight:600;line-height:1.4;letter-spacing:.005em;
  text-align:right;
  pointer-events:none;
  opacity:0;transform:translateY(-6px);
  transition:opacity .3s ease, transform .3s cubic-bezier(.2,.75,.25,1);
}
.fb-sound-note.on{opacity:1;transform:none}

/* --------------------------------------------------------------------------
   Reduced motion. The shell reads it as "no animation"; we read it as a hint
   about this reader in general — so the control stops drawing attention to
   itself, and the beds play quieter (that part lives in audio.js).
   Sound stays available: an explicit tap is still an explicit tap.
   -------------------------------------------------------------------------- */
html.no-motion .fb-sound,
html.no-motion .fb-sound .ico .wav{animation:none}
html.no-motion .fb-sound.is-busy{opacity:.72}
html.no-motion .fb-sound-note{transition:opacity .01s linear;transform:none}
@media (prefers-reduced-motion: reduce){
  .fb-sound,.fb-sound .ico .wav{animation:none}
  .fb-sound.is-busy{opacity:.72}
  .fb-sound-note{transition:opacity .01s linear;transform:none}
}

/* Very short viewports (landscape phone). The button is icon-only at every
   width now, so only the note gives ground. */
@media (max-height:420px){
  .fb-sound-note{font-size:.7rem}
}

<!-- 9 · THE COPIES ────────────────────────────────────────────────

     papyrus came down. A copyist at his desk with the account open in
     front of him — a specific man, at a specific remove, writing — and
     behind him the rank he is copying from: each codex copied from the
     one in front of it and worse for it, a word gone, a line gone, a
     line written back in somebody else's ink, until the far ones are
     only a suggestion. Past the last of them a gap with a scuff on the
     plane and nothing standing in it: the source nobody can name.
     The moving thing is the transmission. A pulse travels back down
     the rank and gives out before it reaches the gap. -->

<!-- 11 · THE VIALS ────────────────────────────────────────────────
     Not a still life of equipment — the room, and what the poison
     argument actually claims happened in it.

     The place is her mausoleum: she had a tomb built for herself by
     the temple of Isis, moved the treasure into it and shut herself
     in, and that is where she died (Plutarch, Antony 74–85). So: a
     stone chamber with grave goods stacked against the wall and a
     barred door the guards had to break, cold daylight showing round
     its edges. Her on the couch in royal regalia with a small vessel
     at her lips; Iras collapsed at the foot of it; Charmion kneeling
     at the head, still setting the diadem straight — the two deaths
     that make one snake hard to believe. The physician's table stands
     to one side: vials, mortar, a folded paper of powder. That is the
     card's argument — a court with physicians had quieter options.

     Nobody is slipping out of a door. Every ancient account has this
     as her own act; the argument is only about the means.

     One lamp, and its flame is the only thing moving. The room draws
     its own floor as over-wide rects with `overflow:visible`, so the
     floor line can never drift off the feet of the people on it. -->

<!-- 1 · THE BATH ──────────────────────────────────────────────────
     "She bathes. She dresses in royal robes. She eats a final meal."

     Ptolemaic Alexandria, 30 BCE — a Greek court in an Egyptian
     palace, so: a built basin of plastered masonry sunk into the
     floor with a step down into it. Not a Roman bathhouse, not a tub
     with taps. Every drop was carried in and poured out of a vessel,
     which is why the jars are half the picture: two hydriai standing
     on the floor, and a third tipped over her shoulder.
     Plutarch has her bathe, dine and then dress before the end, and
     names the two women who stayed to the finish — Iras and Charmion
     — so she is not alone in here, and the one on the right is
     already holding what she puts on next: the robe, with the diadem
     lying folded on top of it. The meal is the bowl of figs and the
     cup, set down on the rim within reach.

     THE LIGHT. The old scene put a shaft on the floor that its own
     window could not have thrown. Here the opening is at 62–79% ×
     13–26% of the scene, and the shaft is clipped in that same
     percentage space, its two long edges leaving the two jambs at

     same box, so a change of viewport stretches them together and
     the beam cannot come loose from its window.
     ─────────────────────────────────────────────────────────────── -->

<!-- 2 · THE TRIUMPH ───────────────────────────────────────────────
     "She will not be paraded."

     The picture is the thing she is refusing — and the honest version
     of it, which is stranger than chains. She was never marched: she
     died first, which is the whole point of the card. Octavian held
     the triumph anyway, in Rome, in 29 BCE, and Cassius Dio (51.21.8)
     says "an effigy of the dead Cleopatra upon a couch was carried
     by, so that in a way she, too, together with the other captives…
     was a part of the spectacle and a trophy." Plutarch and
     Propertius — who stood on the Via Sacra and watched it go past —
     put the snakes on that effigy. So the first image of Cleopatra
     with a serpent on her arm was a float in her enemy's parade,
     made by the side that beat her, for a procession she cheated by
     dying. Card 12's tapestry rhymes with this one.

     So: a real street with the crowd on both sides of us — the far
     bank at 75%, the near bank at 86% drawn as the backs of heads,
     because the reader is standing in it. The route dressed with
     laurel, soldiers holding the line, the standards and the eagle,
     the lictors with their fasces leading, the team and the chariot
     with the triumphator under his crown. And carried shoulder-high
     through the middle of it, a wooden queen on a couch with a snake
     on her arm. Nobody is in chains, because nobody was.

     Pitched a half-step unreal — bleached, breathing, drifting and
     never arriving — because this is a future being imagined, not a
     thing that happened.
     ─────────────────────────────────────────────────────────────── -->

/* --------------------------------------------------------------------------
   Reduced motion. Set before first paint so scenes never animate a frame they
   should not have. The scenes read `html.no-motion`.
   -------------------------------------------------------------------------- */
(function () {
  var mq = window.matchMedia("(prefers-reduced-motion: reduce)");
  var apply = function () { document.documentElement.classList.toggle("no-motion", mq.matches); };
  apply();
  mq.addEventListener ? mq.addEventListener("change", apply) : mq.addListener(apply);
})();

/* --------------------------------------------------------------------------

   in-app webview whose chrome hides and shows as they scroll — which resizes
   the viewport by 40-90px mid-swipe. If `.page` height tracked that live,
   every page in a mandatory-snap stack would reflow under the reader's thumb
   and the browser would re-resolve the snap target, jumping them to a
   different beat. So: measure once on first paint, pin it, and only re-pin on
   a real orientation change — then restore the beat they were on.
   -------------------------------------------------------------------------- */
/* Arms the caption animation. Until this lands, captions are plain visible,
   so a script that fails or is still parsing never leaves a blank card. */
document.documentElement.classList.add("js");

var pinnedH = 0, pinnedW = 0;
/* Measure only to detect a real orientation change. The height itself comes
   from `100dvh` in CSS — pinning a px value here is what produced a deck
   shorter than the screen, with the body showing through beneath it. */
function pinHeight() {
  pinnedH = window.innerHeight;
  pinnedW = window.innerWidth;
}
pinHeight();

/* Same link, random story. Sticky per visitor so a reload doesn't reshuffle
   and ruin the read. */
const KEYS = Object.keys(STORIES);
let slug = new URLSearchParams(location.search).get("s");
if (!KEYS.includes(slug)) {
  try { slug = sessionStorage.getItem("fb-story"); } catch (e) { slug = null; }
  if (!KEYS.includes(slug)) slug = KEYS[Math.floor(Math.random() * KEYS.length)];
}
try { sessionStorage.setItem("fb-story", slug); } catch (e) {}
const STORY = STORIES[slug];
if (STORY.title) document.title = STORY.title;

/* Where completion + signups go. Empty until the site is on its own domain
   and a real endpoint exists — see the note in the handover. */
const ENDPOINT = "";
function track(event, extra) {
  const payload = Object.assign({ event, story: slug, t: Date.now() }, extra || {});
  if (!ENDPOINT) { console.info("[factbox]", payload); return; }
  try {
    navigator.sendBeacon(ENDPOINT, new Blob([JSON.stringify(payload)], {type:"application/json"}));
  } catch (e) {}
}

/* -------------------------------------------------------------------------- */

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const deck = document.getElementById("deck");
const rail = document.getElementById("rail");
const bank = document.getElementById("scene-bank");

/* Lift a scene out of the bank by its class. A beat whose scene has not been
   built yet still composes — it gets a neutral night ground instead. */
function takeScene(name) {
  const found = bank && bank.querySelector("." + name);
  if (found) {
    /* Clone rather than move: two beats may hold the same shot. */
    const node = found.cloneNode(true);
    node.classList.add("scene");            /* belt and braces, per contract */
    node.setAttribute("aria-hidden", "true");
    return node;
  }
  const ph = document.createElement("div");
  ph.className = "scene scene-missing " + name;
  ph.setAttribute("aria-hidden", "true");
  return ph;
}

/* Caption elements animate in sequence: headline, then the supporting line a
   beat later, then everything under it. */
function stage(cap) {
  let d = 0.06;
  [...cap.children].forEach(el => {
    el.classList.add("rise");
    el.style.setProperty("--d", d.toFixed(2) + "s");
    d += 0.12;
  });
}

function buildPage(c, i) {
  const page = document.createElement("section");
  page.className = "page";
  page.dataset.i = i;

  page.appendChild(takeScene(c.scene));

  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.setAttribute("aria-hidden", "true");
  page.appendChild(scrim);

  const wrap = document.createElement("div");
  wrap.className = "capwrap";
  const cap = document.createElement("div");
  cap.className = "cap";

  if (c.result) page.dataset.result = "1";

  let inner = c.result
    ? `<div class="verdict"></div><h2 class="hl">${esc(c.h)}</h2>`
    : `<h2 class="hl">${esc(c.h)}</h2>`;
  if (c.b) inner += `<p class="sub">${esc(c.b)}</p>`;

  if (c.tl) inner += '<div class="tl">' + c.tl.map(([w, x]) =>
      `<div class="row"><span class="when">${esc(w)}</span><span class="what">${esc(x)}</span></div>`).join("") + "</div>";

  if (c.relic) inner += `<div class="relic"><div class="obj">${esc(c.relic.obj)}</div>` +
      `<div class="prov">${esc(c.relic.prov)}</div><div class="proves">${esc(c.relic.proves)}</div></div>`;

  if (c.q) inner += '<div class="q"><div class="opts">' + c.q.options.map((o, n) =>
      `<button class="opt" type="button" data-n="${n}"><span class="mark"></span>${esc(o)}</button>`).join("") +
      `</div><div class="reveal">${esc(c.q.reveal)}</div></div>`;

  if (c.note) inner += `<div class="note">${esc(c.note)}</div>`;

  cap.innerHTML = inner;
  stage(cap);
  wrap.appendChild(cap);
  page.appendChild(wrap);

  /* Sources. Every card cites where it came from — that is the product. It
     lives as a pill on the picture that raises a sheet over the scene, so it
     costs the full-bleed look one small affordance and nothing else. */
  if (c.src) {
    const btn = document.createElement("button");
    btn.className = "srcbtn";
    btn.type = "button";
    btn.setAttribute("aria-expanded", "false");
    btn.innerHTML = `${c.src.length} source${c.src.length > 1 ? "s" : ""} <span class="chev">▲</span>`;

    const sheet = document.createElement("div");
    sheet.className = "sheet";
    sheet.innerHTML = '<div class="grab"></div><h3>Sources</h3>' +
      (c.credit ? `<p class="credit">${esc(c.credit)}</p>` : "") +
      `<ol>${c.src.map(s => `<li>${s}</li>`).join("")}</ol>`;

    page.appendChild(btn);
    page.appendChild(sheet);
  }

  if (i === 0) {
    const hint = document.createElement("div");
    hint.className = "hint";
    hint.setAttribute("aria-hidden", "true");
    hint.innerHTML = '<span class="arrow"></span><span>Swipe up</span>';
    page.appendChild(hint);
  }

  return page;
}

STORY.cards.forEach((c, i) => {
  deck.appendChild(buildPage(c, i));
  rail.appendChild(document.createElement("i"));

/* Park the shelf mid-row. Starting at the left edge reads as a list that
   happens to be cut off; starting in the middle reads as a row you can push
   either way, which is what it is. No smooth behaviour — this is the initial
   position, not a movement the reader should see. */
(function () {
  var shelf = end.querySelector(".shelf");
  if (!shelf) return;
  var centre = function () {
    var over = shelf.scrollWidth - shelf.clientWidth;
    if (over <= 0) return;                       /* they all fit; leave it */
    var card = shelf.querySelector(".shelfcard");
    if (!card) { shelf.scrollLeft = Math.round(over / 2); return; }
    /* Land on a cover boundary. Half a painting at the left edge is the thing
       that reads as broken, and rounding to the pitch costs nothing. */
    var pitch = card.getBoundingClientRect().width + 10;   /* + gap */
    shelf.scrollLeft = Math.round(over / 2 / pitch) * pitch;
  };
  centre();
  /* Covers are lazy, so the row's width is not final on the first frame. */
  requestAnimationFrame(centre);
  setTimeout(centre, 400);
  addEventListener("orientationchange", function () { setTimeout(centre, 250); });
})();

/* --------------------------------------------------------------------------

   -------------------------------------------------------------------------- */
deck.addEventListener("click", e => {
  const s = e.target.closest(".srcbtn");
  if (s) {
    const sheet = s.parentElement.querySelector(".sheet");
    const open = !sheet.classList.contains("on");
    sheet.classList.toggle("on", open);
    s.setAttribute("aria-expanded", String(open));
    if (open) track("sources_open");
    return;
  }

  /* Tap the sheet's own backdrop area — i.e. anywhere on the scene — to close. */
  if (!e.target.closest(".sheet")) {
    const openSheet = e.target.closest(".page") && e.target.closest(".page").querySelector(".sheet.on");
    if (openSheet) {
      openSheet.classList.remove("on");
      const b = openSheet.parentElement.querySelector(".srcbtn");
      if (b) b.setAttribute("aria-expanded", "false");
    }
  }

  const o = e.target.closest(".opt");
  if (o && !o.parentElement.classList.contains("done")) {
    const wrap = o.parentElement;
    const page = o.closest(".page");
    const card = STORY.cards[Number(page.dataset.i)];
    const correct = card.q.correct;
    wrap.classList.add("done");
    [...wrap.children].forEach((b, n) => {
      b.classList.add(n === correct ? "right" : "wrong");
      b.querySelector(".mark").textContent = n === correct ? "✓" : (b === o ? "×" : "");
    });
    const got = Number(o.dataset.n) === correct;
    track("answered", { correct: got });

    /* Carry the verdict to the next beat and go there. The pause is long
       enough to see which option was yours and no longer. */
    const i = [...deck.children].indexOf(page);
    const res = deck.children[i + 1];
    if (res && res.dataset.result === "1") {
      res.querySelector(".verdict").textContent = got ? "Correct." : "Not quite.";
      res.classList.toggle("was-right", got);
      res.classList.toggle("was-wrong", !got);
    }
    setTimeout(() => goToBeat(i + 1), 620);
  }
});

/* --------------------------------------------------------------------------
   `.live` — the class the whole build turns on. The scenes run their
   animation only while their page carries it, so at most one scene is moving.
   It also drives the caption choreography and the progress rail.
   -------------------------------------------------------------------------- */
const pages = [...deck.children];
let deepest = 0;
let current = 0;

const io = new IntersectionObserver(entries => {
  entries.forEach(en => {
    en.target.classList.toggle("live", en.isIntersecting);
    if (!en.isIntersecting) return;
    const i = pages.indexOf(en.target);
    current = i;
    [...rail.children].forEach((d, n) => d.classList.toggle("on", n === i));
    if (i > deepest) {
      deepest = i;
      if (i === 1) track("started");
      if (i === pages.length - 1) track("reached_end");
    }
  });
}, { threshold: 0.6 });
pages.forEach(p => io.observe(p));

/* Start the first page on the next frame rather than waiting for the
   observer's first tick — the opening scene is painted, the headline rises
   into it, and nothing above the fold waits on anything heavy. */
[...rail.children][0].classList.add("on");
requestAnimationFrame(() => pages[0].classList.add("live"));

/* --------------------------------------------------------------------------
   Teach the gesture once, then never again.
   -------------------------------------------------------------------------- */
let hint = deck.querySelector(".hint");
deck.addEventListener("scroll", () => {
  if (hint && deck.scrollTop > 30) {
    hint.classList.add("out");
    const h = hint; hint = null;
    setTimeout(() => h.remove(), 320);
  }
}, { passive: true });

/* --------------------------------------------------------------------------
   Re-pin on a real orientation change only, and keep the reader on their beat.
   A webview hiding its chrome changes innerHeight by a few dozen px and must
   be ignored; a rotation swaps width and height.
   -------------------------------------------------------------------------- */
let repin;
window.addEventListener("resize", () => {
  /* Only a rotation matters. A webview hiding its chrome resizes the
     viewport constantly; dvh already absorbs that, and reacting to it is
     what threw the reader off their beat. */
  if (window.innerWidth === pinnedW) return;
  clearTimeout(repin);
  repin = setTimeout(() => {
    const i = current;
    pinHeight();
    /* Snap can land anywhere after a reflow — put them back where they were. */
    deck.style.scrollBehavior = "auto";
    deck.scrollTop = i * deck.clientHeight;
    requestAnimationFrame(() => { deck.style.scrollBehavior = ""; });
  }, 160);
});

if (bank && bank.parentNode) bank.parentNode.removeChild(bank);

track("open");

/* --------------------------------------------------------------------------
   Keyboard, and a guaranteed way forward.

   Scroll-snap plus a caption that can scroll means a drag does not always
   reach the deck — and on a desktop with a mouse there is no swipe at all.
   Arrow keys, page keys, space and Home/End all move a whole beat, which is
   also the accessible way through: the deck is focusable so a keyboard user
   can reach it at all.
   -------------------------------------------------------------------------- */
function beatIndex() {
  const h = deck.clientHeight || 1;
  return Math.round(deck.scrollTop / h);
}
function goToBeat(i) {
  const n = deck.children.length - 1;
  const t = Math.max(0, Math.min(n, i));
  deck.scrollTo({ top: t * deck.clientHeight, behavior: "smooth" });
}

deck.tabIndex = 0;
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "button" ||
      tag === "a" || tag === "select" || e.target.isContentEditable) return;

  const k = e.key;
  let d = 0;
  if (k === "ArrowDown" || k === "PageDown" || k === " " || k === "Spacebar") d = 1;
  else if (k === "ArrowUp" || k === "PageUp") d = -1;
  else if (k === "Home") { e.preventDefault(); goToBeat(0); return; }
  else if (k === "End")  { e.preventDefault(); goToBeat(1e4); return; }
  else return;

  e.preventDefault();
  goToBeat(beatIndex() + d);
});


/* ==========================================================================
   Factbox reader — ambient sound

   One looping bed per scene, crossfaded as `.live` moves down the deck. Off by
   default, one tap to turn on, one tap to turn off, remembered across beats and
   reloads. If the audio files are not on the server it is a silent no-op and
   the control removes itself.

   Owns: this file, audio.css, and the two elements it creates on <body>.
   Touches nothing the shell or the scenes own. It reads exactly one thing from
   them — the `.live` class on `.page`, which is the contract — and one thing
   from the DOM: the `s-*` class on that page's `.scene`, which is how a beat
   names its bed. Nothing here knows the story data, so new beats and new
   stories need no change in here beyond a row in BEDS.

   ---------------------------------------------------------------------------
   Why Web Audio and not <audio>

   The whole job is crossfading, and crossfading means animating gain:

   1. iOS Safari ignores `HTMLMediaElement.volume`. Setting it from script is a
      no-op on iPhone — the hardware volume is the only volume. A `<audio>`
      crossfade is therefore not merely janky on the platform that is ~all of
      our traffic, it does not exist. A GainNode is honoured everywhere.
   2. `<audio loop>` re-buffers at the loop point and audibly gaps. An
      AudioBufferSourceNode with `loop = true` is sample-exact, which is the
      difference between an ambience and a stutter every twenty seconds.
   3. Gain ramps are scheduled on the audio thread, so a crossfade does not
      wobble when the main thread is busy — and the main thread is busy exactly
      when a fade happens, because the reader is mid-scroll-snap.

   The cost is that a bed is decoded to PCM in memory, so the beds are short,
   mono and low-bitrate, at most three are kept decoded (see CACHE_MAX), and
   the context runs at 32 kHz. A bed costs about 3 MB decoded and ~120 KB over
   the wire.
   ========================================================================== */

(function () {
  "use strict";

  /* ------------------------------------------------------------------------
     The beds.

     Keyed by the scene class, not by beat index — which is what makes the
     "hold, don't restart" requirement fall out for free. Beats 2 and 3 are both
     s-fleet, so moving between them resolves to the same bed and the code below
     does nothing at all: the sea keeps rolling across the cut. Same for any
     other pair of adjacent beats that share a scene.

     There are more scene classes here than the current thirteen beats use.
     That is deliberate and it is the cheap direction to be wrong in: a mapped
     scene that no beat carries costs nothing at all (its bed is never
     requested, because beds are fetched by what is on screen), whereas an
     unmapped scene silently holds the previous bed. s-afternoon and s-scroll
     are kept for exactly that reason — s-bath, s-letter and s-search took over
     what s-afternoon and s-scroll used to cover twice each, and if a beat is
     ever moved back, it still sounds.

     `gain` is the bed's level relative to the master. It exists because these
     are field recordings with different natural loudnesses, and mastering them
     to a common level by ear is not something the code can do for you.

     Two of them are not levelling and should not be "corrected" to match the
     others. s-search is 0.50 because the aftermath of a search is supposed to
     be the quietest thing in the story — it is normalised to −26 LUFS like
     every other bed, because a bed encoded quiet is a bed encoded noisy at
     48 kbps, and it is made quiet here instead. s-triumph is 1.00 and
     s-harbour was pulled back to 0.86 underneath it so that the triumph is
     the loudest moment in the read — but most of what makes it feel like the
     loudest moment is that it has ~7 dB more energy above 500 Hz than
     anything either side of it, which is the part a phone speaker actually
     reproduces. It should land as "the room got busier", not "the volume
     went up".
     ------------------------------------------------------------------------ */
  var BASE = "/audio/";
  var BEDS = {
    /* title, a shut door in near-dark      */ "s-door":      { file: "door.mp3",            gain: 0.90 },
    /* Actium, and the year after it        */ "s-fleet":     { file: "sea.mp3",             gain: 1.00 },
    /* the fleet enters the Great Harbour   */ "s-harbour":   { file: "harbour-arrival.mp3", gain: 0.86 },
    /* she will not be paraded through Rome */ "s-triumph":   { file: "triumph.mp3",         gain: 1.00 },
    /* the bathing room, her last day       */ "s-bath":      { file: "bath.mp3",            gain: 0.80 },
    /* the letter to Octavian               */ "s-letter":    { file: "letter.mp3",          gain: 0.75 },
    /* the question, and the verdict        */ "s-coil":      { file: "coil.mp3",            gain: 0.85 },
    /* the room after the guards searched   */ "s-search":    { file: "search.mp3",          gain: 0.50 },
    /* the scriptorium that copied Plutarch */ "s-copies":    { file: "copies.mp3",          gain: 0.80 },
    /* the asp under the basket of figs     */ "s-basket":    { file: "basket.mp3",          gain: 0.85 },
    /* the physician's table                */ "s-mausoleum":     { file: "vials.mp3",           gain: 0.70 },
    /* weavers put the snake in anyway      */ "s-painting":  { file: "gallery.mp3",         gain: 0.75 },
    /* Alexandria at dusk                   */ "s-pharos":    { file: "harbour.mp3",         gain: 1.00 },

    /* Kept from the eight-scene cut. As the new scenes land these stop being
       carried by any beat; until then they still are, and either way it
       sounds. See above. */
    /* a still small interior               */ "s-scroll":    { file: "scroll.mp3",          gain: 0.80 },
    /* a fountain in the court, cicadas     */ "s-afternoon": { file: "palace.mp3",          gain: 0.85 }
  };
  /* The closing beat has no scene class, and an unmapped beat holds whatever is
     already playing rather than cutting to silence — so the harbour carries
     through the ending, which is what it should do anyway. */

  /* ---- tuning ----------------------------------------------------------- */
  /* The master was 0.50 / 0.32 and the beds were heard as "a little loud,
     make it a bit quieter so it's not the main focus". Halved. The target is
     that a reader is not aware of the sound until they think about it, which
     is a different thing from being able to hear it — every bed is still well
     above its own noise floor at 0.26, and the relative balance between them
     is untouched, because halving the master moves all fifteen by the same
     5.7 dB and cannot change how they sit against each other.

     One bed did not survive that uniformly: `search` is a near-silence by
     design, and 5.7 dB below a near-silence is a bed that reads as a failed
     download. Its own gain was raised to compensate — see BEDS above. That is
     the rule to follow if this number is ever lowered again: move the bed that
     falls off the bottom, not the master. */
  var LEVEL      = 0.26;   /* master, sound on                                */
  var LEVEL_CALM = 0.17;   /* master under prefers-reduced-motion             */
  var TAU        = 0.55;   /* crossfade time constant, seconds — see ramp()   */
  var STOP_AFTER = 2800;   /* ms after a fade-out before the voice is freed   */
  var CACHE_MAX  = 3;      /* decoded beds held at once                       */
  var HEAD_TRIM  = 0.05;   /* seconds skipped at the loop head — see play()   */
  var TAIL_TRIM  = 0.10;   /* seconds skipped at the loop tail                */

  var K_ON   = "fb-sound";       /* "on" | "off"                              */
  var K_HINT = "fb-sound-hint";  /* the silent-switch note, shown once ever   */

  /* ------------------------------------------------------------------------
     Bail out silently on anything that cannot possibly work. No control, no
     listeners, no console noise — a page that never offered sound.
     ------------------------------------------------------------------------ */
  var AC = window.AudioContext || window.webkitAudioContext;
  var deck = document.getElementById("deck");
  if (!AC || !window.fetch || !window.Promise || !window.MutationObserver || !deck) return;

  var mq = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
  function calm() {
    return (mq && mq.matches) ||
           document.documentElement.classList.contains("no-motion");
  }
  function level() { return calm() ? LEVEL_CALM : LEVEL; }

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function recall(k)   { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function forget(k)   { try { localStorage.removeItem(k); } catch (e) {} }

  /* ------------------------------------------------------------------------
     State
     ------------------------------------------------------------------------ */
  var ctx = null, master = null;
  var buffers = {}, failed = {}, loading = {}, lru = [];
  var voices  = {};                 /* key -> { gain, src, kill }             */
  var on = false;                   /* sound is on and the context is live    */
  var armed = false;                /* remembered "on", waiting for a gesture */
  var dead = false;                 /* nothing to play; control retired       */
  var everLoaded = false, probed = false, hinted = !!recall(K_HINT);
  var liveKey = null;
  var hideTimer = 0, noteTimer = 0;
  var unwake = function () {};      /* set below if a choice was remembered   */

  /* ------------------------------------------------------------------------
     Engine
     ------------------------------------------------------------------------ */
  function makeCtx() {
    if (ctx) return ctx;
    try {
      /* 32 kHz: these are ambiences, nothing above 16 kHz survives a 48 kbps
         mono encode anyway, and it cuts the decoded footprint by a third.
         Older Safari throws on an unsupported rate, hence the plain retry. */
      ctx = new AC({ sampleRate: 32000, latencyHint: "playback" });
    } catch (e) {
      try { ctx = new AC(); } catch (e2) { return null; }
    }
    master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);
    return ctx;
  }

  /* A crossfade wants equal power, and the textbook answer is
     setValueCurveAtTime with a cosine pair. It is the wrong answer here: a
     reader flicking through beats fires overlapping fades, and a curve that
     overlaps a scheduled event throws, mid-story, on the audio thread.
     setTargetAtTime cannot collide — it always starts from wherever the value
     actually is right now and approaches exponentially. Two uncorrelated
     ambient beds crossfaded exponentially dip by well under a decibel in the
     middle, which nobody has ever heard. Robustness wins. */
  function ramp(param, target) {
    var t = ctx.currentTime;
    try {
      if (param.cancelAndHoldAtTime) param.cancelAndHoldAtTime(t);
      else param.cancelScheduledValues(t);
      param.setValueAtTime(param.value, t);
    } catch (e) {}
    try { param.setTargetAtTime(target, t, TAU); }
    catch (e) { try { param.value = target; } catch (e2) {} }
  }

  /* Least-recently-wanted, with the wrinkle that a bed which is currently
     sounding is never evicted however old it is. Bounded by one pass so a deck
     where everything is in use cannot spin. */
  function touch(key) {
    var i = lru.indexOf(key);
    if (i >= 0) lru.splice(i, 1);
    lru.push(key);
    for (var n = lru.length; n > 0 && lru.length > CACHE_MAX; n--) {
      var old = lru.shift();
      if (!voices[old] && old !== liveKey) delete buffers[old];
      else lru.push(old);
    }
  }

  function load(key) {
    if (!key || !BEDS[key] || !ctx) return Promise.resolve(null);
    if (buffers[key]) { touch(key); return Promise.resolve(buffers[key]); }
    if (failed[key])  return Promise.resolve(null);      /* never retried     */
    if (loading[key]) return loading[key];

    var p = fetch(BASE + BEDS[key].file, { credentials: "omit" })
      .then(function (r) {
        if (!r.ok) throw new Error("http " + r.status);
        return r.arrayBuffer();
      })
      .then(function (buf) {
        return new Promise(function (res, rej) {
          /* Safari before 14 only has the callback form and returns undefined;
             everything else also returns a promise. Both are wired up. */
          var out = ctx.decodeAudioData(buf, res, rej);
          if (out && out.then) out.then(res, rej);
        });
      })
      .then(function (b) {
        buffers[key] = b; everLoaded = true; touch(key); return b;
      })
      .catch(function () { failed[key] = 1; return null; })
      .then(function (b) { delete loading[key]; return b; });

    loading[key] = p;
    return p;
  }

  function play(key) {
    var bed = BEDS[key], buf = buffers[key];
    if (!bed || !buf || !ctx) return;

    var v = voices[key];
    if (v) {                       /* still fading out — catch it and lift it */
      if (v.kill) { clearTimeout(v.kill); v.kill = 0; }
      ramp(v.gain.gain, bed.gain);
      return;
    }

    var g = ctx.createGain();
    g.gain.value = 0;
    g.connect(master);

    var s = ctx.createBufferSource();
    s.buffer = buf;
    s.loop = true;
    /* MP3 decoding adds encoder delay at the head and padding at the tail, and
       no browser strips it consistently — looping the whole buffer therefore
       ticks once per lap. Looping inside the file steps over both. The beds are
       built noise-like precisely so this small jump has nothing tonal to
       break; see AUDIO.md. */
    s.loopStart = Math.min(HEAD_TRIM, buf.duration * 0.02);
    s.loopEnd   = Math.max(s.loopStart + 0.5, buf.duration - TAIL_TRIM);
    s.connect(g);
    try { s.start(0, s.loopStart); } catch (e) { try { s.start(0); } catch (e2) { return; } }

    voices[key] = { gain: g, src: s, kill: 0 };
    ramp(g.gain, bed.gain);
  }

  function fade(key) {
    var v = voices[key];
    if (!v || v.kill) return;
    ramp(v.gain.gain, 0);
    v.kill = setTimeout(function () {
      try { v.src.stop(); } catch (e) {}
      try { v.src.disconnect(); v.gain.disconnect(); } catch (e) {}
      delete voices[key];
    }, STOP_AFTER);
  }

  function fadeAllBut(key) {
    for (var k in voices) if (k !== key) fade(k);
  }

  /* ------------------------------------------------------------------------
     Which bed a beat wants
     ------------------------------------------------------------------------ */
  function keyOf(page) {
    if (!page) return null;
    var sc = page.querySelector(".scene");
    if (!sc) return null;
    var cl = sc.classList;
    for (var i = 0; i < cl.length; i++) if (BEDS[cl[i]]) return cl[i];
    return null;
  }
  function livePage() { return deck.querySelector(".page.live"); }

  function nextKeyAfter(page) {
    var n = page && page.nextElementSibling;
    while (n) { var k = keyOf(n); if (k) return k; n = n.nextElementSibling; }
    return null;
  }
  function anyOtherKey(not) {
    var pages = deck.children;
    for (var i = 0; i < pages.length; i++) {
      var k = keyOf(pages[i]);
      if (k && k !== not) return k;
    }
    return null;
  }

  function go(key) {
    if (!key) return;                 /* unmapped beat: hold, do not go quiet */
    fadeAllBut(key);
    if (buffers[key]) { play(key); afterFirstSound(); }
    else load(key).then(function (b) {
      if (!b || !on || liveKey !== key) return;
      play(key);
      afterFirstSound();
    });
    var nxt = nextKeyAfter(livePage());
    if (nxt && nxt !== key) load(nxt);          /* one beat of read-ahead     */
  }

  /* The observer fires on any class change under the deck — a sheet opening, an
     answer being marked — so this stays cheap and returns early. Between beats
     there is briefly no `.live` page at all; holding the current bed through
     that gap is what stops the sound flickering on every swipe. */
  function sync() {
    var k = keyOf(livePage());
    if (!k || k === liveKey) return;
    liveKey = k;
    if (on) go(k);
  }
  new MutationObserver(sync).observe(deck, {
    subtree: true, attributes: true, attributeFilter: ["class"]
  });
  sync();
  requestAnimationFrame(sync);        /* the shell sets the first .live in rAF */

  /* ------------------------------------------------------------------------
     On / off
     ------------------------------------------------------------------------ */
  function turnOn() {
    if (dead) return;
    unwake();
    if (!makeCtx()) { retire("Sound unavailable"); return; }
    on = true; armed = false;
    store(K_ON, "on");
    paint();

    var r; try { r = ctx.resume && ctx.resume(); } catch (e) {}
    if (r && r.catch) r.catch(function () {});

    ramp(master.gain, level());
    if (!liveKey) liveKey = keyOf(livePage());
    go(liveKey);
    probe();
  }

  function turnOff() {
    unwake();
    on = false; armed = false;
    store(K_ON, "off");
    paint();
    if (!ctx) return;
    ramp(master.gain, 0);
    setTimeout(function () {
      if (on) return;
      for (var k in voices) {
        var v = voices[k];
        if (v.kill) clearTimeout(v.kill);
        try { v.src.stop(); } catch (e) {}
        try { v.src.disconnect(); v.gain.disconnect(); } catch (e) {}
        delete voices[k];
      }
      try { ctx.suspend(); } catch (e) {}          /* stop burning CPU        */
    }, 900);
  }

  /* ------------------------------------------------------------------------
     "The page must work with no audio files present at all."

     It does — but a button that silently does nothing is worse than no button,
     so the first time sound is asked for we try the current bed and one other.
     If both fail and nothing has ever decoded, the folder is empty (or the
     host is serving HTML 404s) and the control says so and leaves. Two probes
     rather than one so that a single missing bed cannot retire the whole
     system.
     ------------------------------------------------------------------------ */
  function probe() {
    if (probed || everLoaded) return;
    probed = true;
    var a = liveKey || anyOtherKey(null);
    var b = anyOtherKey(a);
    Promise.all([load(a), load(b)]).then(function () {
      if (!everLoaded) retire("No sound available");
      else paint();                 /* drop the busy pulse once anything lands */
    });
  }

  function retire(msg) {
    dead = true; on = false; armed = false;
    forget(K_ON);                       /* do not re-arm on the next reload   */
    if (ctx) { try { ctx.close(); } catch (e) {} ctx = null; }
    btn.className = "fb-sound is-dead";
    say(msg, 2600);                     /* the label used to carry this       */
    btn.setAttribute("aria-disabled", "true");
    btn.removeAttribute("aria-pressed");
    setTimeout(function () {
      btn.classList.add("is-gone");
      setTimeout(function () {
        if (btn.parentNode) btn.parentNode.removeChild(btn);
        if (note.parentNode) note.parentNode.removeChild(note);
      }, 400);
    }, 2600);
  }

  /* ------------------------------------------------------------------------
     The silent switch.

     iOS mutes Web Audio when the hardware switch on the side of the phone is
     set to silent. There is no API that reports it: an AnalyserNode sees the
     graph, not the speaker, so the page cannot know. All we can do is make the
     one-second conclusion "this is broken" into "oh — the switch", the moment
     sound actually starts. Once per device, then never again.
     ------------------------------------------------------------------------ */
  var IOS = /iP(hone|od|ad)/.test(navigator.platform || "") ||
            /iPhone|iPad|iPod/.test(navigator.userAgent || "") ||
            (/Mac/.test(navigator.platform || "") && navigator.maxTouchPoints > 1);

  function afterFirstSound() {
    if (btn.classList.contains("is-busy")) paint();
    if (hinted) return;
    hinted = true;
    store(K_HINT, "1");
    say(IOS ? "Sound on. Hearing nothing? The silent switch on the side of your phone mutes this."
            : "Sound on. Hearing nothing? Check your device volume.", 5600);
  }

  function say(msg, ms) {
    note.textContent = msg;
    note.classList.add("on");
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { note.classList.remove("on"); }, ms);
  }

  /* ------------------------------------------------------------------------
     The control
     ------------------------------------------------------------------------ */
  var btn = document.createElement("button");
  btn.type = "button";
  btn.className = "fb-sound is-off";
  btn.innerHTML =
    '<span class="ico" aria-hidden="true">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
           'stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M4 9.5h3.2L12 5.4v13.2L7.2 14.5H4z" fill="currentColor" stroke-width="1.6"/>' +
        '<g class="wav"><path d="M15.4 9.2a4 4 0 0 1 0 5.6"/><path d="M18.1 6.8a7.6 7.6 0 0 1 0 10.4"/></g>' +
        '<g class="cut"><path d="M16.2 9.8l4.4 4.4"/><path d="M20.6 9.8l-4.4 4.4"/></g>' +
      '</svg>' +
    '</span>';

  var note = document.createElement("div");
  note.className = "fb-sound-note";
  note.setAttribute("role", "status");
  note.setAttribute("aria-live", "polite");

  function paint() {
    var busy = (armed || (on && !everLoaded)) && !dead;
    btn.className = "fb-sound " + (on || armed ? "is-on" : "is-off") + (busy ? " is-busy" : "");
    /* The label states the state, not the action — "Sound off" is what is true
       right now. The button's accessible name says what a press will do. */
    /* No words — see css. The state still has a name for anyone who cannot
       see the icon: aria-pressed and aria-label, below. */
    btn.setAttribute("aria-pressed", String(on || armed));
    btn.setAttribute("aria-label", (on || armed) ? "Ambient sound is on. Turn it off."
                                                 : "Ambient sound is off. Turn it on.");
  }

  btn.addEventListener("click", function (e) {
    e.preventDefault();
    if (dead) return;
    if (on || armed) turnOff(); else turnOn();
  });

  paint();
  document.body.appendChild(btn);
  document.body.appendChild(note);

  /* ------------------------------------------------------------------------
     On by default.

     The story is written to be heard, so sound is on unless the reader turned
     it off — `recall(K_ON) !== "off"` rather than `=== "on"`.

     It still cannot start by itself. Every browser blocks audio until the page
     has had a real gesture, and iOS is strictest; nothing is fetched or decoded
     until then either. So the control shows the state it is about to be in and
     waits, busy, for the first touch — which on a deck you scroll is the
     reader's first swipe, a second in. A page that tried and failed would look
     exactly like a page that never tried, so it does not try.
     ------------------------------------------------------------------------ */
  if (recall(K_ON) !== "off") {
    armed = true;
    paint();
    var EVENTS = ["pointerdown", "touchend", "mousedown", "keydown"];
    var wake = function (e) {
      /* Not the button's own tap — that is a deliberate "off", and the click
         listener above owns it. */
      if (!armed || (e && e.target && e.target.closest && e.target.closest(".fb-sound"))) return;
      turnOn();
    };
    unwake = function () {
      armed = false;
      for (var i = 0; i < EVENTS.length; i++)
        document.removeEventListener(EVENTS[i], wake, true);
    };
    for (var i = 0; i < EVENTS.length; i++)
      document.addEventListener(EVENTS[i], wake, true);
  }

  /* ------------------------------------------------------------------------
     Leaving, coming back, and iOS interruptions (a call, another app taking
     the audio session). Nothing should ever be heard from a page the reader is
     no longer looking at.
     ------------------------------------------------------------------------ */
  document.addEventListener("visibilitychange", function () {
    if (!ctx) return;
    if (document.hidden) {
      ramp(master.gain, 0);
      hideTimer = setTimeout(function () { try { ctx.suspend(); } catch (e) {} }, 600);
    } else {
      clearTimeout(hideTimer);
      if (!on) return;
      var r; try { r = ctx.resume && ctx.resume(); } catch (e) {}
      if (r && r.catch) r.catch(function () {});
      ramp(master.gain, level());
    }
  });
  window.addEventListener("pagehide", function () {
    if (ctx) { try { ctx.suspend(); } catch (e) {} }
  });

  /* If the reader turns reduced motion on mid-read, follow it. */
  if (mq) {
    var reflect = function () { if (on && ctx) ramp(master.gain, level()); };
    mq.addEventListener ? mq.addEventListener("change", reflect) : mq.addListener(reflect);
  }
})();

</script>
