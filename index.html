<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Factbox · Five minutes of history a day</title>
<meta name="description" content="One history story a day, chosen by the date, told one card at a time on paintings from the world's museums.">
<!-- The paper ground, matching what body actually paints. It was the
     retired night value on all thirteen paper pages, which puts a
     near-black bar above a cream page in Android Chrome and iOS
     Safari. Only the four reader/story pages are #0E0B12. -->
<meta name="theme-color" content="#E7E0D3">
<!-- Icons. /favicon.ico is what a browser asks for with no link tag at all,
     so it is the one that must exist; the rest are the better versions for the
     places that look for them. The .ico packs 16, 32 and 48. Before these the
     site declared no icon anywhere and every cold load spent a request on a
     404 for /favicon.ico. -->
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/img/icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<!-- site.webmanifest's theme_color is #DCD5C8, the same cream the meta above
     declares and the same cream body paints. The three must not disagree. -->
<link rel="manifest" href="/site.webmanifest">
<link rel="canonical" href="https://factbox.app/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Factbox">
<meta property="og:title" content="Factbox · Five minutes of history a day">
<meta property="og:description" content="One history story a day, chosen by the date, told one card at a time on paintings from the world's museums.">
<meta property="og:image" content="https://factbox.app/img/share-home.jpg">
<meta property="og:url" content="https://factbox.app/">
<meta name="twitter:card" content="summary_large_image">

<!-- Discovery, not bandwidth. data/index.json is fetched by js/gate.js, which
     is a <script> the parser only reaches at the bottom of the body, so on a
     cold load the fetch used to start around 1100ms on a page whose HTML had
     arrived at 400ms. This link is in the head, so the preload scanner starts
     it in the first few milliseconds, alongside the stylesheet.

     The covers are deliberately NOT preloaded here. Which story is Today's
     Factbox depends on the date, so any six slots named in this file would be
     the right guess for one day and a wasted fetch on the other fifty. -->
<link rel="preload" href="/data/index.json" as="fetch" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Two families, one request. DM Sans is the whole site; Newsreader is the
     display serif css/app.css names as --display, and it sets exactly two
     things on this page - the headline and Today's hook. A token cannot
     fetch a font, so the page that uses it has to ask for it: without this
     line both fall to Georgia, which is the fallback in the token and is
     why the page is still readable if Google is blocked. Weights 400, 500
     and 600 because --w-display is 500 and a browser given only 500 will
     synthesise the other two rather than decline them.
     display=swap: the words are the product, so they appear immediately in
     the fallback instead of after a round trip on cellular. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/loader.js"></script>
<link rel="stylesheet" href="/css/today.css">
</head>
<body>

<!-- / and /explore are one page. They load the same module and render the same
     thing, because a reader arriving from Instagram is not choosing between
     browsing modes - they are deciding whether to read one story in the next
     five minutes. -->
<main class="lib today">
  <header class="mast">
    <!-- The wordmark is the way home: /explore is the shelf. The anchor sits
         inside the <p> so the header keeps the box, the margin and the baseline
         it already had, and so the target is the word rather than the width of
         the row. aria-label because a screen reader reading FACTBOX as all
         capitals may spell it; the accessible name is the product name.
     The tile is alt="" and inside the anchor: the word is right beside it,
     so a screen reader saying "Factbox logo Factbox" is worse than silent,
     and one lockup should be one target. width/height are on the tag so the
     masthead does not reflow when it lands — this is the first thing on the
     page. -->
    <p class="mark"><a href="/explore" aria-label="Factbox"><img src="/img/logo-96.png"
       alt="" width="24" height="24" decoding="async">FACTBOX</a></p>
    <nav class="tabs" aria-label="Sections">
      <!-- The Explore tab leads to this same experience, so it is the current
           one here too. There is no Home tab anywhere: the page you land on is
           the home page. -->
      <a href="/explore" aria-current="page">Explore</a>
      <a href="/library">Library</a>
      <span class="acct" id="fb-acct"></span></nav>
    <!-- The pitch is in the markup, not built by script, so this page has real
         words on it before any JavaScript runs and still has them if none ever
         does. js/today.js hides this pair for a reader who has read something,
         and greets them by their own numbers instead. -->
    <h1>Be disgustingly well-informed.</h1>
    <p id="tdy-blurb">Trade five minutes of scrolling for something worth remembering.</p>
  </header>

  <!-- The greeting slot. Empty for a first-time reader, whose greeting is the
       headline above; filled by js/today.js for anyone with reading memory. -->
  <div class="tdy-say" id="tdy-say"></div>

  <!-- Where js/progress.js mounts a restore-link or restore-failed panel.
       Empty on an ordinary visit; it only ever has content on the load that
       comes back from checkout, or after a broken restore link. /explore has
       carried this slot since it was written and `/` did not, so the same
       panel appeared in two different places on one page served at two
       URLs. Without it progress.js falls back to placing itself. -->
  <div id="fb-notice"></div>

  <div id="view">
    <!-- Filled by js/today.js. If the season cannot be fetched, that script
         writes visible copy here - never nothing. -->
    <div class="fbload">
      <div class="fbload-track" aria-hidden="true"><i class="fbload-fill"></i></div>
      <p class="fbload-say" role="status">Dusting off the archive…</p>
    </div>
  </div>
  <noscript><p class="fine" style="margin-top:24px">Factbox needs JavaScript to
  show today's story. Every story is listed on the
  <a href="/stories">season shelf</a>.</p></noscript>

  <p class="fine" style="margin-top:34px;text-align:center">
    <a href="/account">Account</a> · <a href="/credits">Artwork credits</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a> · <a href="/support">Support</a>
  </p>
</main>

<!-- Load order matters, and only in one place: progress.js MUST come before
     gate.js, because gate.js's claim() strips the query string at parse time
     and progress.js needs Stripe's session_id out of it first. explore.js is
     the subject names on window.FBTAX; today.js needs all of them and goes
     last. -->
<script src="/js/progress.js"></script>
<script src="/js/access.js"></script>
<script src="/js/gate.js"></script>
<script src="/js/explore.js"></script>
<script src="/js/today.js"></script>
<!-- js/auth.js is a module, so the browser defers it: it runs after the
     document is parsed and BEFORE DOMContentLoaded, whatever position this tag
     is in. js/acct.js reaches it through the whenFBU() bridge from AUTH.md. -->
<script type="module" src="/js/auth.js"></script>
<script src="/js/analytics.js"></script>
<script src="/js/acct.js"></script>
</body>
</html>
