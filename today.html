<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Factbox · Today</title>
<meta name="description" content="Browse all fifty-one Factbox stories by subject, by the kind of story they are, or by searching for a name.">
<meta name="theme-color" content="#0E0B12">
<link rel="canonical" href="https://factbox.app/today">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Factbox">
<meta property="og:title" content="Factbox · Explore">
<meta property="og:description" content="Browse all fifty-one Factbox stories by subject, by the kind of story they are, or by searching for a name.">
<meta property="og:image" content="https://factbox.app/img/share.jpg">
<meta property="og:url" content="https://factbox.app/explore">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/today.css">
<!-- The header's account control must not flash. This class makes its slot
     invisible without collapsing it, so the row keeps its height from the
     first paint and nothing shifts when auth finally answers. The timer
     removes it unconditionally: a script that never runs, or throws, still
     leaves a readable header rather than a hidden one. See css/app.css. -->
<script>
(function () {
  try {
    var h = document.documentElement;
    if (!h) return;
    h.className = (h.className ? h.className + " " : "") + "fb-hdr";
    setTimeout(function () {
      try { h.className = h.className.replace(/(^|\s)fb-hdr(\s|$)/g, " "); } catch (e) {}
    }, 4000);
  } catch (e) {}
})();
</script>
</head>
<body>

<main class="lib">
  <header class="mast">
    <p class="mark">FACTBOX</p>
    <!-- Two tabs. "Home" and "Explore" were two answers to one question and
         Explore was the better of them, so its shelves moved to the bottom of
         this page and the tab went. Account is one icon: from the reader's
         side "sign in" and "sign up" are the same errand, and the page behind
         it works out which of the two they need. -->
    <nav class="tabs" aria-label="Sections">
      <a href="/today" aria-current="page">Today</a>
      <a href="/library">Library</a>
      <span class="acct" id="fb-acct">
        <a class="acct-in td-acct" id="fb-acct-in" href="/login?next=today" aria-label="Sign in">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
               stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8.6" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>
        </a>
        <a class="acct-me td-acct" id="fb-acct-me" href="/account" aria-label="Account" hidden>
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
               stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8.6" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>
        </a>
      </span>
    </nav>
  </header>

  <!-- Real copy, replaced by the render. Never a blank shell: if every script
       below fails, this is still a page with words and a way out. -->
  <div id="td">
    <h1 class="td-h1">Be disgustingly well-informed.</h1>
    <p class="td-sub">Trade five minutes of scrolling for something worth
      remembering. <a href="/stories">Start with season one</a>.</p>
  </div>
</main>

<script src="/js/progress.js"></script>
<script src="/js/access.js"></script>
<script src="/js/gate.js"></script>
<script src="/js/today.js"></script>
<script>
(function () { try { FBT.boot("td"); } catch (e) {} })();
</script>
<script type="module" src="/js/auth.js"></script>
<script>
/* The header account control. ES5, every lookup guarded, and it cannot throw:
   the worst case is the signed-out pair staying on screen, which is what the
   markup already says. */
(function () {
  "use strict";

  function el(id) { try { return document.getElementById(id); } catch (e) { return null; } }
  var aIn = el("fb-acct-in"), aMe = el("fb-acct-me");

  function hide(n, on) { try { if (n) n.hidden = !!on; } catch (e) {} }
  function reveal() {
    try {
      var h = document.documentElement;
      if (h) h.className = h.className.replace(/(^|\s)fb-hdr(\s|$)/g, " ")
                                      .replace(/^\s+|\s+$/g, "");
    } catch (e) {}
  }

  /* A display name is text the reader typed, going straight into the header,
     so it is trimmed, capped and scrubbed before it reaches the DOM — the same
     rule the rest of the site follows: no error code, ever, on screen. */
  function label(FBU) {
    var s = "";
    try { s = String(FBU.name() || ""); } catch (e) {}
    if (!s) {
      var m = "";
      try { m = String(FBU.email() || ""); } catch (e2) {}
      var at = m.indexOf("@");
      s = at > 0 ? m.slice(0, at) : "";
    }
    s = s.replace(/\s+/g, " ").replace(/^\s+|\s+$/g, "");
    if (!s) return "Account";
    if (s.indexOf("auth/") !== -1) return "Account";
    if (s.indexOf("Firebase") !== -1 || s.indexOf("firebase") !== -1) return "Account";
    return s.length > 18 ? (s.slice(0, 17) + "\u2026") : s;
  }

  function paint(FBU) {
    var inNow = false;
    try { inNow = !!(FBU && FBU.signedIn()); } catch (e) {}
    if (inNow) {
      try { if (aMe) aMe.textContent = label(FBU); } catch (e) {}
      hide(aIn, true); hide(aMe, false);
    } else {
      hide(aMe, true); hide(aIn, false);
    }
    reveal();
  }

  function whenFBU(cb) {
    var done = false;
    function go() { if (done) return; done = true; try { cb(window.FBU || null); } catch (e) {} }
    if (window.FBU) { go(); return; }
    try { window.addEventListener("fbu-ready", go, false); } catch (e) {}
    try {
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", go, false);
      else setTimeout(go, 0);
    } catch (e) {}
    try { setTimeout(go, 4000); } catch (e) { go(); }
  }

  whenFBU(function (FBU) {
    /* No FBU at all — the file 404'd, or this webview ignores type="module".
       That is the signed-out header, which links to a page that explains it. */
    if (!FBU) { paint(null); return; }
    try { FBU.onReady(function () { paint(FBU); }); } catch (e) { paint(FBU); }
    try { FBU.onChange(function () { paint(FBU); }); } catch (e) {}
  });
})();
</script>
<script src="/js/analytics.js"></script>
</body>
</html>
