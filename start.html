<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Factbox · Start</title>
<meta name="description" content="History you'll actually remember. The world's most fascinating stories, explained in 5 minutes a day.">
<meta name="theme-color" content="#DCD5C8">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/img/icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<!-- /start is not a page of its own any more: the onboarding is /join, and
     this URL is a door to it. The canonical points there so the two do not
     compete for the same search result. -->
<link rel="canonical" href="https://factbox.app/join">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Factbox">
<meta property="og:title" content="Factbox · Start">
<meta property="og:description" content="History you'll actually remember. Five minutes a day.">
<meta property="og:image" content="https://factbox.app/img/share.jpg">
<meta property="og:url" content="https://factbox.app/join">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/join.css">
</head>
<body>

<!--
  /start — A DOOR, NOT A FLOW.

  WHAT HAPPENED HERE. This page used to be a six-question onboarding that
  stored its answers through window.FBA and then handed the reader to /join,
  which asked four more questions into the same record. Two flows, one store.
  A reader who came in through /firststory — which calls to action at
  /join?from=story, and always has — never saw this page at all; a reader who
  came in here answered "how much time have you got" twice.

  So there is one onboarding now and it is /join. The long version of why that
  URL rather than this one is at the top of js/start.js, which is still the
  engine and still where tools/check-analytics.js reads the instrumentation.

  WHY THIS FILE STILL EXISTS AND IS NOT A REDIRECT. Two reasons:

    * /privacy links to /start.html twice, describing what the opening
      questions collect. A URL named in the privacy policy has to resolve to
      something a reader can read.
    * A stub that bounces is the bug this site has already shipped once —
      "Sign in" led to a white screen reading "Moved to /login", because
      GitHub Pages resolves /foo to foo.html before foo/index.html and the
      stub redirected to its own clean URL. Nothing here redirects.

  So it is one real screen with one real door: the opening promise, and a
  button that goes to the questions. It works with JavaScript switched off,
  because the button is the submit control of a GET form and needs no script
  to navigate. `from=start` rides along so the funnel can tell this door apart
  from /firststory's.

  There is NO QUESTION on this page and nothing is stored by it.
-->

<main class="ob" id="st-main">

  <div class="ob-top">
    <p class="ob-mark">FACTBOX</p>
  </div>

  <div class="ob-stage">
    <section class="st-screen" id="sc-open" data-sc="open" aria-labelledby="sc-open-h">
      <div class="ob-centre">
        <h1 id="sc-open-h">History you&rsquo;ll actually remember.</h1>
        <p class="ob-sub">The world&rsquo;s most fascinating stories, explained
        in 5 minutes a day. A few quick questions and your feed is built.</p>
      </div>

      <form class="ob-act" action="/join" method="get">
        <input type="hidden" name="from" value="start">
        <button class="go" id="st-open-go" type="submit">Build my feed</button>
      </form>
    </section>
  </div>

</main>

<script src="/js/analytics.js"></script>
<script src="/js/acct.js"></script>
</body>
</html>
