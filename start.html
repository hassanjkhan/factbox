<!-- The header's account control must not flash. This class makes its slot
     invisible without collapsing it, so the row keeps its height from the
     first paint and nothing shifts when auth finally answers. The timer
     removes it unconditionally: a script that never runs, or throws, still
     leaves a readable header rather than a hidden one. See css/app.css. -->
<script>
(function () {
  try {
    var h = document.documentElement;
    if (!h) return;
    h.className = (h.className ? h.className + " " : "") + "fb-hdr";
    setTimeout(function () {
      try { h.className = h.className.replace(/(^|\s)fb-hdr(\s|$)/g, " "); } catch (e) {}
    }, 4000);
  } catch (e) {}
})();
</script>
</head>
<body>

<!-- Real first screen, not a shell. js/start.js replaces this the moment it
     runs; if it never does, this is still the opening question with every
     option on it and a link onward. §2.4: no page that renders empty. -->
<main class="st" id="st">
  <section class="st-panel is-on">
    <div class="st-spacer"></div>
    <h1 class="st-q">Remember history without studying it.</h1>
    <p class="st-sub">Five minutes a day. Addictive stories. The people,
      scandals, wars, and ideas you&rsquo;ll actually remember.</p>
    <div class="st-spacer"></div>
    <a class="go" href="/join" style="text-decoration:none">Get started</a>
    <p class="st-fine"><a href="/login?next=today">I already have an account</a></p>
  </section>
</main>
