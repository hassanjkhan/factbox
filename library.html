<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your library · Factbox</title>
<meta name="description" content="What you have read, what you are part-way through, and what you saved for later.">
<!-- The paper ground, matching what body actually paints. Verified against
     getComputedStyle(document.body).backgroundColor in real Chrome, not
     assumed: the site-wide repaint moved --ground #DCD5C8 -> #E7E0D3 and this
     meta did not come with it, which puts a bar of the OLD cream above the new
     one. Only the four reader/story pages are #0E0B12, and reader-rail.css
     still paints those, so they are unchanged. -->
<meta name="theme-color" content="#E7E0D3">
<!-- Icons. /favicon.ico is what a browser asks for with no link tag at all,
     so it is the one that must exist; the rest are the better versions for the
     places that look for them. The .ico packs 16, 32 and 48. Before these the
     site declared no icon anywhere and every cold load spent a request on a
     404 for /favicon.ico. -->
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/img/icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<!-- site.webmanifest's theme_color is #E7E0D3, the same cream the meta above
     declares and the same cream body paints. The three must not disagree. -->
<link rel="manifest" href="/site.webmanifest">
<!-- This page is different for every reader and empty for a crawler, so it is
     not worth indexing. The stories themselves are. -->
<meta name="robots" content="noindex">
<link rel="preload" href="/data/index.json" as="fetch" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/loader.js"></script>
<link rel="stylesheet" href="/css/library.css">

</head>
<body>

<main class="lib">
  <header class="mast">
    <!-- The wordmark is the way home: /explore is the shelf. The anchor sits
         inside the <p> so the header keeps the box, the margin and the baseline
         it already had, and so the target is the word rather than the width of
         the row. aria-label because a screen reader reading FACTBOX as all
         capitals may spell it; the accessible name is the product name. -->
    <p class="mark"><a href="/explore" aria-label="Factbox">FACTBOX</a></p>
    <nav class="tabs" aria-label="Sections">
      <a href="/explore">Explore</a>
      <a href="/library" aria-current="page">Library</a>
      <span class="acct" id="fb-acct"></span></nav>
    <h1>Your library</h1>
    <p>Where you got to, what you finished, and what you put aside.</p>
  </header>

  <div id="shelf" >
    <!-- Filled by js/library.js. If the season cannot be fetched, that script
         writes visible copy here — never nothing. -->
    <div class="fbload">
      <div class="fbload-track" aria-hidden="true"><i class="fbload-fill"></i></div>
      <p class="fbload-say" role="status">Finding where you left off…</p>
    </div>
  </div>

  <p class="fine" style="margin-top:34px;text-align:center">
    <a href="/account">Account</a> · <a href="/credits">Artwork credits</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a> · <a href="/support">Support</a>
  </p>
</main>

<!-- Load order matters, and only in one place: progress.js MUST come before
     gate.js, because gate.js's claim() strips the query string at parse time
     and progress.js needs Stripe's session_id out of it first. saves.js is
     independent of both; library.js needs all three and goes last. -->
<script src="/js/progress.js"></script>
<script src="/js/access.js"></script>
<script src="/js/gate.js"></script>
<script src="/js/saves.js"></script>
<script src="/js/library.js"></script>
<!-- js/auth.js is a module, so the browser defers it: it runs after the
     document is parsed and BEFORE DOMContentLoaded, whatever position this tag
     is in. The ES5 block below therefore cannot read window.FBU at the moment
     it runs, and does not — it uses the whenFBU() bridge from AUTH.md §2. -->
<script type="module" src="/js/auth.js"></script>

<script src="/js/analytics.js"></script>
<script src="/js/acct.js"></script>
</body>
</html>
