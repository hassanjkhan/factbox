<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your library · Factbox</title>
<meta name="description" content="What you have read, what you are part-way through, and what you saved for later.">
<meta name="theme-color" content="#0E0B12">
<!-- This page is different for every reader and empty for a crawler, so it is
     not worth indexing. The stories themselves are. -->
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/library.css">
<!-- The header's account control must not flash. This class makes its slot
     invisible without collapsing it, so the row keeps its height from the
     first paint and nothing shifts when auth finally answers. The timer
     removes it unconditionally: a script that never runs, or throws, still
     leaves a readable header rather than a hidden one. See css/app.css. -->
<script>
(function () {
  try {
    var h = document.documentElement;
    if (!h) return;
    h.className = (h.className ? h.className + " " : "") + "fb-hdr";
    setTimeout(function () {
      try { h.className = h.className.replace(/(^|\s)fb-hdr(\s|$)/g, " "); } catch (e) {}
    }, 4000);
  } catch (e) {}
})();
</script>
</head>
<body>

<main class="lib">
  <header class="mast">
    <p class="mark">FACTBOX</p>
    <nav class="tabs" aria-label="Sections">
      <a href="/">Explore</a>
      <a href="/library" aria-current="page">Library</a>
      <span class="acct" id="fb-acct"></span>
    </nav>
    <h1>Your library</h1>
  </header>

  <div id="shelf" >
    <!-- Filled by js/library.js. If the season cannot be fetched, that script
         writes visible copy here — never nothing. -->
    <p class="fine" style="text-align:left">Loading your library…</p>
  </div>

  <p class="fine" style="margin-top:34px;text-align:left">
    <a href="/account">Account</a> · <a href="/credits">Artwork credits</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a> · <a href="/support">Support</a>
  </p>
</main>

<!-- Load order matters, and only in one place: progress.js MUST come before
     gate.js, because gate.js's claim() strips the query string at parse time
     and progress.js needs Stripe's session_id out of it first. saves.js is
     independent of both; library.js needs all three and goes last. -->
<script src="/js/progress.js"></script>
<script src="/js/access.js"></script>
<script src="/js/gate.js"></script>
<script src="/js/saves.js"></script>
<script src="/js/library.js"></script>
<!-- js/auth.js is a module, so the browser defers it: it runs after the
     document is parsed and BEFORE DOMContentLoaded, whatever position this tag
     is in. The ES5 block below therefore cannot read window.FBU at the moment
     it runs, and does not — it uses the whenFBU() bridge from AUTH.md §2. -->
<script type="module" src="/js/auth.js"></script>
<script src="/js/acct.js"></script>
<script src="/js/analytics.js"></script>
</body>
</html>
