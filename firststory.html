<script>
(function () {
  var deck = document.getElementById("deck");
  var vrail = document.getElementById("vrail");

  /* Reading memory is a nice-to-have; the story is not. Losing progress.js must
     not cost the reader the words. */
  var P = window.FBP && FBP.mark ? FBP : null;

  /* Not URLSearchParams: it is absent on the older in-app webviews this site
     targets, and it sat on a top-level line, so its absence emptied the page. */
  var m = /[?&]s=([^&#]*)/.exec(location.search);
  var id = m ? decodeURIComponent(m[1].replace(/\+/g, " "))
             : String(window.FB_STORY || "");

  /* Which cards carry the second artwork. Nearly every card in a stack shares
     the hero plate, which is why a stack costs one image to read; the
     supplementary plates are spread across the interior so the middle of a
     long stack is not the same painting eight times. */
  function beat(c, plate, cap, cr, n, stack) {
    var cls = "beat is-" + (c.beat || "card").replace(/[^a-z]/gi, "")
            + (c.long ? " is-long" : "");
    var body = c.body
      ? "<p>" + FB.esc(c.body) + "</p>" : "";
    var cite = c.src
      ? '<p class="cite">' + FB.esc(c.src) + "</p>" : "";
    /* Six camera variants, cycled by card index, so consecutive cards never
       share a move — a stack of nine identical slow pushes reads as a stall
       rather than as motion. Deterministic, so it is the same on every reload. */
    return '' +
      '<section class="' + cls + '"' +
        ' data-stack="' + FB.esc(stack.id) + '"' +
        ' data-topic="' + FB.esc(stack.topic || "") + '"' +
        ' data-beat="' + FB.esc(c.beat || "") + '"' +
        ' data-card="' + n + '"' +
        ' data-cam="' + (n % 6) + '">' +
        '<div class="art">' +
          /* Only the first card ships with a src. Every other painting is
             held in data-plate until the window below reaches it — see
             "Paging the paintings". The fallback is carried on the element
             too, because by the time onerror fires the stack it belongs to
             is long out of scope. */
          '<img alt="" decoding="async"' +
            (n === 0 ? ' fetchpriority="high" src="/img/cards/' + FB.esc(plate) + '.webp"'
                     : ' data-plate="/img/cards/' + FB.esc(plate) + '.webp"') +
            ' data-fallback="/img/stacks/' + FB.esc(stack.img) + '.webp"' +
            ' onerror="this.onerror=null;this.src=this.getAttribute(\'data-fallback\')">' +
        '</div>' +
        '<div class="copy">' +
          '<h2>' + FB.esc(c.head) + '</h2>' + body + cite +
        '</div>' +
        '<p class="plate-credit">' + FB.creditLine(cap, cr) + '</p>' +
      '</section>';
  }

  /* ScrollToOptions on an element is iOS 14+. Below that the dictionary form
     resolves to NaN and scrolls to the top instead. */
  var SMOOTH = "scrollBehavior" in document.documentElement.style;
  function goTo(top) {
    var d = document.getElementById("deck");
    if (SMOOTH && d.scrollTo) d.scrollTo({ top: top, behavior: "smooth" });
    else d.scrollTop = top;
  }

  /* --------------------------------------------------------------------
     Sending the buyer back to the story they were reading.

     Stripe returns every buyer to
       https://factbox.app/stories?unlocked=1&session_id=...
     and that URL lives in the Stripe dashboard, not here (STRIPE.md 7).
     /stories forwards to /explore carrying the query string. So nothing on
     the return path is this file, and the only honest thing this page can do
     is write down where the reader was before handing them to checkout.

     Reading it back belongs on the page they land on. That is /explore, and
     this change does not own it, so TODAY THIS KEY IS WRITTEN AND NOTHING
     READS IT. The four lines that finish it, and where they go, are in
     tools/README.md under "Returning a buyer to their story".
     -------------------------------------------------------------------- */
  var RETURN_KEY = "fb_return_v1";
  function rememberStory(st) {
    try {
      if (!st || st.id == null) return;
      localStorage.setItem(RETURN_KEY,
        JSON.stringify({ s: String(st.id), at: Date.now() }));
    } catch (e) {}
  }

  /* The wall itself is built by js/recommend.js, which owns both it and the
     completion screen that leads to it, and which reads every price out of
     js/account.js. This is the fallback for a page whose recommend.js never
     arrived: the same two sentences, the same cover, a way in and a way out,
     and not one number it cannot price. */
  function paywallFallback(s) {
    return '' +
      '<section class="pane paywall pw">' +
        '<h2>Keep learning.</h2>' +
        '<p class="pw-sub">Your next story is already waiting.</p>' +
        '<div class="plate"><img alt="" src="/img/thumbs/' + FB.esc(s.img) + '.webp"' +
          ' data-fallback="/img/stacks/' + FB.esc(s.img) + '.webp"' +
          ' onerror="this.onerror=null;this.src=this.getAttribute(\'data-fallback\')"></div>' +
        '<p>' + FB.esc(s.title) + '</p>' +
        '<a class="go" href="/join?from=paywall&amp;s=' + encodeURIComponent(s.id) +
          '" role="button">Keep reading</a>' +
        '<a class="ghost" href="/explore">Back to stories</a>' +
      '</section>';
  }

  /* opts is passed straight through to FBR.paywall: where the reader came
     from, what "Maybe later" does, and what to remember before checkout. */
  function buildPaywall(s, from, later) {
    try {
      if (window.FBR && FBR.paywall) {
        return FBR.paywall(s, {
          from: from,
          onLater: later,
          onStart: function () { rememberStory(s); }
        });
      }
    } catch (e) {}
    return null;
  }

  /* Both the story list and the answer to "is this reader a subscriber".
     Deciding on the first alone is what sent a signed-in subscriber into the
     sign-up funnel: FB.unlocked() is synchronous and Firebase is not, so the
     paywall rendered before the account had answered, and a reader could tap
     through it before the correction landed.

     Capped, so a reader whose auth never resolves still gets the page rather
     than a spinner. Falling through to the paywall is the safe direction —
     it offers a way in; a blank screen offers nothing. */

  /* One module owns both the answer and when it is knowable. */
  function accessSettled() {
    try {
      if (window.FBX && FBX.ready) return FBX.ready();
    } catch (e) {}
    return new Promise(function (done) {
      var n = 0;
      var t = setInterval(function () {
        n++;
        try {
          if (window.FBX && FBX.ready) { clearInterval(t); FBX.ready().then(done, done); }
          else if (n > 35) { clearInterval(t); done(); }
        } catch (e) { clearInterval(t); done(); }
      }, 200);
    });
  }

  /* --------------------------------------------------------------------
     What has to be in hand before the first card can be read — and what
     does not.

     This was Promise.all([FB.load(), accessSettled()]): the entire 413KB
     corpus AND the access gate, both resolved, before a single word was
     drawn. Both were the wrong thing to wait for.

     The corpus: one story is 12KB. FB.loadStory() fetches only that, and
     falls back to the monolith if the split file is not there.

     The gate: two of the fifty-one stories are free, and they are the two
     every new reader arrives on. Nothing about a free story depends on who
     is asking, so a free story no longer waits for the account to answer at
     all. A locked story still waits — drawing its text before the gate has
     spoken is exactly the bug this wait exists to prevent, and it stays
     prevented.
     -------------------------------------------------------------------- */

  function notInSeason() {
    /* A wrong id used to replace() straight to the shelf, which also ate the
       back entry, so the reader could not undo their own typo. */
    deck.innerHTML =
      '<section class="pane"><h1>That story is not in this season.</h1>' +
      '<p>The link may be mistyped.</p>' +
      '<a class="ghost" href="/explore">All stories</a></section>';
  }

  function fin(host, fn) {
    try { if (window.FBLoad && FBLoad.done) { FBLoad.done(host, fn); return; } } catch (e) {}
    fn();
  }

  function showPaywall(s) {
    var pane = buildPaywall(s, "paywall", function () {
      location.href = "/explore";
    });
    fin(deck, function () {
      if (pane) { deck.innerHTML = ""; deck.appendChild(pane); }
      else deck.innerHTML = paywallFallback(s);
    });
    /* FBR.paywall reports its own view. Only the fallback has to. */
    if (!pane) FB.track("paywall_view", { stack: s.id });

    /* Belt and braces. If premium lands after the wait gave up — a slow
       snapshot, a cold Firestore, a phone that just woke up — the reader is
       looking at a wall they have already paid to pass. The wall is what was
       drawn, so that is what gets passed in; FBX.correct owns the rest, and
       owns it for every page, so this cannot become a reload loop the way
       the hand-rolled version on the shelf did. */
    try { if (window.FBX && FBX.correct) FBX.correct(false); } catch (e) {}
  }

  function render(s) {
    var io = null;

    /* One plate per card. The stack hero is only the fallback for a card the
       manifest did not cover, so a missing row degrades to the old behaviour
       rather than to an empty frame. */
    var html = s.cards.map(function (c, n) {
      return c.img ? beat(c, c.img, c.cap, c.cr, n, s)
                   : beat(c, s.img, s.cap, s.cr, n, s);
    }).join("");

    var h1 = document.createElement("h1");
    h1.className = "sr-title";
    h1.textContent = s.title;
    document.body.insertBefore(h1, document.body.firstChild);

    fin(deck, function () { deck.innerHTML = html; });
    FB.track("stack_open", { stack: s.id });

    /* Saving lives at the foot of the right edge, under the sound button, in
       the rail every app this reader arrives from puts it in. It used to sit
       beside the back button, top-left — the furthest point on the screen
       from the thumb holding the phone. The behaviour is unchanged: the same
       FBS.button(), the same bookmark, the same aria-pressed. Only the
       address is new. */
    var rail = document.getElementById("fb-rail");
    if (window.FBS) {
      var save = FBS.button(s.id, function (isSaved) {
        FB.track(isSaved ? "save_add" : "save_remove", { stack: s.id });
      }, s.title);
      if (save && rail) rail.appendChild(save);
    }

    /* Offer to pick up where they stopped rather than jumping there. A silent
       jump into the middle of a story is disorienting; an offer is not. */
    var chip = P && P.resumeChip && P.resumeChip(s.id, s.cards.length, function (card) {
      goTo(card * deck.clientHeight);
      FB.track("resume_used", { stack: s.id, card: String(card + 1) });
    });
    if (chip) {
      document.body.appendChild(chip);
      /* js/progress.js builds this chip's two buttons with no id and no class,
         so js/analytics.js's delegated click listener has nothing to name them
         by. Name them here, where the chip is known: the first already reports
         itself as resume_used above, the second -- "start from the beginning"
         -- has never been measured at all and now arrives as ui_click. */
      try {
        var chipBtns = chip.getElementsByTagName("button");
        if (chipBtns[0]) chipBtns[0].setAttribute("data-fbt", "-");
        if (chipBtns[1]) chipBtns[1].setAttribute("data-fbt", "resume_dismiss");
      } catch (e) {}
      deck.addEventListener("scroll", function once() {
        deck.removeEventListener("scroll", once);
        setTimeout(function () { try { chip.dismiss(); } catch (e) {} }, 2500);
      }, { passive: true });
    }

    /* Progress, and the drop-off card index — the number the CTO README says
       actually pays. Reported once per stack, at the deepest card reached. */
    /* `live` marks the card on screen. The motion, atmosphere and sound layers
       all key off it, and at most one card is ever animating or audible.

       The first card gets it on the next frame rather than waiting for the
       observer's first tick, and — the lesson from shipping a wordless page —
       nothing that can throw runs before this point. */
    /* Press and pull with a mouse moves the deck, the way a thumb does on a
       phone. Touch is untouched; see js/drag-deck.js. */
    try { if (window.FBDrag) FBDrag.attach(deck); } catch (e) {}

    var beats = [].slice.call(deck.querySelectorAll(".beat, .pane"));

    /* ----------------------------------------------------------------------
       Paging the paintings.

       A story is eight to thirteen cards and every card is a painting; the
       mean is 210KB and the worst is 449KB, so opening one used to mean
       committing to one to three megabytes of pictures the reader may never
       scroll to. The card text is not the problem and is not paged — the
       whole story's copy is about 12KB in one file, and splitting that into
       pages would cost more in round trips than it could ever save.

       So: card 0 has a src in the markup and is preloaded in the head. Every
       other painting waits in data-plate until the reader is within AHEAD
       cards of it, which keeps roughly two loading in front of them at all
       times — far enough that the next card is decoded before it is reached,
       near enough that reaching card three has never fetched card ten.

       Loaded plates are never unloaded. Coming back up a story you have just
       read should cost nothing, and an <img> whose src is removed is a blank
       frame the moment it scrolls back into view.
       ---------------------------------------------------------------------- */
    var AHEAD = 2;
    function page(from) {
      try {
        var i, hi = Math.min(beats.length - 1, from + AHEAD);
        /* One behind as well: scrolling back up must never show an empty
           frame, and it is one request, already in cache in the common case. */
        for (i = Math.max(0, from - 1); i <= hi; i++) {
          var img = beats[i] && beats[i].querySelector("img[data-plate]");
          if (!img) continue;
          img.src = img.getAttribute("data-plate");
          img.removeAttribute("data-plate");
          /* The card being read outranks the ones being fetched ahead of it. */
          try { img.setAttribute("fetchpriority", i === from ? "high" : "low"); } catch (e) {}
        }
      } catch (e) { pageEverything(); }
    }
    /* The escape hatch. If anything above throws, or no observer ever fires,
       a reader must not be left scrolling through empty frames — so every
       remaining plate is loaded outright. Slow beats broken. */
    function pageEverything() {
      try {
        var all = deck.querySelectorAll("img[data-plate]"), j;
        for (j = 0; j < all.length; j++) {
          all[j].src = all[j].getAttribute("data-plate");
          all[j].removeAttribute("data-plate");
        }
      } catch (e) {}
    }

    if (window.IntersectionObserver) {
      io = new IntersectionObserver(function (es) {
        for (var k = 0; k < es.length; k++) {
          es[k].target.classList.toggle("live", es[k].isIntersecting);
          if (es[k].isIntersecting) {
            var at = beats.indexOf(es[k].target);
            if (at > -1) page(at);
          }
        }
      }, { threshold: 0.55 });
      for (var b = 0; b < beats.length; b++) io.observe(beats[b]);
      page(0);
      /* A card that is 55% on screen is what marks live, and a reader who
         never quite gets one there — a short last card, an odd viewport —
         would page nothing. Scroll is the coarser, always-true signal. */
      deck.addEventListener("scroll", function () {
        try {
          var h = deck.clientHeight || 1;
          page(Math.round(deck.scrollTop / h));
        } catch (e) {}
      }, { passive: true });
    } else {
      /* No observer: mark them all live rather than none. Everything degrades
         to "always on", which is worse for battery and correct for reading. */
      for (var b2 = 0; b2 < beats.length; b2++) beats[b2].classList.add("live");
      pageEverything();
    }
    if (beats[0]) {
      requestAnimationFrame(function () { beats[0].classList.add("live"); });
    }

    var total = s.cards.length + 1, deepest = 0, reported = false;
    /* The completion screen, once js/recommend.js has built it, and the
       paywall pane if the reader taps Keep learning with nothing left they
       may open. Declared here because onScroll below is what knows the
       reader has actually arrived at them. */
    var endPane = null, payPane = null;

    /* The end card is the pane after the last card, so any index at or past
       cards.length is it. The rail comes off there: that pane is the way out
       of the story rather than part of it, it carries its own single button,
       and two floating controls land on its words.

       This rides the scroll handler rather than the IntersectionObserver
       because the no-observer path marks every card live at once, and a rail
       that hides itself for the whole story is worse than one that never
       hides. Scroll is the coarser, always-true signal. */
    /* Past the last card is the end pane, which is not a card in the story:
       both rails come off it. The action rail because two floating controls
       land on its words, the progress rail because there is no card left for
       it to be pointing at. */
    function railFor(n) {
      var past = n >= s.cards.length;
      try { if (rail) rail.classList.toggle("is-off", past); } catch (e) {}
      /* toggle, not assign: writing className outright strips "vrail" off the
         element, which loses every rule that positions it — including the one
         that was meant to hide it. */
      try { if (vrail) vrail.classList.toggle("is-off", past); } catch (e) {}
    }

    function onScroll() {
      var h = deck.clientHeight || 1;
      var n = Math.round(deck.scrollTop / h);
      /* One segment per card, lit one at a time. Built on the first call
         rather than at boot, because the card count is not known until the
         story lands, and rebuilt only if that count changes. */
      if (vrail) {
        if (vrail.childNodes.length !== total) {
          var html = "", q;
          for (q = 0; q < total; q++) html += "<i></i>";
          vrail.innerHTML = html;
        }
        var kids = vrail.childNodes, j;
        for (j = 0; j < kids.length; j++) {
          kids[j].className = (j === n) ? "on" : "";
        }
      }
      if (n > deepest) deepest = n;
      railFor(n);
      if (P) P.mark(s.id, deepest, s.cards.length);
      /* The end card is built a dozen cards before anyone reaches it, so it
         cannot report itself seen at build time. reveal() is once-only, so
         calling it on every scroll frame past the last card is free. */
      /* Arriving at the end pane starts its hand-off; leaving it stops the
         hand-off dead. A reader who swipes back up into the story must not be
         navigated somewhere else three seconds later by a screen they are no
         longer on — see "THE CLOCK" in js/recommend.js, which also cancels on
         a hidden tab, on pagehide and on the back button. */
      if (endPane && n >= s.cards.length) {
        if (endPane.reveal) { try { endPane.reveal(); } catch (e) {} }
      } else if (endPane && endPane.leave) {
        try { endPane.leave(); } catch (e) {}
      }
    }
    deck.addEventListener("scroll", onScroll, { passive: true });
    onScroll();

    function report() {
      if (reported) return;
      reported = true;
      FB.track(deepest >= s.cards.length ? "stack_complete" : "stack_dropoff",
               { stack: s.id, card: String(deepest + 1) });
      if (P && deepest >= s.cards.length) P.complete(s.id, s.cards.length);
    }
    addEventListener("pagehide", report);
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") report();
    });

    /* Desktop: arrow keys move a card at a time. Phones swipe; nothing here
       overrides native scrolling, which is what broke the first build. */
    addEventListener("keydown", function (e) {
      /* Space activates whatever control has focus. Claiming it globally left
         every button on the page dead to the keyboard. */
      var t = e.target, tag = t && t.tagName ? t.tagName.toLowerCase() : "";
      if (tag === "button" || tag === "a" || tag === "input" || tag === "select" ||
          tag === "textarea" || (t && t.isContentEditable)) return;
      var d = e.key === "ArrowDown" || e.key === "PageDown" || e.key === " " ? 1
            : e.key === "ArrowUp" || e.key === "PageUp" ? -1 : 0;
      if (!d) return;
      e.preventDefault();
      goTo(deck.scrollTop + d * deck.clientHeight);
    });

    /* The end of a story is the highest-intent moment on the site, so it is
       a real panel of recommendations rather than one arbitrary next story.

       It needs every stack to choose from, and it sits below a dozen
       full-screen cards, so it is the one thing here worth fetching after
       the deck is on screen rather than before. The index is a quarter the
       size of the corpus it replaced, and nothing above this line waits for
       it. If it never arrives the story still reads to the end; only the
       recommendations are missing. */
    if (window.FBR && FBR.endPanel && FB.loadIndex) {
      FB.loadIndex().then(function (stacks) {
        var panel = null, builtFor = null;

        /* Which story Continue offers depends on what this reader may open, and
           that answer can arrive after the panel is built. Built once with the
           wrong answer, the end of a story sends a subscriber to checkout, or
           offers a signed-out reader a story that will meet them with a wall.
           So the panel records the answer it was built from and is rebuilt if
           the answer changes — the same render-then-correct the shelf, the home
           page and the library use, rather than a fourth opinion. */
        /* The wall, reached from the completion screen rather than instead of
           it. It is appended as one more pane and scrolled to, not swapped in
           over the deck: the reader arrived here having just finished a story,
           and swiping back up to that has to keep working. "Maybe later" is
           that same swipe, done for them.

           It is dropped whenever the card above it is rebuilt, because the
           access answer changing is exactly the case where a wall may no
           longer be the right thing to be sitting under. */
        function dropWall() {
          try { if (payPane && payPane.parentNode) payPane.parentNode.removeChild(payPane); } catch (e) {}
          payPane = null;
        }

        function wall(st) {
          var target = (st && st.id != null) ? st : s;
          if (payPane) { goTo(deck.scrollHeight); return; }
          var pane = buildPaywall(target, "endcard", function () {
            goTo(Math.max(0, deck.scrollTop - deck.clientHeight));
          });
          /* No recommend.js, no appended pane — the fallback replaces the
             deck, which is worse and is still a way in. */
          if (!pane) { showPaywall(target); return; }
          payPane = pane;
          deck.appendChild(pane);
          onScroll();
          goTo(deck.scrollHeight);
        }

        function build(allowed) {
          if (panel && builtFor === allowed) return;
          var fresh = FBR.endPanel(s, stacks, { n: 3, cta: window.FB_ENDCTA });
          if (!fresh) return;
          builtFor = allowed;
          /* What Keep learning does when the next story is not this reader's
             to open. Set after the call, not through it: tools/compose.py
             matches that call verbatim and an extra option in it fails the
             build of /cleopatra. */
          fresh.onLocked = wall;
          dropWall();
          /* The card being replaced may have a countdown running on it. It is
             about to leave the document, and a timer holding a reference to a
             detached node still fires. */
          try { if (panel && panel.leave) panel.leave(); } catch (e) {}
          if (panel && panel.parentNode) {
            if (io) { try { io.unobserve(panel); } catch (e) {} }
            panel.parentNode.replaceChild(fresh, panel);
          } else {
            deck.appendChild(fresh);
          }
          panel = fresh;
          endPane = fresh;
          if (io) { try { io.observe(panel); } catch (e) {} }
          else panel.classList.add("live");
          /* A reader can already be sitting on the last card when this lands. */
          onScroll();
        }

        build(FB.unlocked());
        try {
          if (window.FBX && FBX.paint) FBX.paint(function (a) { build(!!a); });
        } catch (e) {}

        /* The card also depends on the reader's own record — how many stories
           they have finished, which days they read on, and therefore which
           story Keep learning should offer next. js/progress.js answers "is
           this record this viewer's?" twice: a synchronous hint at load, then
           the real answer once Firebase has said who is holding the phone. So
           the same render-then-correct the access gate gets.

           Only the four reasons that mean the OWNER changed. "local" fires
           from FBP.mark() on every scroll frame, and rebuilding the end card
           a hundred times on the way down a story is how this becomes the
           reload loop /stories once had. */
        try {
          if (window.FBP && FBP.onChange) {
            FBP.onChange(function (why) {
              if (why !== "show" && why !== "hide" &&
                  why !== "clear" && why !== "replace") return;
              builtFor = null;
              build(FB.unlocked());
            });
          }
        } catch (e) {}
      }).catch(function () {});
    }
  }

  /* Guarded, like every other entry point on this site: an HTML file can be
     fresh while a cached gate.js is not, and a missing helper must cost a
     reader a slower page, never a blank one. */
  function storyPromise() {
    if (FB.loadStory) return FB.loadStory(id);
    var want = String(id == null ? "" : id).toUpperCase();
    return FB.load().then(function (stacks) {
      for (var q = 0; q < stacks.length; q++) {
        if (String(stacks[q].id).toUpperCase() === want) return stacks[q];
      }
      return null;
    });
  }

  storyPromise().then(function (s) {
    if (!s) { notInSeason(); return; }
    document.title = s.title + " · Factbox";

    /* Free is free for everyone. There is no question for the gate to answer,
       so nothing here asks it. */
    if (s.free) { render(s); return; }

    /* Locked. Asked after the wait, so this is the account's answer and not a
       guess made before it arrived. */
    /* Locked, and "locked" is now a per-STORY question rather than a
       per-reader one: js/access.js's canRead(id) is true when this reader has
       access, OR the story is permanently free, OR it is today's Factbox,
       which is free for everybody every day. FB.unlocked() only answers the
       first of the three, so asking it alone would put a wall in front of
       today's story. Guarded, because an older cached access.js has can()
       and not canRead(). */
    return accessSettled().then(function () {
      if (window.FBX && FBX.canRead) return FBX.canRead(s.id);
      return FB.unlocked();
    }).then(function (ok) {
      if (!ok) { showPaywall(s); return; }
      render(s);
    });
  }).catch(function () {
    deck.innerHTML = '<section class="pane"><h2>Could not load this story.</h2>' +
      '<p>Check your connection and reload.</p>' +
      '<a class="ghost" href="/explore">All stories</a></section>';
  });
})();
</script>
<script src="/js/audio-reader.js"></script>
<!-- No account control on this page. The reader is the story and the next
     one; a "Sign in" pill floating over a painting is a second offer at the
     moment the reader is inside the first. Sign-in lives on the pages that
     are about the account, and the paywall already carries the way in.

     js/auth.js stays, and is not the header: it publishes window.FBU, which
     js/access.js reads to answer "may this person read this". Removing it
     would lock a paying subscriber out of a story they have paid for. It is a
     module, so the browser defers it — it runs after the document is parsed
     and before DOMContentLoaded, whatever position this tag is in, and
     access.js reaches it through the whenFBU() bridge in AUTH.md §2. -->
<script type="module" src="/js/auth.js"></script>
<script src="/js/analytics.js"></script>
<!-- The sign-up ask the retired deck ended on, folded into the end card. -->
<script>
(function () {
  "use strict";

  /* The funnel's own route, the one the retired deck's button went to:
     FB.checkout(el, "story") -> /join?from=story. All three of these pages
     carry it; only the one that sets window.FB_ENDCTA puts it on screen. */
  var JOIN = "/join?from=story";
  /* The same words and the same destination as join.html's own line. */
  var SIGNIN = "/login?next=%2Fexplore";

  var deck = document.getElementById("deck");
  if (!deck) return;

  var CTA = "";
  try { CTA = window.FB_ENDCTA ? String(window.FB_ENDCTA) : ""; } catch (e) {}

  function ask(card) {
    var old = card.querySelector(".ec-go");
    if (!old) return;

    var a = document.createElement("a");
    a.className = old.className;          /* go ec-go, whichever shape it was */
    a.href = JOIN;
    a.setAttribute("role", "button");
    /* FB.checkout already sends subscribe_click; "-" is analytics.js's opt out
       and stops the same tap being counted twice. */
    a.setAttribute("data-fbt", "-");
    a.textContent = CTA;
    a.addEventListener("click", function (ev) {
      try {
        if (window.FB && typeof FB.checkout === "function") {
          if (ev && ev.preventDefault) ev.preventDefault();
          FB.checkout(a, "story");
        }
      } catch (e) {}
      /* No FB, or it threw: the href is the fallback and goes to the same URL. */
    }, false);
    old.parentNode.replaceChild(a, old);

    var p = document.createElement("p");
    p.className = "fine ec-signin";
    p.innerHTML = "Already have an account? " +
                  '<a href="' + SIGNIN + '">Sign in</a>';
    card.appendChild(p);
    /* css/recommend.css positions .ec-signin only under .has-ask, so the end
       card every other story ends on is left exactly as it was. */
    card.className += " has-ask";
  }

  function place() {
    try {
      if (!CTA) return;
      if (!deck.querySelector(".beat")) return;   /* no story, no pitch */
      var card = deck.querySelector(".pane.rec");
      if (!card || card.getAttribute("data-ask") === "1") return;
      card.setAttribute("data-ask", "1");
      ask(card);
    } catch (e) {}
  }

  try {
    if (window.MutationObserver) {
      var mo = new MutationObserver(place);
      mo.observe(deck, { childList: true });
      setTimeout(function () { try { mo.disconnect(); } catch (e) {} }, 40000);
    }
  } catch (e) {}

  var ticks = 0;
  (function tick() {
    place();
    ticks++;
    if (ticks < 60) setTimeout(tick, 300);
  })();
})();
</script>
</body>
</html>
