<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Factbox</title>
<meta name="theme-color" content="#090C16">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/img/icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<!-- The story's own file, requested from the first line of the head.

     A <link rel=preload as=fetch> was tried here first and measured as a
     second download: a preload only serves a request whose mode matches it,
     and the one FB.loadStory() makes does not. So this issues the real
     request instead and hands the promise on. gate.js adopts it rather than
     asking again, which is one request, started before gate.js has even been
     fetched — a whole round trip earlier on a cold webview.

     Nothing depends on this. No fetch, no match, a rejection: gate.js falls
     through to asking for itself, and then to the full corpus. -->
<script>
(function () {
  try {
    if (!window.fetch) return;
    var m = /[?&]s=([A-Za-z0-9_-]{1,24})(?:&|#|$)/.exec(location.search || "");
    if (!m) return;
    var id = m[1].toUpperCase();
    var p = fetch("/data/story/" + id + ".json", { cache: "force-cache" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      });
    /* A rejection nobody has subscribed to yet is still a rejection, and an
       unhandled one logs an error in the console of a page that is fine. */
    p["catch"](function () {});
    window.FB_STORY_PRE = { id: id, p: p };
  } catch (e) {}
})();
</script>
<!-- Discovery, in the head, before anything else runs.

     Which story this is lives in the query string, so no static <link> can
     name the two files that matter — and both of them were being found late.
     The story JSON is fetched by js/gate.js, a script the parser reaches
     partway down the page; the first card's painting is written into the DOM
     by JavaScript that runs after THAT, so the preload scanner never saw it at
     all. On a cold load the painting could not start before about 1.4 seconds
     on a page whose HTML had arrived in 300ms.

     Six lines of head script fix the ordering. Both names are derivable from
     the id — data/story/<ID>.json and the first card's plate, c<id>-01 — so
     nothing has to be looked up first. Both are guesses in the sense that a
     404 is possible; both are harmless if wrong, because the real fetch that
     follows is unchanged and a preload that misses costs one request.

     Deliberately not a module and deliberately inline: anything with a src
     would itself have to be discovered, which is the problem being solved. -->
<script>
(function () {
  try {
    var m = /[?&]s=([A-Za-z0-9_-]{1,24})/.exec(location.search || "");
    if (!m) return;
    var id = m[1].toUpperCase(), head = document.head;
    function pre(href, as, cors) {
      var l = document.createElement("link");
      l.rel = "preload"; l.href = href; l.as = as;
      if (cors) l.crossOrigin = "anonymous";
      head.appendChild(l);
    }
    pre("/data/story/" + id + ".json", "fetch", true);
    pre("/img/cards/c" + id.toLowerCase() + "-01.webp", "image");
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Newsreader as well as DM Sans. --display is the display serif every card
     headline, the end card and the wall are set in, and a token cannot fetch a
     font: a page that uses --display without adding the family here renders in
     Georgia, which is a real fallback and is not the design. Same string as
     /explore and / so the three share one cached stylesheet. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/loader.js"></script>
<link rel="stylesheet" href="/css/recommend.css">
<link rel="stylesheet" href="/css/scenes.css">
<link rel="stylesheet" href="/css/audio-reader.css">
<link rel="stylesheet" href="/css/reader-rail.css">
</head>
<body>

<!-- Where you are in the story: one clear segment per card down the right
     edge, the current one white and taller. This is the indicator the
     illustrated Cleopatra story has always used, and it says something the
     coral bar across the top could not — not just "some fraction in", but how
     many cards there are and which one this is. It is also out of the way: a
     full-bleed painting with a bar drawn across its top edge is a painting
     with a bar drawn across it. -->
<div class="vrail" id="vrail" aria-hidden="true"></div>
<div class="topbar"><a class="back" href="/explore">← Stories</a></div>

<!-- The reader's own two controls, as one column at the foot of the right
     edge: sound on top, the Save bookmark on the bottom. Empty markup — the
     save button is put here by the script below once a story renders, and the
     sound button by js/audio-reader.js once the deck has a card worth
     sounding. Neither is drawn on the paywall, and an empty rail paints
     nothing. Its floor sits on --bottom-safe; see css/reader-rail.css. -->
<div class="fb-rail" id="fb-rail"></div>

<main class="deck" id="deck" tabindex="-1">
  <section class="pane">
    <div class="fbload">
      <div class="fbload-track" aria-hidden="true"><i class="fbload-fill"></i></div>
      <p class="fbload-say" role="status">Unrolling the scroll. It is a long one…</p>
    </div>
    <a class="ghost" href="/explore" style="margin-top:22px">All stories</a>
  </section>
</main>
<noscript><p style="padding:24px;color:#FFF7ED">Factbox needs JavaScript to
read a story. <a href="/explore" style="color:#FF7A5C">All stories</a></p></noscript>

<script src="/js/drag-deck.js"></script>
<script src="/js/progress.js"></script>
<script src="/js/access.js"></script>
<script src="/js/gate.js"></script>
<!-- The price ladder. Nothing on this page may contain a dollar figure: the
     completion screen's offer line and every number on the paywall are read
     out of FBA, which is the one place that knows what Stripe charges. Without
     it js/recommend.js draws both screens with no amounts on them rather than
     with invented ones. -->
<script src="/js/account.js"></script>
<script src="/js/saves.js"></script>
<script src="/js/recommend.js"></script>
<script src="/js/scenes.js" defer></script>
<script>
(function () {
  var deck = document.getElementById("deck");
  var vrail = document.getElementById("vrail");

  /* Reading memory is a nice-to-have; the story is not. Losing progress.js must
     not cost the reader the words. */
  var P = window.FBP && FBP.mark ? FBP : null;

  /* Not URLSearchParams: it is absent on the older in-app webviews this site
     targets, and it sat on a top-level line, so its absence emptied the page. */
  var m = /[?&]s=([^&#]*)/.exec(location.search);
  var id = m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";

  /* Which cards carry the second artwork. Nearly every card in a stack shares
     the hero plate, which is why a stack costs one image to read; the
     supplementary plates are spread across the interior so the middle of a
     long stack is not the same painting eight times. */
  /* The padlock on the boundary, inline. The mockup draws it as an emoji;
     an emoji beside this typography is somebody else's artwork, at somebody
     else's colour, and it is the one glyph on a card a reader cannot
     restyle. Every other icon on this site is an inline SVG and so is this. */
  var LOCK_SVG =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"' +
      ' stroke-linecap="round" stroke-linejoin="round" focusable="false">' +
      '<rect x="4.5" y="10.5" width="15" height="10" rx="2.5"></rect>' +
      '<path d="M8.25 10.5V7.5a3.75 3.75 0 0 1 7.5 0v3"></path>' +
    '</svg>';

  function beat(c, plate, cap, cr, n, stack, peek) {
    var cls = "beat is-" + (c.beat || "card").replace(/[^a-z]/gi, "")
            + (c.long ? " is-long" : "");
    var body = c.body
      ? "<p>" + FB.esc(c.body) + "</p>" : "";
    var cite = c.src
      ? '<p class="cite">' + FB.esc(c.src) + "</p>" : "";
    /* The boundary, on the last card of a locked run: the NEXT card's own
       opening line at the opacity of something you cannot read yet, then a
       hairline with a padlock in it. Nothing invented — it is the story's
       own words, dimmed, so "there is more" is a thing the reader can see
       rather than a thing a screen asserts. */
    var edge = peek
      ? '<p class="fbw-peek">' + FB.esc(peek) + "</p>" +
        '<div class="fbw-rule" aria-hidden="true"><i></i><span>' +
          LOCK_SVG + "</span><i></i></div>"
      : "";
    /* Six camera variants, cycled by card index, so consecutive cards never
       share a move — a stack of nine identical slow pushes reads as a stall
       rather than as motion. Deterministic, so it is the same on every reload. */
    return '' +
      '<section class="' + cls + '"' +
        ' data-stack="' + FB.esc(stack.id) + '"' +
        ' data-topic="' + FB.esc(stack.topic || "") + '"' +
        ' data-beat="' + FB.esc(c.beat || "") + '"' +
        ' data-card="' + n + '"' +
        ' data-cam="' + (n % 6) + '">' +
        '<div class="art">' +
          /* Only the first card ships with a src. Every other painting is
             held in data-plate until the window below reaches it — see
             "Paging the paintings". The fallback is carried on the element
             too, because by the time onerror fires the stack it belongs to
             is long out of scope. */
          '<img alt="" decoding="async"' +
            (n === 0 ? ' fetchpriority="high" src="/img/cards/' + FB.esc(plate) + '.webp"'
                     : ' data-plate="/img/cards/' + FB.esc(plate) + '.webp"') +
            ' data-fallback="/img/stacks/' + FB.esc(stack.img) + '.webp"' +
            ' onerror="this.onerror=null;this.src=this.getAttribute(\'data-fallback\')">' +
        '</div>' +
        '<div class="copy">' +
          '<h2>' + FB.esc(c.head) + '</h2>' + body + cite + edge +
        '</div>' +
        '<p class="plate-credit">' + FB.creditLine(cap, cr) + '</p>' +
      '</section>';
  }

  /* ScrollToOptions on an element is iOS 14+. Below that the dictionary form
     resolves to NaN and scrolls to the top instead. */
  var SMOOTH = "scrollBehavior" in document.documentElement.style;
  function goTo(top) {
    var d = document.getElementById("deck");
    if (SMOOTH && d.scrollTo) d.scrollTo({ top: top, behavior: "smooth" });
    else d.scrollTop = top;
  }

  /* --------------------------------------------------------------------
     Sending the buyer back to the story they were reading.

     Stripe returns every buyer to
       https://factbox.app/stories?unlocked=1&session_id=...
     and that URL lives in the Stripe dashboard, not here (STRIPE.md 7).
     /stories forwards to /explore carrying the query string. So nothing on
     the return path is this file, and the only honest thing this page can do
     is write down where the reader was before handing them to checkout.

     Reading it back belongs on the page they land on, and that is /explore,
     which does it: explore.html reads this key on arrival, sends a reader who
     has paid straight to the story they left, and consumes the record either
     way. This note used to say nothing read the key. Something does.
     -------------------------------------------------------------------- */
  var RETURN_KEY = "fb_return_v1";
  function rememberStory(st) {
    try {
      if (!st || st.id == null) return;
      localStorage.setItem(RETURN_KEY,
        JSON.stringify({ s: String(st.id), at: Date.now() }));
    } catch (e) {}
  }

  /* The wall itself is built by js/recommend.js, which owns both it and the
     completion screen that leads to it, and which reads every price out of
     js/account.js. This is the fallback for a page whose recommend.js never
     arrived: the same two sentences, the same cover, a way in and a way out,
     and not one number it cannot price. */
  function paywallFallback(s) {
    return '' +
      '<section class="pane paywall pw">' +
        '<h2>Keep learning.</h2>' +
        '<p class="pw-sub">Your next story is already waiting.</p>' +
        '<div class="plate"><img alt="" src="/img/thumbs/' + FB.esc(s.img) + '.webp"' +
          ' data-fallback="/img/stacks/' + FB.esc(s.img) + '.webp"' +
          ' onerror="this.onerror=null;this.src=this.getAttribute(\'data-fallback\')"></div>' +
        '<p>' + FB.esc(s.title) + '</p>' +
        '<a class="go" href="/join?from=paywall&amp;s=' + encodeURIComponent(s.id) +
          '" role="button">Keep reading</a>' +
        '<a class="ghost" href="/explore">Back to stories</a>' +
      '</section>';
  }

  /* opts is passed straight through to FBR.paywall: where the reader came
     from, what "Maybe later" does, and what to remember before checkout. */
  /* sell  the story the sheet is ABOUT. null is legitimate: the ask at the
           end of /firststory is about the season, not about one story.
     keep  the story to hand the buyer back to after Stripe. Usually the same
           one; on /firststory it is the NEXT story, because sending somebody
           back to the one they just finished is not "more stories". */
  function buildPaywall(sell, from, later, head, keep) {
    try {
      if (window.FBR && FBR.paywall) {
        return FBR.paywall(sell, {
          from: from,
          head: head,
          onLater: later,
          onStart: function () { rememberStory(keep); }
        });
      }
    } catch (e) {}
    return null;
  }

  /* Both the story list and the answer to "is this reader a subscriber".
     Deciding on the first alone is what sent a signed-in subscriber into the
     sign-up funnel: FB.unlocked() is synchronous and Firebase is not, so the
     paywall rendered before the account had answered, and a reader could tap
     through it before the correction landed.

     Capped, so a reader whose auth never resolves still gets the page rather
     than a spinner. Falling through to the paywall is the safe direction —
     it offers a way in; a blank screen offers nothing. */

  /* One module owns both the answer and when it is knowable. */
  function accessSettled() {
    try {
      if (window.FBX && FBX.ready) return FBX.ready();
    } catch (e) {}
    return new Promise(function (done) {
      var n = 0;
      var t = setInterval(function () {
        n++;
        try {
          if (window.FBX && FBX.ready) { clearInterval(t); FBX.ready().then(done, done); }
          else if (n > 35) { clearInterval(t); done(); }
        } catch (e) { clearInterval(t); done(); }
      }, 200);
    });
  }

  /* --------------------------------------------------------------------
     What has to be in hand before the first card can be read — and what
     does not.

     This was Promise.all([FB.load(), accessSettled()]): the entire 413KB
     corpus AND the access gate, both resolved, before a single word was
     drawn. Both were the wrong thing to wait for.

     The corpus: one story is 12KB. FB.loadStory() fetches only that, and
     falls back to the monolith if the split file is not there.

     The gate: two of the fifty-one stories are free, and they are the two
     every new reader arrives on. Nothing about a free story depends on who
     is asking, so a free story no longer waits for the account to answer at
     all. A locked story still waits — drawing its text before the gate has
     spoken is exactly the bug this wait exists to prevent, and it stays
     prevented.
     -------------------------------------------------------------------- */

  function notInSeason() {
    /* A wrong id used to replace() straight to the shelf, which also ate the
       back entry, so the reader could not undo their own typo. */
    deck.innerHTML =
      '<section class="pane"><h1>That story is not in this season.</h1>' +
      '<p>The link may be mistyped.</p>' +
      '<a class="ghost" href="/explore">All stories</a></section>';
  }

  function fin(host, fn) {
    try { if (window.FBLoad && FBLoad.done) { FBLoad.done(host, fn); return; } } catch (e) {}
    fn();
  }

  /* --------------------------------------------------------------------
     A LOCKED STORY OPENS. IT JUST DOES NOT FINISH.

     This used to replace the deck with a wall: two manufactured screens
     standing in front of a story the reader had already chosen. What they
     met was a reproduction of the story and then a price.

     Now the story runs for real. FREE_RUN cards are drawn exactly as any
     other story's are — their own plates, their own credit lines, the same
     progress rail, the same save button — and the run stops at a boundary
     the reader can see. The sheet is what one more scroll past that boundary
     opens, and it opens OVER the story rather than instead of it, so the
     sentence they stopped on is still on the screen while they decide.

     WHY TWO CARDS. One card is a headline; the reader has not started. Three
     is most of a five-minute story given away on every locked URL, and the
     season is fifty-one of them. Two is a hook and its turn — enough that
     stopping costs something, which is the whole mechanism.

     Nothing here decides who may read. FBX.canRead does, above, and this is
     only ever called with its answer.
     -------------------------------------------------------------------- */
  var FREE_RUN = 2;

  function showWall(s) {
    var gate = buildPaywall(s, "paywall", null, "", s);

    if (!gate || typeof gate.open !== "function") {
      /* No recommend.js, or it fell all the way through to its own fallback
         pane. Either way the reader gets a complete screen with a way in and
         a way out, never a story that stops at nothing. */
      fin(deck, function () {
        if (gate) { deck.innerHTML = ""; deck.appendChild(gate); }
        else deck.innerHTML = paywallFallback(s);
      });
      FB.track("paywall_view", { stack: s.id });
    } else {
      render(s, { run: FREE_RUN, gate: gate });
    }

    /* Belt and braces. If premium lands after the wait gave up — a slow
       snapshot, a cold Firestore, a phone that just woke up — the reader is
       looking at a wall they have already paid to pass. The wall is what was
       drawn, so that is what gets passed in; FBX.correct owns the rest, and
       owns it for every page, so this cannot become a reload loop the way
       the hand-rolled version on the shelf did. */
    try { if (window.FBX && FBX.correct) FBX.correct(false); } catch (e) {}
  }

  function render(s, lock) {
    var io = null;

    /* The run this reader gets. All of it, or — for a locked story — the
       first few cards and a boundary. One card is always held back, whatever
       FREE_RUN says, because a "locked" story that hands over every card is
       not a boundary, it is a bug that reports nothing. */
    var cards = lock
      ? s.cards.slice(0, Math.max(1, Math.min(lock.run, s.cards.length - 1)))
      : s.cards;
    var nextCard = lock ? s.cards[cards.length] : null;

    /* One plate per card. The stack hero is only the fallback for a card the
       manifest did not cover, so a missing row degrades to the old behaviour
       rather than to an empty frame. */
    var html = cards.map(function (c, n) {
      var peek = (lock && nextCard && n === cards.length - 1)
        ? String(nextCard.head || nextCard.body || "") : "";
      return c.img ? beat(c, c.img, c.cap, c.cr, n, s, peek)
                   : beat(c, s.img, s.cap, s.cr, n, s, peek);
    }).join("");

    /* The tail. It is the room the gesture needs — a scroller whose last card
       is also its last pixel has nowhere to scroll TO — and it is the one way
       through for a reader whose sheet never opened: no listeners, a webview
       that swallows the events, JavaScript switched off entirely. The link is
       an <a> with a real href for exactly that last case. */
    /* SNAPPING GOES FROM MANDATORY TO PROXIMITY FOR A LOCKED RUN, and this
       is not cosmetic. css/app.css gives the deck `scroll-snap-type: y
       mandatory`, which is right for a story: every card is a full screen and
       the reader lands on one, never between two. It is wrong for a run that
       ENDS in a boundary, because the last card is then the last snap point —
       the browser refuses to rest anywhere below it, the tail can never be
       seen, and a scroll past the boundary is undone before it finishes.
       Proximity keeps card-to-card snapping and lets the scroller rest at the
       foot of the tail, which is where the way through lives. The class is
       only ever on a locked run; every other story keeps mandatory. */
    if (lock) {
      try { deck.className = "deck is-wall"; } catch (e) {}
      html += '<div class="fbw-gap">' +
        "<p>One more scroll to carry on with this story.</p>" +
        '<a class="ghost fbw-more" href="/join?from=paywall&amp;s=' +
          encodeURIComponent(s.id) + '">Keep reading</a>' +
        "</div>";
    }

    var h1 = document.createElement("h1");
    h1.className = "sr-title";
    h1.textContent = s.title;
    document.body.insertBefore(h1, document.body.firstChild);

    fin(deck, function () { deck.innerHTML = html; });
    FB.track("stack_open", { stack: s.id });

    /* Saving lives at the foot of the right edge, under the sound button, in
       the rail every app this reader arrives from puts it in. It used to sit
       beside the back button, top-left — the furthest point on the screen
       from the thumb holding the phone. The behaviour is unchanged: the same
       FBS.button(), the same bookmark, the same aria-pressed. Only the
       address is new. */
    var rail = document.getElementById("fb-rail");
    if (window.FBS) {
      var save = FBS.button(s.id, function (isSaved) {
        FB.track(isSaved ? "save_add" : "save_remove", { stack: s.id });
      }, s.title);
      if (save && rail) rail.appendChild(save);
    }

    /* Offer to pick up where they stopped rather than jumping there. A silent
       jump into the middle of a story is disorienting; an offer is not. */
    /* Not on a locked run: an offer to jump to card seven, on a page that
       stops at card two, is an offer to go somewhere that is not there. */
    var chip = !lock && P && P.resumeChip && P.resumeChip(s.id, s.cards.length, function (card) {
      goTo(card * deck.clientHeight);
      FB.track("resume_used", { stack: s.id, card: String(card + 1) });
    });
    if (chip) {
      document.body.appendChild(chip);
      /* js/progress.js builds this chip's two buttons with no id and no class,
         so js/analytics.js's delegated click listener has nothing to name them
         by. Name them here, where the chip is known: the first already reports
         itself as resume_used above, the second -- "start from the beginning"
         -- has never been measured at all and now arrives as ui_click. */
      try {
        var chipBtns = chip.getElementsByTagName("button");
        if (chipBtns[0]) chipBtns[0].setAttribute("data-fbt", "-");
        if (chipBtns[1]) chipBtns[1].setAttribute("data-fbt", "resume_dismiss");
      } catch (e) {}
      deck.addEventListener("scroll", function once() {
        deck.removeEventListener("scroll", once);
        setTimeout(function () { try { chip.dismiss(); } catch (e) {} }, 2500);
      }, { passive: true });
    }

    /* Progress, and the drop-off card index — the number the CTO README says
       actually pays. Reported once per stack, at the deepest card reached. */
    /* `live` marks the card on screen. The motion, atmosphere and sound layers
       all key off it, and at most one card is ever animating or audible.

       The first card gets it on the next frame rather than waiting for the
       observer's first tick, and — the lesson from shipping a wordless page —
       nothing that can throw runs before this point. */
    /* Press and pull with a mouse moves the deck, the way a thumb does on a
       phone. Touch is untouched; see js/drag-deck.js. */
    try { if (window.FBDrag) FBDrag.attach(deck); } catch (e) {}

    var beats = [].slice.call(deck.querySelectorAll(".beat, .pane"));

    /* ----------------------------------------------------------------------
       Paging the paintings.

       A story is eight to thirteen cards and every card is a painting; the
       mean is 210KB and the worst is 449KB, so opening one used to mean
       committing to one to three megabytes of pictures the reader may never
       scroll to. The card text is not the problem and is not paged — the
       whole story's copy is about 12KB in one file, and splitting that into
       pages would cost more in round trips than it could ever save.

       So: card 0 has a src in the markup and is preloaded in the head. Every
       other painting waits in data-plate until the reader is within AHEAD
       cards of it, which keeps roughly two loading in front of them at all
       times — far enough that the next card is decoded before it is reached,
       near enough that reaching card three has never fetched card ten.

       Loaded plates are never unloaded. Coming back up a story you have just
       read should cost nothing, and an <img> whose src is removed is a blank
       frame the moment it scrolls back into view.
       ---------------------------------------------------------------------- */
    var AHEAD = 2;
    function page(from) {
      try {
        var i, hi = Math.min(beats.length - 1, from + AHEAD);
        /* One behind as well: scrolling back up must never show an empty
           frame, and it is one request, already in cache in the common case. */
        for (i = Math.max(0, from - 1); i <= hi; i++) {
          var img = beats[i] && beats[i].querySelector("img[data-plate]");
          if (!img) continue;
          img.src = img.getAttribute("data-plate");
          img.removeAttribute("data-plate");
          /* The card being read outranks the ones being fetched ahead of it. */
          try { img.setAttribute("fetchpriority", i === from ? "high" : "low"); } catch (e) {}
        }

           separate script with no way into this closure, and it is published
           HERE, inside the end-card branch, because that is the only place
           the sheet has a story to be about. The link's href survives as the
           no-JS path and as the fallback if this never runs. */
        /* The ask, opened by a tap — or reopened on the way back from a
           sign-in that took the reader off this page. Both go through the
           same call, with the same words and the same story, because they
           are the same sheet; `restoring` only changes whether it is opened
           outright or handed to its own restore(). */
        function endGate(restoring) {
          /* Nothing was interrupted: this reader finished a free story. So
             the sheet is not selling one particular story, and it says so.
             `null` for the stack, deliberately: the next story on the card
             may be free too, and putting its title on a purchase sheet
             would be selling something that is already open. */
          wall(null, {
            blank: true,
            from: "story",
            head: "Read the rest.",
            /* The story the card was about to open, so the buyer comes back
               to something they have not read. Null when there is nothing
               left to offer, and then nothing is written down and Stripe's
               own return to the shelf stands. */
            keep: (panel && panel.nextStory) || null,
            restore: !!restoring
          });
        }

        try {
          window.FB_ENDGATE = function () { endGate(false); };
        } catch (e) {}

        /* --------------------------------------------------------------
           COMING BACK FROM SIGN-IN, AT THE END OF A STORY.

           The boundary of a locked story is not the only place this sheet
           opens. /firststory ends on the same one — an account, then the
           offer — and /story and /cleopatra open it from the end card when
           the next story is not this reader's to open. None of those runs
           are locked, so none of them go through the block above, and the
           reader who answered that sheet came back to the top of a story
           they had already finished with nothing on the screen. Scrolling
           the whole way down again was the only way back to the offer they
           were one tap from. That is the bug.

           js/recommend.js owns the record and its TTL. This asks whether one
           is standing, works out which sheet it named, and rebuilds it —
           once. `restored` is not about being tidy: build() runs again every
           time the access answer or the reader's own record changes, and a
           sheet that reappeared on each of those would be one the reader
           could not get rid of. */
        function restoreWall() {
          if (restored) return;
          var want = null;
          try {
            if (!window.FBR || !FBR.pending) return;
            want = FBR.pending();
          } catch (e) { return; }
          if (!want) return;
          restored = true;
          var sid = String(want.s || "");
          /* No story on the record: the ask at the end of a free story, which
             sells the season rather than one story and writes "". */
          if (!sid) { endGate(true); return; }
          /* A story on it: the wall the end card opens over a locked next
             story. It has to be a story that is still in the season — a
             renamed or retired id gets the record dropped rather than a
             sheet about nothing. */
          var st = null, q;
          for (q = 0; q < stacks.length; q++) {
            if (String(stacks[q].id) === sid) { st = stacks[q]; break; }
          }
          if (!st) {
            try { if (FBR.forgetPending) FBR.forgetPending(); } catch (e) {}
            return;
          }
          wall(st, { from: "endcard", restore: true });
        }

        build(FB.unlocked());
        restoreWall();
        try {
          if (window.FBX && FBX.paint) FBX.paint(function (a) { build(!!a); restoreWall(); });
        } catch (e) {}

        /* The card also depends on the reader's own record — how many stories
           they have finished, which days they read on, and therefore which
           story Keep learning should offer next. js/progress.js answers "is
           this record this viewer's?" twice: a synchronous hint at load, then
           the real answer once Firebase has said who is holding the phone. So
           the same render-then-correct the access gate gets.

           Only the four reasons that mean the OWNER changed. "local" fires
           from FBP.mark() on every scroll frame, and rebuilding the end card
           a hundred times on the way down a story is how this becomes the
           reload loop /stories once had. */
        try {
          if (window.FBP && FBP.onChange) {
            FBP.onChange(function (why) {
              if (why !== "show" && why !== "hide" &&
                  why !== "clear" && why !== "replace") return;
              builtFor = null;
              build(FB.unlocked());
            });
          }
        } catch (e) {}
      }).catch(function () {});
    }
  }

  /* Guarded, like every other entry point on this site: an HTML file can be
     fresh while a cached gate.js is not, and a missing helper must cost a
     reader a slower page, never a blank one. */
  function storyPromise() {
    if (FB.loadStory) return FB.loadStory(id);
    var want = String(id == null ? "" : id).toUpperCase();
    return FB.load().then(function (stacks) {
      for (var q = 0; q < stacks.length; q++) {
        if (String(stacks[q].id).toUpperCase() === want) return stacks[q];
      }
      return null;
    });
  }

  storyPromise().then(function (s) {
    if (!s) { notInSeason(); return; }
    document.title = s.title + " · Factbox";

    /* Free is free for everyone. There is no question for the gate to answer,
       so nothing here asks it. */
    if (s.free) { render(s); return; }

    /* Locked. Asked after the wait, so this is the account's answer and not a
       guess made before it arrived. */
    /* Locked, and "locked" is now a per-STORY question rather than a
       per-reader one: js/access.js's canRead(id) is true when this reader has
       access, OR the story is permanently free, OR it is today's Factbox,
       which is free for everybody every day. FB.unlocked() only answers the
       first of the three, so asking it alone would put a wall in front of
       today's story. Guarded, because an older cached access.js has can()
       and not canRead(). */
    return accessSettled().then(function () {
      if (window.FBX && FBX.canRead) return FBX.canRead(s.id);
      return FB.unlocked();
    }).then(function (ok) {
      if (!ok) { showWall(s); return; }
      /* They can read it — which is the answer for a reader who signed in and
         already had a subscription. Whatever they were doing at the boundary
         before they left, the offer is not the thing to come back to, so the
         record of that trip is dropped here rather than left for the end card
         to find and rebuild a wall out of. */
      try { if (window.FBR && FBR.forgetPending) FBR.forgetPending(); } catch (e) {}
      render(s);
    });
  }).catch(function () {
    deck.innerHTML = '<section class="pane"><h2>Could not load this story.</h2>' +
      '<p>Check your connection and reload.</p>' +
      '<a class="ghost" href="/explore">All stories</a></section>';
  });
})();
</script>
<script src="/js/audio-reader.js"></script>
<!-- No account control on this page. The reader is the story and the next
     one; a "Sign in" pill floating over a painting is a second offer at the
     moment the reader is inside the first. Sign-in lives on the pages that
     are about the account, and the paywall already carries the way in.

     js/auth.js stays, and is not the header: it publishes window.FBU, which
     js/access.js reads to answer "may this person read this". Removing it
     would lock a paying subscriber out of a story they have paid for. It is a
     module, so the browser defers it — it runs after the document is parsed
     and before DOMContentLoaded, whatever position this tag is in, and
     access.js reaches it through the whenFBU() bridge in AUTH.md §2. -->
<script type="module" src="/js/auth.js"></script>
<script src="/js/analytics.js"></script>
</body>
</html>
